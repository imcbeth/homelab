# Pre-commit hooks for homelab Kubernetes repository
# See https://pre-commit.com for more information
# Installation: pip install pre-commit && pre-commit install

repos:
  # General file checks
  # git-crypt-encrypted paths (per .gitattributes): secrets/**, *secret*, *.key, *-sealed.yaml.
  # These are binary in CI (no decryption key), so any text-mutating hook MUST skip them.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        exclude: '(^secrets/|.*secret.*|.*\.key$|.*-sealed\.ya?ml$)'
      - id: end-of-file-fixer
        name: Fix end of files
        exclude: '(^secrets/|.*secret.*|.*\.key$|.*-sealed\.ya?ml$)'
      - id: check-yaml
        name: Check YAML syntax
        exclude: '(^secrets/|.*secret.*|.*\.key$|.*-sealed\.ya?ml$)'
        args: ['--unsafe']  # Allow custom tags in Kubernetes manifests
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: mixed-line-ending
        name: Check line endings
        args: ['--fix=lf']
        exclude: '(^secrets/|.*secret.*|.*\.key$|.*-sealed\.ya?ml$)'
      - id: detect-private-key
        name: Detect private keys
        exclude: '(^secrets/|.*secret.*|.*\.key$|.*-sealed\.ya?ml$)'

  # YAML linting with Kubernetes-friendly rules
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        name: Lint YAML files
        exclude: '^(secrets/.*|manifests/base/grafana/dashboards/.*\.yaml|.*-sealed\.yaml)$'  # Exclude git-crypt encrypted files, Grafana dashboards, and SealedSecrets
        args:
          - '-d'
          - |
            extends: default
            rules:
              line-length:
                max: 250
              document-start: disable
              truthy:
                check-keys: false
              indentation:
                spaces: 2
                indent-sequences: consistent
              comments:
                min-spaces-from-content: 1

  # Kubernetes manifest validation using kubeconform
  - repo: local
    hooks:
      - id: kubeconform
        name: Validate Kubernetes manifests
        entry: scripts/validate-manifests.sh
        language: system
        pass_filenames: false
        files: '^manifests/.*\.ya?ml$'
        exclude: '^secrets/.*'
        verbose: true
        description: 'Validate Kubernetes manifests against schemas (manifests without available schemas are skipped due to -ignore-missing-schemas)'

      - id: kustomize-build
        name: Validate kustomizations build
        entry: scripts/validate-kustomizations.sh
        language: system
        pass_filenames: false
        files: '^manifests/.*\.ya?ml$'
        exclude: '^secrets/.*'
        verbose: true
        description: 'Run kustomize build on every kustomization.yaml and validate the rendered output with kubeconform. Skips locally if kustomize is not installed; CI always runs it.'

  # Secret scanning to prevent accidental commits
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks
        name: Detect secrets and credentials
        exclude: '^(secrets/.*|manifests/base/.*/secret\.yaml|manifests/base/.*/.*-secret\.yaml|manifests/base/external-dns/secret-.*\.yaml|.*-sealed\.yaml)'

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args: ['--fix', '--disable', 'MD013', 'MD033']
        exclude: '(^secrets/|.*secret.*|.*\.key$|.*-sealed\.ya?ml$)'
        # MD013: Line length
        # MD033: Inline HTML

  # Check for TODO/FIXME in commits (warning only)
  - repo: local
    hooks:
      - id: check-todos
        name: Check for TODO/FIXME markers
        entry: bash
        args:
          - -c
          - |
            files=$(git diff --cached --diff-filter=d --name-only)
            if [ -n "$files" ]; then
              echo "$files" | xargs grep -nHE "TODO|FIXME" 2>/dev/null && echo "Warning: Found TODO/FIXME markers" || true
            fi
            exit 0
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
