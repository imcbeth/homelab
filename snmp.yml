# SNMP Exporter Configuration for Synology NAS
# This file serves as documentation and reference for the SNMP configuration
# The actual config is deployed via ConfigMap in manifests/base/kube-prometheus-stack/

# Module for Synology NAS with SNMPv3 authentication (RECOMMENDED)
synology:
  version: 3
  auth:
    username: snmp_monitor              # SNMP v3 username - SET IN SYNOLOGY
    security_level: authPriv             # authPriv for encryption + authentication
    password: REPLACE_WITH_AUTH_PASS    # Authentication password - STORE IN SECRET
    auth_protocol: SHA                   # SHA (recommended) or MD5
    priv_protocol: AES                   # AES (recommended) or DES
    priv_password: REPLACE_WITH_PRIV_PASS # Privacy/encryption password - STORE IN SECRET
    context_name: ""
  walk:
    - 1.3.6.1.2.1.1      # System information
    - 1.3.6.1.2.1.2      # Interfaces
    - 1.3.6.1.2.1.25     # Host resources (CPU, Memory, Storage)
    - 1.3.6.1.4.1.6574   # Synology-specific OIDs
  metrics:
    - name: sysUpTime
      oid: 1.3.6.1.2.1.1.3
      type: gauge
      help: System uptime in hundredths of a second
    - name: sysName
      oid: 1.3.6.1.2.1.1.5
      type: DisplayString
      help: System name
    - name: diskStatus
      oid: 1.3.6.1.4.1.6574.2.1.1.5
      type: gauge
      help: Disk status (1=Normal, 2=Initialized, 3=NotInitialized, 4=SystemPartitionFailed, 5=Crashed)
      indexes:
      - labelname: diskIndex
        type: gauge
    - name: diskTemperature
      oid: 1.3.6.1.4.1.6574.2.1.1.6
      type: gauge
      help: Disk temperature in Celsius
      indexes:
      - labelname: diskIndex
        type: gauge
    - name: raidStatus
      oid: 1.3.6.1.4.1.6574.3.1.1.3
      type: gauge
      help: RAID status (1=Normal, 11=Degraded, 12=Crashed)
      indexes:
      - labelname: raidIndex
        type: gauge
    - name: systemStatus
      oid: 1.3.6.1.4.1.6574.1.1
      type: gauge
      help: System status (1=Normal, 2=Failed)
    - name: temperature
      oid: 1.3.6.1.4.1.6574.1.2
      type: gauge
      help: CPU temperature in Celsius
    - name: systemFanStatus
      oid: 1.3.6.1.4.1.6574.1.4.1
      type: gauge
      help: System fan status (1=Normal, 2=Failed)
    - name: cpuFanStatus
      oid: 1.3.6.1.4.1.6574.1.4.2
      type: gauge
      help: CPU fan status (1=Normal, 2=Failed)
    - name: ifInOctets
      oid: 1.3.6.1.2.1.2.2.1.10
      type: counter
      help: Octets received on interface
      indexes:
      - labelname: ifIndex
        type: gauge
    - name: ifOutOctets
      oid: 1.3.6.1.2.1.2.2.1.16
      type: counter
      help: Octets transmitted on interface
      indexes:
      - labelname: ifIndex
        type: gauge
    - name: hrMemorySize
      oid: 1.3.6.1.2.1.25.2.2
      type: gauge
      help: Total memory size in KB
    - name: hrStorageUsed
      oid: 1.3.6.1.2.1.25.2.3.1.6
      type: gauge
      help: Storage used
      indexes:
      - labelname: hrStorageIndex
        type: gauge
    - name: hrStorageSize
      oid: 1.3.6.1.2.1.25.2.3.1.5
      type: gauge
      help: Storage size
      indexes:
      - labelname: hrStorageIndex
        type: gauge
  lookups:
    - source_indexes: [diskIndex]
      lookup: 1.3.6.1.4.1.6574.2.1.1.2
    - source_indexes: [raidIndex]
      lookup: 1.3.6.1.4.1.6574.3.1.1.2
    - source_indexes: [hrStorageIndex]
      lookup: 1.3.6.1.2.1.25.2.3.1.3
    - source_indexes: [ifIndex]
      lookup: 1.3.6.1.2.1.2.2.1.2
