---
# Object-count quotas for stable, predictable namespaces.
#
# Purpose: cap blast radius from a runaway controller or resource leak. These
# are intentionally NOT memory/CPU quotas (too easy to mis-size and block valid
# scale-up); just object counts that detect "something is creating an unexpected
# number of pods/PVCs/configmaps".
#
# Quotas use the count/* form so they apply uniformly to every resource of
# that kind (including ones created by jobs/cronjobs/owner refs).
#
# Sizing rule of thumb: 3-5x current count, with a floor that accommodates
# normal day-to-day churn (rolling updates, blackout deploys, ad-hoc debugging).
#
# Excluded from this rollout:
#   - kube-system, calico-system, tigera-operator, gatekeeper-system (system,
#     gatekeeper-system already has a quota from its Helm chart)
#   - argo-workflows, argo-events (dynamic workflow pods)
#   - flink-demo, flink-operator, kafka, strimzi-system (operator-managed scale)
#   - chaos-mesh (intentionally injects pods)
#   - trivy-system (creates per-image scan jobs)
#   - falco (DaemonSet, runtime-security scope)
#   - loki (singleBinary + sidecars, narrow margin)
#   - istio-system (operator-managed)
#   - default (catch-all, mixed workloads)
#   - secrets-source, velero-test, kube-node-lease, kube-public (empty/test)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: object-count-quota
  namespace: argocd
spec:
  hard:
    count/pods: "40"
    count/persistentvolumeclaims: "10"
    count/services: "25"
    count/configmaps: "100"
    count/secrets: "50"
