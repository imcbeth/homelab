apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sBlockNodePort
metadata:
  name: block-nodeport
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # Dryrun mode: log violations without blocking requests
  # Switch to "deny" after auditing existing workloads
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Service"]
