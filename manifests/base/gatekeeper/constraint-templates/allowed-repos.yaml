apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sallowedrepos
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    description: Restricts container images to approved registries.
spec:
  crd:
    spec:
      names:
        kind: K8sAllowedRepos
      validation:
        openAPIV3Schema:
          type: object
          properties:
            repos:
              description: List of allowed container image registry prefixes.
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sallowedrepos

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not image_matches(container.image, input.parameters.repos)
          msg := sprintf("Container <%v> has an invalid image repo <%v>, allowed repos are %v", [container.name, container.image, input.parameters.repos])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.initContainers[_]
          not image_matches(container.image, input.parameters.repos)
          msg := sprintf("Init container <%v> has an invalid image repo <%v>, allowed repos are %v", [container.name, container.image, input.parameters.repos])
        }

        # Match images against allowed repositories
        # Exact match (e.g., exact digest or rare edge case)
        image_matches(image, repos) {
          repo := repos[_]
          image == repo
        }

        # Prefix match with slash separator (e.g., "docker.io/" matches "docker.io/nginx")
        # This ensures "docker.io" won't match "docker.io.evil.com/foo"
        image_matches(image, repos) {
          repo := repos[_]
          startswith(image, sprintf("%v/", [repo]))
        }

        # Handle Docker Hub shortnames (e.g., "nginx", "velero/velero:v1.17.2")
        # These images have no domain (no dots before the first slash, or no slash at all)
        image_matches(image, repos) {
          is_dockerhub_shortname(image)
          repo := repos[_]
          repo == "docker.io"
        }

        # An image is a Docker Hub shortname if it has no domain component
        # Domain components contain dots (e.g., "gcr.io", "registry.k8s.io")
        is_dockerhub_shortname(image) {
          not contains(image, "/")
        }

        # When there is a slash, treat the first path segment as a Docker Hub shortname
        # only if it is not an explicit registry (no '.', no ':', and not 'localhost').
        # This prevents misclassifying images like 'localhost:5000/myimg' as Docker Hub.
        is_dockerhub_shortname(image) {
          contains(image, "/")
          prefix := substring(image, 0, indexof(image, "/"))
          not contains(prefix, ".")
          not contains(prefix, ":")
          prefix != "localhost"
        }
