apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sblocknodeport
  annotations:
    description: Prevents creation of NodePort services (use MetalLB LoadBalancer instead).
spec:
  crd:
    spec:
      names:
        kind: K8sBlockNodePort
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sblocknodeport

        violation[{"msg": msg}] {
          input.review.object.spec.type == "NodePort"
          msg := sprintf("Service <%v/%v> is of type NodePort, which is not allowed. Use type LoadBalancer (MetalLB) or ClusterIP instead.", [input.review.object.metadata.namespace, input.review.object.metadata.name])
        }
