apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Constraint Templates (policy definitions)
  # These create the CRDs that Constraints depend on
  - constraint-templates/require-resource-limits.yaml
  - constraint-templates/allowed-repos.yaml
  - constraint-templates/require-labels.yaml
  - constraint-templates/block-nodeport.yaml
  - constraint-templates/container-limits.yaml

  # Monitoring
  - podmonitor.yaml
