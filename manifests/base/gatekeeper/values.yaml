# OPA Gatekeeper Configuration for Raspberry Pi 5 Kubernetes Homelab
# Cluster: 5x Pi 5 nodes (16GB each, 80GB total)
# Purpose: Admission control and policy enforcement

# =============================================================================
# Replica Configuration
# =============================================================================
# 2 replicas + hard pod anti-affinity → PDB minAvailable=1 can be satisfied
# during drain (one replica evicts cleanly, the other keeps webhook alive).
# Previously replicas=1 + PDB minAvailable=1 was a chicken-and-egg: evict
# would drop below minAvailable, drain hung for 5min PDB timeout before
# --force killed the pod. Fixed 2026-07-30 during 1.35 → 1.36 upgrade
# retrospective (node04 drain hit this).
replicas: 2

# =============================================================================
# Audit Configuration
# =============================================================================
# 5-minute audit interval to reduce CPU load on Pi cluster (default 60s)
auditInterval: 300
constraintViolationsLimit: 20
auditFromCache: false

audit:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# =============================================================================
# Controller Manager Configuration
# =============================================================================
controllerManager:
  # System namespaces exempt from admission control to avoid chicken-and-egg issues
  exemptNamespaces:
    - kube-system
    - argocd
    - gatekeeper-system
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # HARD anti-affinity — override the chart's default "preferred" (soft)
  # rule with "required" so the 2 replicas MUST land on different nodes.
  # This is what makes replicas=2 + PDB minAvailable=1 actually correct:
  # even during drain, at least one replica is always available on a
  # different node.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: gatekeeper.sh/operation
                operator: In
                values:
                  - webhook
          topologyKey: kubernetes.io/hostname

# =============================================================================
# Logging & Events
# =============================================================================
logLevel: INFO
logDenies: true

# =============================================================================
# Mutation (enabled, default is already false for disableMutation)
# =============================================================================
disableMutation: false

# =============================================================================
# Prometheus Metrics
# =============================================================================
# Gatekeeper exposes metrics on port 8888 by default (metricsBackends: prometheus)
metricsBackends: ["prometheus"]

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8888"
