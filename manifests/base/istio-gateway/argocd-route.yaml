# argocd.k8s.n37.ca on lan-gateway (Phase 1, 2026-11-15). No forward-auth
# (not in authz.yaml): Argo CD has its own SSO, as on ingress-nginx.
#
# argocd-server runs with server.insecure since 2026-11-15, so the gateway
# talks plain HTTP to it (inside HBONE mTLS, since argocd was enrolled in
# ambient on 2026-11-17 -- before that the hop was plaintext, O17) -- no TLS
# origination and no DestinationRule. Native gRPC from the argocd CLI (content-type
# application/grpc, not grpc-web) needs HTTP/2 to the backend, so it goes to
# the h2c port `http2` (8080); the UI, REST API and grpc-web use `http` (80).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  parentRefs:
    - name: lan-gateway
      namespace: istio-system
      sectionName: https-argocd
  hostnames:
    - argocd.k8s.n37.ca
  rules:
    - matches:
        - headers:
            - name: content-type
              type: RegularExpression
              value: "^application/grpc(\\+.*)?$"
      filters:
        # Security headers ingress-nginx added to every response (gateway.yaml)
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
              - name: X-Frame-Options
                value: DENY
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - name: Permissions-Policy
                value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=()
            remove:
              - X-Powered-By
      backendRefs:
        - name: argocd-server
          port: 8080
    - filters:
        # Security headers ingress-nginx added to every response (gateway.yaml)
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
              - name: X-Frame-Options
                value: DENY
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - name: Permissions-Policy
                value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=()
            remove:
              - X-Powered-By
      backendRefs:
        - name: argocd-server
          port: 80
