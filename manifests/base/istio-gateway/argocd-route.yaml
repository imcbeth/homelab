# argocd.k8s.n37.ca on lan-gateway (Phase 1, 2026-11-15). No forward-auth
# (not in authz.yaml): Argo CD has its own SSO, as on ingress-nginx.
#
# argocd-server runs with server.insecure since 2026-11-15, so the gateway
# talks plain HTTP to it (inside HBONE mTLS) -- no TLS origination and no
# DestinationRule. Native gRPC from the argocd CLI (content-type
# application/grpc, not grpc-web) needs HTTP/2 to the backend, so it goes to
# the h2c port `http2` (8080); the UI, REST API and grpc-web use `http` (80).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  parentRefs:
    - name: lan-gateway
      namespace: istio-system
      sectionName: https-argocd
  hostnames:
    - argocd.k8s.n37.ca
  rules:
    - matches:
        - headers:
            - name: content-type
              type: RegularExpression
              value: "^application/grpc(\\+.*)?$"
      backendRefs:
        - name: argocd-server
          port: 8080
    - backendRefs:
        - name: argocd-server
          port: 80
