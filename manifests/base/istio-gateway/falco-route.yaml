apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: falco-ui
  namespace: falco
  annotations:
    # Same TTL the Ingress used. external-dns-unifi publishes this route's
    # hostname at the lan-gateway address (10.0.10.11).
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  parentRefs:
    - name: lan-gateway
      namespace: istio-system
      sectionName: https-falco
  hostnames:
    - falco.k8s.n37.ca
  rules:
    - filters:
        # Security headers ingress-nginx added to every response (gateway.yaml)
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
              - name: X-Frame-Options
                value: DENY
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - name: Permissions-Policy
                value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=()
            remove:
              - X-Powered-By
      backendRefs:
        - name: falco-falcosidekick-ui
          port: 2802
