# The LAN gateway replacing ingress-nginx (runbooks/ingress-nginx-replacement.md,
# O4). Phase 0 proved oauth2-proxy forward-auth through it (2026-11-15) under
# its prototype name; renamed for Phase 1, where hosts move onto it one at a
# time. It has its own MetalLB address (10.0.10.11); ingress-nginx stays on
# 10.0.10.10 until the last host has moved. Until a host's DNS record moves,
# test it with (a listener with no route answers 404)
#   curl --resolve <host>:443:10.0.10.11 https://<host>/
#
# Lives in istio-system because the proxy image comes from registry.istio.io,
# which the Gatekeeper allowed-repos constraint rejects everywhere except the
# namespaces excluded from it (istio-system is one). The default proxy
# resources carry limits (2 CPU / 1Gi), which require-resource-limits needs.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lan-gateway
  namespace: istio-system
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      metallb.io/loadBalancerIPs: 10.0.10.11
    labels:
      app.kubernetes.io/name: lan-gateway
  listeners:
    # Plain HTTP on 80 for every host, answered only by http-redirect.yaml
    # (301 to https). ingress-nginx did this by default for every TLS
    # Ingress; without it http://<host> was connection refused here.
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-falco
      hostname: falco.k8s.n37.ca
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          # Issued in istio-system by certificates.yaml. One listener and one
          # certificate per host, so a host can move (or move back) alone.
          - kind: Secret
            name: falco-k8s-n37-ca-gw-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: falco
    - name: https-localstack
      hostname: localstack.k8s.n37.ca
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: localstack-k8s-n37-ca-gw-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: localstack
    - name: https-grafana
      hostname: grafana.k8s.n37.ca
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: grafana-k8s-n37-ca-gw-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: default
    - name: https-flink
      hostname: flink.k8s.n37.ca
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: flink-k8s-n37-ca-gw-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: flink-demo
    - name: https-workflows
      hostname: workflows.k8s.n37.ca
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: workflows-k8s-n37-ca-gw-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argo-workflows
    - name: https-status
      hostname: status.k8s.n37.ca
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: status-k8s-n37-ca-gw-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
    - name: https-argocd
      hostname: argocd.k8s.n37.ca
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: argocd-k8s-n37-ca-gw-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
    - name: https-registry
      hostname: registry.k8s.n37.ca
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: registry-k8s-n37-ca-gw-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: zot
    - name: https-oauth
      hostname: oauth.k8s.n37.ca
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: oauth-k8s-n37-ca-gw-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: oauth2-proxy
    - name: https-lifeonabike
      hostname: lifeonabike.ca
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: lifeonabike-ca-gw-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: lifeonabike
    - name: https-www-lifeonabike
      hostname: www.lifeonabike.ca
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: lifeonabike-ca-gw-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: lifeonabike
