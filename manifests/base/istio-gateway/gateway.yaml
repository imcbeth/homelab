# The LAN gateway replacing ingress-nginx (runbooks/ingress-nginx-replacement.md,
# O4). Phase 0 proved oauth2-proxy forward-auth through it (2026-11-15) under
# its prototype name; renamed for Phase 1, where hosts move onto it one at a
# time. It has its own MetalLB address (10.0.10.11); ingress-nginx stays on
# 10.0.10.10 until the last host has moved. Until a host's DNS record moves,
# test it with
#   curl --resolve <host>:443:10.0.10.11 https://<host>/
#
# Lives in istio-system because the proxy image comes from registry.istio.io,
# which the Gatekeeper allowed-repos constraint rejects everywhere except the
# namespaces excluded from it (istio-system is one). The default proxy
# resources carry limits (2 CPU / 1Gi), which require-resource-limits needs.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lan-gateway
  namespace: istio-system
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      metallb.io/loadBalancerIPs: 10.0.10.11
    labels:
      app.kubernetes.io/name: lan-gateway
  listeners:
    - name: https-falco
      hostname: falco.k8s.n37.ca
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          # Issued in istio-system by certificates.yaml. One listener and one
          # certificate per host, so a host can move (or move back) alone.
          - kind: Secret
            name: falco-k8s-n37-ca-gw-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: falco
