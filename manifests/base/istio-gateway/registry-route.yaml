# registry.k8s.n37.ca (zot) on lan-gateway (Phase 1). No forward-auth: docker
# and Renovate cannot follow an OAuth redirect; zot does its own htpasswd auth.
# nginx's proxy-body-size 0 has no equivalent to carry: Envoy does not limit
# streamed request bodies. Route timeouts are off by default in Istio, which
# covers nginx's 600 s for large layer pushes.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zot
  namespace: zot
  annotations:
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  parentRefs:
    - name: lan-gateway
      namespace: istio-system
      sectionName: https-registry
  hostnames:
    - registry.k8s.n37.ca
  rules:
    - filters:
        # Security headers ingress-nginx added to every response (gateway.yaml)
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
              - name: X-Frame-Options
                value: DENY
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - name: Permissions-Policy
                value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=()
            remove:
              - X-Powered-By
      backendRefs:
        - name: zot
          port: 5000
