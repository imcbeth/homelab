# flink.k8s.n37.ca (Flink JobManager UI) on lan-gateway (Phase 1).
# Forward-auth (listed in authz.yaml). The backend Service exists only while
# the flink-demo job runs; until then the route reports ResolvedRefs=False
# and answers 500, as nginx answered 503.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flink-demo
  namespace: flink-demo
  annotations:
    external-dns.alpha.kubernetes.io/ttl: "300"
    # The backend exists only while the flink-demo job runs, so this route is
    # ResolvedRefs=False most of the time and Argo CD would mark the whole
    # istio-gateway app Degraded, hiding real degradation in it.
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  parentRefs:
    - name: lan-gateway
      namespace: istio-system
      sectionName: https-flink
  hostnames:
    - flink.k8s.n37.ca
  rules:
    - filters:
        # Security headers ingress-nginx added to every response (gateway.yaml)
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
              - name: X-Frame-Options
                value: DENY
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - name: Permissions-Policy
                value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=()
            remove:
              - X-Powered-By
      backendRefs:
        - name: kafka-to-s3-rest
          port: 8081
