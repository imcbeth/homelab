# flink.k8s.n37.ca (Flink JobManager UI) on lan-gateway (Phase 1).
# Forward-auth (listed in authz.yaml). The backend Service exists only while
# the flink-demo job runs; until then the route reports ResolvedRefs=False
# and answers 500, as nginx answered 503.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flink-demo
  namespace: flink-demo
  annotations:
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  parentRefs:
    - name: lan-gateway
      namespace: istio-system
      sectionName: https-flink
  hostnames:
    - flink.k8s.n37.ca
  rules:
    - backendRefs:
        - name: kafka-to-s3-rest
          port: 8081
