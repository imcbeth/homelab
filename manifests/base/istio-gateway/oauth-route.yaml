# oauth.k8s.n37.ca (oauth2-proxy's own sign-in and callback) on lan-gateway
# (Phase 1). Never forward-authed -- this IS the auth endpoint.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
  annotations:
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  parentRefs:
    - name: lan-gateway
      namespace: istio-system
      sectionName: https-oauth
  hostnames:
    - oauth.k8s.n37.ca
  rules:
    - filters:
        # Security headers ingress-nginx added to every response (gateway.yaml)
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
              - name: X-Frame-Options
                value: DENY
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - name: Permissions-Policy
                value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=()
            remove:
              - X-Powered-By
      backendRefs:
        - name: oauth2-proxy
          port: 4180
