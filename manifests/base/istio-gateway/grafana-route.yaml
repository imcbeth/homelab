# grafana.k8s.n37.ca on lan-gateway (Phase 1, 2026-11-15). No forward-auth
# (not in authz.yaml): Grafana has its own login, as on ingress-nginx.
# nginx's rate limits (100 rps / 20 conns) are dropped deliberately -- LAN-only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  parentRefs:
    - name: lan-gateway
      namespace: istio-system
      sectionName: https-grafana
  hostnames:
    - grafana.k8s.n37.ca
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
