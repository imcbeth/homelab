# lifeonabike.ca + www on lan-gateway -- the LAN path only (Phase 1). Public
# traffic goes through the Cloudflare tunnel straight to the web Service and
# is unaffected. No forward-auth: it is the public site.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: lifeonabike
  annotations:
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  parentRefs:
    - name: lan-gateway
      namespace: istio-system
      sectionName: https-lifeonabike
    - name: lan-gateway
      namespace: istio-system
      sectionName: https-www-lifeonabike
  hostnames:
    - lifeonabike.ca
    - www.lifeonabike.ca
  rules:
    - filters:
        # Security headers ingress-nginx added to every response (gateway.yaml)
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
              - name: X-Frame-Options
                value: DENY
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - name: Permissions-Policy
                value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=()
            remove:
              - X-Powered-By
      backendRefs:
        - name: web
          port: 80
