# Forward-auth to oauth2-proxy for everything through the LAN gateway,
# via the `oauth2-proxy` extensionProvider in istiod-values.yaml. This is the
# Phase 0 result: signed out -> 302 to GitHub with an absolute return URL
# (#1181); signed in -> the app, which needs oauth2-proxy's static://200 (#1183).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: lan-gateway-oauth2
  namespace: istio-system
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: lan-gateway
  action: CUSTOM
  provider:
    name: oauth2-proxy
  rules:
    - {}
