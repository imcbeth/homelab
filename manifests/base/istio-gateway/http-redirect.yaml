# Catch-all http -> https redirect on lan-gateway's port-80 listener, the
# equivalent of ingress-nginx's default ssl-redirect for TLS Ingresses. No
# hostnames, so external-dns publishes nothing for it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: istio-system
spec:
  parentRefs:
    - name: lan-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
