# Prometheus scrape of lan-gateway (2026-11-15). Istio's merged metrics
# endpoint on port `metrics` (15020, /stats/prometheus) carries the Envoy and
# istio_requests_total series the "LAN Gateway (Istio)" Grafana dashboard
# uses. Nothing scraped the gateway before this; ingress-nginx's own
# ServiceMonitor went with it in Phase 2. default's egress and istio-system's
# ingress already admit 15020.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: lan-gateway
  namespace: istio-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: lan-gateway
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 30s
