# Istiod Control Plane Values - Ambient Mode
# Optimized for Raspberry Pi 5 cluster (5 nodes, 80GB RAM, 20 ARM cores)
#
# Key decisions:
# - Ambient mode enabled (sidecarless architecture)
# - No per-pod sidecars = 90% reduction in overhead vs sidecar mode
# - Resource limits tuned for Pi cluster
# - ztunnel DaemonSet handles L4 mTLS (deployed separately)

# Enable ambient mode (required for ztunnel to work)
pilot:
  env:
    PILOT_ENABLE_AMBIENT: "true"

# Resource limits for istiod
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 200m
    memory: 512Mi

# Single replica for homelab
replicaCount: 1

# Disable autoscaling
autoscaleEnabled: false

# Anti-affinity disabled for small cluster
affinity: {}

# Revision tag (empty for default)
revision: ""
