# Istiod Control Plane Values - Ambient Mode
# Optimized for Raspberry Pi 5 cluster (5 nodes, 80GB RAM, 20 ARM cores)
#
# Key decisions:
# - Ambient mode enabled (sidecarless architecture)
# - No per-pod sidecars = 90% reduction in overhead vs sidecar mode
# - Resource limits tuned for Pi cluster
# - ztunnel DaemonSet handles L4 mTLS (deployed separately)

# Enable ambient mode (required for ztunnel to work)
pilot:
  env:
    PILOT_ENABLE_AMBIENT: "true"

# Resource limits for istiod (actual usage ~42Mi)
# Right-sized from 256Mi/512Mi to match actual usage with headroom
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Single replica for homelab
replicaCount: 1

# Disable autoscaling
autoscaleEnabled: false

# Anti-affinity disabled for small cluster
affinity: {}

# Revision tag (empty for default)
revision: ""

# Forward-auth provider for Gateway API gateways (O4 Phase 0, 2026-11-15).
# Does nothing until a CUSTOM AuthorizationPolicy names it
# (manifests/base/istio-gateway/authz.yaml). oauth2-proxy already runs with
# upstream static://202 and a .k8s.n37.ca cookie, which is the shape Envoy
# ext_authz expects: 2xx = allow, anything else is returned to the client.
meshConfig:
  extensionProviders:
    - name: oauth2-proxy
      envoyExtAuthzHttp:
        service: oauth2-proxy.oauth2-proxy.svc.cluster.local
        port: 4180
        includeRequestHeadersInCheck:
          - authorization
          - cookie
          - x-forwarded-proto
          - x-forwarded-host
        headersToUpstreamOnAllow:
          - authorization
          - x-auth-request-user
          - x-auth-request-email
        headersToDownstreamOnDeny:
          - content-type
          - set-cookie
          - location
        headersToDownstreamOnAllow:
          - set-cookie
