# Flink Kubernetes Operator v1.14.0 values
# Chart: flink-kubernetes-operator (archive.apache.org)

# Use Docker Hub image (ARM64 confirmed); default ghcr.io image is the same binary
image:
  repository: apache/flink-kubernetes-operator
  tag: "1.14.0"

# Watch all namespaces so FlinkDeployments can be created in any namespace
# (e.g., flink-demo, and future application namespaces)
watchNamespaces: []

operatorPod:
  # Labels required by Gatekeeper require-labels constraint
  labels:
    app.kubernetes.io/name: flink-kubernetes-operator

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  webhook:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
