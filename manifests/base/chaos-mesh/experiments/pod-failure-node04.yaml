---
# Node Failure Simulation — node04 Pod Eviction
# Schedule: Monthly, 1st of month 06:00 MT (12:00 UTC)
# Target: All pods on node04 (only has Falco Redis PVC — most tolerant of brief outage)
# Duration: 5 minutes — simulates node04 going offline
# Purpose: Tests cluster resilience to single-node failure without actual drain
#          (avoids iSCSI VolumeAttachment issues that actual drain/cordon causes)
#
# SAFETY NOTE: node04 iSCSI PVC = falco/falco-falcosidekick-ui-redis-data (2Gi)
# pod-failure does NOT drop iSCSI sessions (node stays online) — PVC re-attaches cleanly

apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: pod-failure-node04
  namespace: chaos-mesh
  labels:
    app.kubernetes.io/name: chaos-mesh
    app.kubernetes.io/component: experiment
    chaos-mesh.org/experiment-type: pod-failure
spec:
  schedule: "0 12 1 * *"  # 1st of month 12:00 UTC = 06:00 MT
  type: PodChaos
  historyLimit: 3
  concurrencyPolicy: Forbid
  # 60s catch-up window. If the controller was down when this slot was
  # scheduled, do NOT fire a catch-up run on recovery — wait for the
  # next scheduled slot. Fixed 2026-07-12 after the controller-recovery
  # cascade fired backlogged runs immediately.
  startingDeadlineSeconds: 60
  podChaos:
    action: pod-failure
    mode: all
    selector:
      nodeSelectors:
        kubernetes.io/hostname: node04
      # SAFETY (2026-07-12): exclude chaos-mesh's own components from
      # the target set. Previously with `mode: all + nodeSelectors: node04`,
      # this experiment killed chaos-daemon-s8bwr (chaos-mesh's own
      # reconciler on node04), which broke chaos-mesh's ability to
      # restore the pause-swap → 11-day self-lockup discovered on
      # 2026-07-12. All chaos-mesh pods carry `app.kubernetes.io/name:
      # chaos-mesh` — excluding that value cleanly excludes them all.
      expressionSelectors:
        - key: app.kubernetes.io/name
          operator: NotIn
          values:
            - chaos-mesh
    duration: "5m"
