---
# CPU Stress Experiment — Resource Limit Enforcement Validation
# Schedule: Weekly Wednesday 05:00 MT (11:00 UTC)
# Target: unipoller pod (low-risk, stateless, recovers immediately)
# Duration: 3 minutes
# Purpose: Validates Gatekeeper CPU limits actually protect node stability

apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: cpu-stress-unipoller
  namespace: chaos-mesh
  labels:
    app.kubernetes.io/name: chaos-mesh
    app.kubernetes.io/component: experiment
    chaos-mesh.org/experiment-type: cpu-stress
spec:
  schedule: "0 11 * * 3"  # Wednesdays 11:00 UTC = 05:00 MT
  type: StressChaos
  historyLimit: 5
  concurrencyPolicy: Forbid
  # 60s catch-up window — don't fire backlogged runs after controller recovery.
  startingDeadlineSeconds: 60
  stressChaos:
    mode: one
    selector:
      namespaces:
        - unipoller
      labelSelectors:
        # NOTE: actual pod label is `unifi-poller` (hyphen). Prior value
        # `unipoller` (no hyphen) silently matched no pods — Selected=False,
        # records=0 on every fire since inception. Discovered 2026-07-15.
        app.kubernetes.io/name: unifi-poller
    stressors:
      cpu:
        workers: 2
        load: 80
    duration: "3m"
