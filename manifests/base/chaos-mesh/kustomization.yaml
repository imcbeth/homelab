apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Monitoring integration
  - servicemonitor.yaml
  # Chaos experiments (Schedule CRDs).
  #
  # Un-suspended 2026-07-12 with safety fixes in place after the earlier
  # same-day discovery of the 11-day self-lockup. Fixes applied per spec:
  #
  #   - pod-failure-node04: added expressionSelector `app.kubernetes.io/name
  #     NotIn [chaos-mesh]` to exclude chaos-mesh's own components from the
  #     target set. Prevents the previous "kill your own reconciler" trap.
  #   - All 4 specs: `startingDeadlineSeconds: 60` prevents catch-up storms
  #     when the controller recovers from downtime (root cause of the
  #     2026-07-12 controller-recovery cascade).
  #   - pod-kill-prometheus: no spec change. iSCSI RO cascade risk is
  #     managed by the pvc-ro-remediator (~4 min detection + auto-recover),
  #     and today's accidental catch-up run showed Prometheus recovers
  #     cleanly from forced kills — accepted risk.
  #   - network-delay-loki + cpu-stress-unipoller: no spec change beyond
  #     startingDeadlineSeconds. The ip-set failures observed 2026-07-12
  #     were a symptom of the paused chaos-daemon, not a bug — verify
  #     next Wed run applies cleanly.
  - experiments/pod-kill-prometheus.yaml
  - experiments/network-delay-loki.yaml
  - experiments/cpu-stress-unipoller.yaml
  - experiments/pod-failure-node04.yaml
