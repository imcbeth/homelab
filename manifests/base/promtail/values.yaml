# Promtail configuration for Raspberry Pi cluster
# Deployed as DaemonSet - one pod per node (5 total)
# Collects logs from all Kubernetes pods and sends to Loki

# DaemonSet configuration
daemonset:
  enabled: true

# Resource limits per pod (5 pods total)
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

# Use pod network to avoid Calico CNI issues (learned from control plane monitoring)
hostNetwork: false
hostPID: true

# Loki client configuration
config:
  # Send logs to Loki service
  clients:
    - url: http://loki.loki.svc.cluster.local:3100/loki/api/v1/push

  # Scrape configuration for Kubernetes pods
  snippets:
    scrapeConfigs: |
      # Collect logs from all Kubernetes pods
      - job_name: kubernetes-pods
        pipeline_stages:
          - cri: {}
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Only scrape running pods
          - source_labels:
              - __meta_kubernetes_pod_phase
            regex: Running
            action: keep
          # Add namespace label
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          # Add pod name label
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
          # Add container name label
          - source_labels:
              - __meta_kubernetes_pod_container_name
            target_label: container
          # Add node name label (useful for Pi cluster debugging)
          - source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: node
          # Add pod labels as Loki labels (selective to avoid label limit)
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          # Drop noisy labels to stay under Loki's 15 label limit
          # These labels have high cardinality or aren't useful for querying
          - action: labeldrop
            regex: (controller_revision_hash|pod_template_generation|pod_template_hash|helm_sh_chart|app_kubernetes_io_version|app_kubernetes_io_managed_by|statefulset_kubernetes_io_pod_name|apps_kubernetes_io_pod_index)
          # Set the log file path
          - source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*$1/*.log

# ServiceMonitor for Prometheus - Enable metrics collection
serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

# Tolerations to run on all nodes including control-plane
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# Node selector (run on all nodes)
nodeSelector: {}
