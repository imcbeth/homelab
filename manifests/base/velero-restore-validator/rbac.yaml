---
# RBAC for the monthly restore validator.
#
# Deliberately two namespaced Roles rather than one ClusterRole. The job needs
# to create and delete pods, but only ever in the scratch namespace — granting
# that cluster-wide would hand this ServiceAccount pod-create everywhere, which
# is a meaningful privilege surface for a once-a-month reporting job.
#
# Keeping it namespaced is only possible because these manifests live OUTSIDE
# manifests/base/velero/, whose kustomization sets `namespace: velero` and
# would silently rewrite the velero-restore-test RoleBinding into velero,
# breaking it. Same transformer trap documented on remediator-deadman.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: velero-restore-validator
  namespace: velero
  labels:
    app.kubernetes.io/name: velero-restore-validator
---
# In `velero`: read backups, and drive restores.
# No delete on backups — this job must never be able to destroy the very
# artifacts it exists to validate.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: velero-restore-validator
  namespace: velero
  labels:
    app.kubernetes.io/name: velero-restore-validator
rules:
  - apiGroups: ["velero.io"]
    resources: ["backups"]
    verbs: ["get", "list"]
  - apiGroups: ["velero.io"]
    resources: ["restores"]
    verbs: ["get", "list", "create", "delete"]
---
# PersistentVolumes are cluster-scoped, so reclaiming them needs a
# ClusterRole. Deliberately get/list/PATCH only — never delete.
#
# A restored PVC inherits the SOURCE volume's reclaim policy, and most
# volumes here use synology-iscsi-RETAIN, so deleting the PVC leaves the PV
# Released and its NAS LUN allocated. This job leaked two 2Gi LUNs that way
# on 2026-09-09, found by cluster-healthcheck the next day.
#
# Patch is sufficient and delete is not needed: a Released PV whose policy is
# flipped to Delete is torn down by the PV controller, LUN included. Verified
# 2026-09-10 — an orphan disappeared 20 seconds after the patch. Granting
# cluster-wide delete on persistentvolumes would let a bug in this script
# destroy production data; patch cannot.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: velero-restore-validator-pv
  labels:
    app.kubernetes.io/name: velero-restore-validator
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: velero-restore-validator-pv
  labels:
    app.kubernetes.io/name: velero-restore-validator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: velero-restore-validator-pv
subjects:
  - kind: ServiceAccount
    name: velero-restore-validator
    namespace: velero
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: velero-restore-validator
  namespace: velero
  labels:
    app.kubernetes.io/name: velero-restore-validator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: velero-restore-validator
subjects:
  - kind: ServiceAccount
    name: velero-restore-validator
    namespace: velero
---
# In `velero-restore-test`: create the verify pod, read its result, and clean
# up. `pods/log` is how the verification result is read back — there is
# deliberately no `pods/exec`, because the verify pod asserts its own result in
# its exit code rather than being driven interactively.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: velero-restore-validator
  namespace: velero-restore-test
  labels:
    app.kubernetes.io/name: velero-restore-validator
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: velero-restore-validator
  namespace: velero-restore-test
  labels:
    app.kubernetes.io/name: velero-restore-validator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: velero-restore-validator
subjects:
  - kind: ServiceAccount
    name: velero-restore-validator
    namespace: velero
