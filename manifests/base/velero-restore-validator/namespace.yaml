---
# Scratch namespace the monthly restore validation restores INTO.
#
# Declared in git rather than created at runtime so the validator's
# ServiceAccount never needs namespace create/delete rights. The namespace is
# expected to be empty between runs; anything lingering here is either a run in
# progress or the debris of a failed one, and is worth looking at.
#
# Nothing else may be deployed here. A restore into a namespace that already
# holds objects of the same name is a merge, not a clean test, and would make
# the result meaningless.
apiVersion: v1
kind: Namespace
metadata:
  name: velero-restore-test
  labels:
    app.kubernetes.io/name: velero-restore-test
    app.kubernetes.io/part-of: velero-restore-validator
    # `baseline`, not `restricted`, and deliberately so.
    #
    # The verify pod must READ arbitrary restored data. Under `restricted` it
    # is forced to run non-root, and would then fail on any file the original
    # workload wrote with restrictive ownership — reporting a permissions
    # artifact as data loss. A validator that cries wolf gets ignored, which
    # is the exact failure this whole component exists to prevent.
    #
    # Running as root with a READ-ONLY mount, all capabilities dropped and no
    # privilege escalation makes the test measure the data rather than the
    # file modes. The blast radius is one short-lived busybox pod in a
    # namespace that holds nothing else.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
