# RBAC allowing the argo-events Sensor to submit Workflows in this namespace.
# Managed by the argo-workflows ArgoCD application so it lives alongside
# the WorkflowTemplate it grants access to.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lifeonabike-workflow-submitter
  namespace: argo-workflows
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows, workflowtemplates]
    verbs: [create, get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lifeonabike-workflow-submitter
  namespace: argo-workflows
subjects:
  - kind: ServiceAccount
    name: lifeonabike-sensor-sa
    namespace: argo-events
roleRef:
  kind: Role
  name: lifeonabike-workflow-submitter
  apiGroup: rbac.authorization.k8s.io
