# Daily cluster health-check CronWorkflow.
#
# Runs every day at 06:00 MT and checks:
#   1. ArgoCD — any apps not Synced + Healthy
#   2. Pods     — any pods not Running/Completed/Succeeded
#   3. PVs      — any PersistentVolumes in Released state (orphaned iSCSI LUNs)
#   4. Velero   — last scheduled backup phase for each schedule
#   5. Gatekeeper — total violation count across all constraints
#
# If any check finds issues, the report-issues step fires an AlertManager
# alert (ClusterHealthDegraded) which routes to email via the existing
# kube-prometheus-stack AlertManager SMTP integration.
#
# On a clean run, no alert is fired and the workflow succeeds quietly.
# Completed workflows are kept for 2h (success) or 8h (failure) for log review.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: cluster-healthcheck
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: cluster-healthcheck
    app.kubernetes.io/component: monitoring
spec:
  schedules:
    - "0 6 * * *"
  timezone: "America/Edmonton"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  workflowSpec:
    serviceAccountName: cluster-healthcheck
    entrypoint: healthcheck

    podMetadata:
      labels:
        app.kubernetes.io/name: cluster-healthcheck

    # memory RAISED 128Mi -> 256Mi on 2026-09-10. All six steps run
    # bitnami/kubectl, a Debian-based image that does not fit in 128Mi. The
    # `check-pods` step was OOMKilled (exit 137), which failed the whole
    # workflow — so the DAILY health check has not actually been checking
    # anything.
    #
    # Identical to the bug fixed in backup-validation-workflow.yaml on
    # 2026-09-09 (PR #925). That fix was applied to the one workflow being
    # investigated and not to its siblings, which is why this survived
    # another day. lifeonabike-build-workflow.yaml uses the same 64Mi/128Mi
    # defaults but has not OOMKilled — its steps do less — so it is left
    # alone rather than changed speculatively.
    #
    # NOTE ON FAILURE SEMANTICS: the `evaluate` step exits 1 BY DESIGN when
    # it finds problems, after POSTing ClusterHealthDegraded to AlertManager.
    # A Failed workflow here is therefore ambiguous — it means either "checks
    # found issues" or "a step broke". Read the node that failed before
    # concluding anything.
    # `script:`, NOT `container:` — every template in this workflow is a
    # script template, and templateDefaults only merges into the matching
    # field. A `templateDefaults.container` block here merged into nothing at
    # all, so all six steps silently fell back to the workflow-controller
    # ConfigMap's mainContainer default of 100m/128Mi.
    #
    # That is what caused the check-pods OOMKill, and why raising the numbers
    # under `container:` on 2026-09-10 changed nothing — verified by reading
    # limits off the running pods, which still showed 128Mi. By contrast
    # backup-validation-workflow.yaml uses container templates, so its
    # templateDefaults.container DOES apply (its pods measured 256Mi).
    templateDefaults:
      script:
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 200m
            memory: 256Mi

    ttlStrategy:
      secondsAfterSuccess: 7200    # 2h
      secondsAfterFailure: 28800   # 8h

    templates:
      # -----------------------------------------------------------------------
      # Main entrypoint — run all checks in parallel, then evaluate + report
      # -----------------------------------------------------------------------
      - name: healthcheck
        steps:
          - - name: check-argocd
              template: check-argocd
            - name: check-pods
              template: check-pods
            - name: check-pvs
              template: check-pvs
            - name: check-velero
              template: check-velero
            - name: check-gatekeeper
              template: check-gatekeeper

          - - name: evaluate
              template: evaluate
              arguments:
                parameters:
                  - name: argocd-result
                    value: "{{steps.check-argocd.outputs.result}}"
                  - name: pods-result
                    value: "{{steps.check-pods.outputs.result}}"
                  - name: pvs-result
                    value: "{{steps.check-pvs.outputs.result}}"
                  - name: velero-result
                    value: "{{steps.check-velero.outputs.result}}"
                  - name: gatekeeper-result
                    value: "{{steps.check-gatekeeper.outputs.result}}"

      # -----------------------------------------------------------------------
      # Check 1: ArgoCD application health
      # Output: "OK" or "ISSUES: <app1> <app2> ..."
      # -----------------------------------------------------------------------
      - name: check-argocd
        script:
          image: registry.k8s.n37.ca/bitnami/kubectl:latest
          command: [bash]
          source: |
            set -uo pipefail
            # Fail closed: a kubectl error or an empty list is an issue, not
            # "OK" (until 2026-11-17 both printed a hardcoded "all 26 apps").
            if ! APPS=$(kubectl get applications -n argocd -o json 2>/tmp/err); then
              echo "ISSUES: cannot list Applications: $(head -1 /tmp/err)"; exit 0
            fi
            TOTAL=$(echo "$APPS" | jq '.items | length')
            BAD=$(echo "$APPS" | jq -r '.items[]
              | select(.status.sync.status != "Synced" or .status.health.status != "Healthy")
              | "\(.metadata.name)=\(.status.sync.status)/\(.status.health.status)"' | tr '\n' ' ')
            if [ "$TOTAL" -eq 0 ]; then
              echo "ISSUES: no Applications found in argocd"
            elif [ -n "$BAD" ]; then
              echo "ISSUES: $BAD"
            else
              echo "OK: all $TOTAL apps Synced+Healthy"
            fi

      # -----------------------------------------------------------------------
      # Check 2: Pod health across all namespaces
      # Ignores Completed/Succeeded pods (Jobs are fine)
      # Output: "OK" or "ISSUES: <pod-summaries>"
      # -----------------------------------------------------------------------
      - name: check-pods
        script:
          image: registry.k8s.n37.ca/bitnami/kubectl:latest
          command: [bash]
          # Kept at template level because this step needs MORE than the
          # workflow default, not because templateDefaults is broken.
          #
          # CORRECTION to an earlier comment here: mainContainer does not
          # override templateDefaults. The real cause was that
          # templateDefaults declared `container:` while every template in
          # this workflow is `script:`, so it merged into nothing and the
          # controller default (128Mi) applied. That is fixed above.
          #
          # 128Mi is too tight for this step specifically. It runs TWO
          # full-cluster queries back to back in one container: a filtered
          # `get pods -A -o json` piped to jq, then an unfiltered
          # `get pods -A -o jsonpath` across all 153 pods (~2.9 MiB of JSON).
          # Measured in isolation the peaks were 51 MiB and 83 MiB — both
          # under 128Mi — but Go does not return freed heap to the OS, so
          # cumulative RSS across the pair exceeds the limit and the container
          # is OOMKilled (exit 137).
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          source: |
            set -uo pipefail
            # Flag non-Running/Succeeded pods with phase-specific rules:
            #   Pending  — only after 5 minutes (avoids false positives from transient
            #              workflow step pods still pulling images on startup)
            #   Failed / Unknown — flagged immediately (genuine failure states)
            # Also CrashLoopBackOff / Error / OOMKilled containers in Running pods.
            # Fails closed if the pod list can't be read.
            if ! PODS=$(kubectl get pods --all-namespaces -o json 2>/tmp/err); then
              echo "ISSUES: cannot list pods: $(head -1 /tmp/err)"; exit 0
            fi
            TOTAL=$(echo "$PODS" | jq '.items | length')
            BAD=$(echo "$PODS" | jq -r '.items[]
              | select(.status.phase != "Running" and .status.phase != "Succeeded")
              | select(.status.phase != "Pending" or
                  (now - (.metadata.creationTimestamp | fromdateiso8601)) > 300)
              | "\(.metadata.namespace)/\(.metadata.name)=\(.status.phase)"')
            CRASH=$(echo "$PODS" | jq -r '.items[] | . as $p | .status.containerStatuses[]?
              | select((.state.waiting.reason // "") | test("^(CrashLoopBackOff|Error|OOMKilled)$"))
              | "\(.state.waiting.reason)/\(.restartCount)@\($p.metadata.namespace)/\($p.metadata.name)"' | head -10)
            if [ "$TOTAL" -eq 0 ]; then
              echo "ISSUES: no pods found"
            elif [ -z "$BAD" ] && [ -z "$CRASH" ]; then
              echo "OK: all $TOTAL pods healthy"
            else
              echo "ISSUES: bad_pods=$(echo $BAD | tr '\n' '|') crash=$(echo $CRASH | tr '\n' '|')"
            fi

      # -----------------------------------------------------------------------
      # Check 3: PersistentVolumes — detect Released state (= orphaned LUN)
      # Output: "OK" or "ISSUES: <pv-names>"
      # -----------------------------------------------------------------------
      - name: check-pvs
        script:
          image: registry.k8s.n37.ca/bitnami/kubectl:latest
          command: [bash]
          source: |
            set -uo pipefail
            # Fails closed if the PV list can't be read or is empty (every
            # stateful app here is on iSCSI PVs, so zero means a broken read).
            if ! PVS=$(kubectl get pv -o json 2>/tmp/err); then
              echo "ISSUES: cannot list PVs: $(head -1 /tmp/err)"; exit 0
            fi
            TOTAL=$(echo "$PVS" | jq '.items | length')
            RELEASED=$(echo "$PVS" | jq -r '.items[] | select(.status.phase == "Released") | .metadata.name')
            FAILED=$(echo "$PVS" | jq -r '.items[] | select(.status.phase == "Failed") | .metadata.name')
            if [ "$TOTAL" -eq 0 ]; then
              echo "ISSUES: no PVs found"
            elif [ -z "$RELEASED" ] && [ -z "$FAILED" ]; then
              echo "OK: $TOTAL PVs, none orphaned"
            else
              echo "ISSUES: released=$(echo $RELEASED | tr '\n' '|') failed=$(echo $FAILED | tr '\n' '|')"
            fi

      # -----------------------------------------------------------------------
      # Check 4: Velero — last backup status per schedule
      # Output: "OK" or "ISSUES: <schedule>=<phase>"
      # -----------------------------------------------------------------------
      - name: check-velero
        script:
          image: registry.k8s.n37.ca/bitnami/kubectl:latest
          command: [bash]
          source: |
            set -uo pipefail
            # A schedule with no backups at all, or a failed read, is an issue
            # (until 2026-11-17 both passed as "OK").
            ISSUES=""
            for SCHEDULE in velero-daily-critical-pvcs velero-daily-argocd velero-weekly-cluster-resources; do
              if ! LATEST=$(kubectl get backups -n velero \
                  -l "velero.io/schedule-name=${SCHEDULE}" \
                  --sort-by=.metadata.creationTimestamp \
                  -o jsonpath='{.items[-1:].status.phase}' 2>/dev/null); then
                ISSUES="$ISSUES ${SCHEDULE}=unreadable"
              elif [ -z "$LATEST" ]; then
                ISSUES="$ISSUES ${SCHEDULE}=no-backups"
              elif [ "$LATEST" != "Completed" ]; then
                ISSUES="$ISSUES ${SCHEDULE}=${LATEST}"
              fi
            done
            if [ -z "$ISSUES" ]; then
              echo "OK: all backups Completed"
            else
              echo "ISSUES:$ISSUES"
            fi

      # -----------------------------------------------------------------------
      # Check 5: Gatekeeper violation count
      # Output: "OK" or "ISSUES: N violations"
      # -----------------------------------------------------------------------
      - name: check-gatekeeper
        script:
          image: registry.k8s.n37.ca/bitnami/kubectl:latest
          command: [bash]
          source: |
            set -uo pipefail
            # `kubectl get constraints` lists every constraint kind through the
            # category, which the SA's RBAC allows. Until 2026-11-17 this listed
            # CRDs first, which the SA may not, so it always summed 0 and said OK.
            if ! CONSTRAINTS=$(kubectl get constraints -o json 2>/tmp/err); then
              echo "ISSUES: cannot list Gatekeeper constraints: $(head -1 /tmp/err)"; exit 0
            fi
            COUNT=$(echo "$CONSTRAINTS" | jq '.items | length')
            TOTAL=$(echo "$CONSTRAINTS" | jq '[.items[].status.totalViolations // 0] | add // 0')
            if [ "$COUNT" -eq 0 ]; then
              echo "ISSUES: no Gatekeeper constraints found"
            elif [ "$TOTAL" -eq 0 ]; then
              echo "OK: 0 violations across $COUNT constraints"
            else
              echo "ISSUES: ${TOTAL} Gatekeeper violations"
            fi

      # -----------------------------------------------------------------------
      # Evaluate all results and fire AlertManager if any issues found
      # -----------------------------------------------------------------------
      - name: evaluate
        inputs:
          parameters:
            - name: argocd-result
            - name: pods-result
            - name: pvs-result
            - name: velero-result
            - name: gatekeeper-result
        script:
          image: registry.k8s.n37.ca/bitnami/kubectl:latest
          command: [bash]
          env:
            - name: ARGOCD
              value: "{{inputs.parameters.argocd-result}}"
            - name: PODS
              value: "{{inputs.parameters.pods-result}}"
            - name: PVS
              value: "{{inputs.parameters.pvs-result}}"
            - name: VELERO
              value: "{{inputs.parameters.velero-result}}"
            - name: GATEKEEPER
              value: "{{inputs.parameters.gatekeeper-result}}"
          source: |
            set -uo pipefail
            ALERTMANAGER="http://kube-prometheus-stack-alertmanager.default:9093"
            NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)

            # Collect issues
            ISSUES=""
            [ "${ARGOCD#OK}" != "$ARGOCD" ] || ISSUES="$ISSUES argocd:${ARGOCD#ISSUES: }"
            [ "${PODS#OK}" != "$PODS" ]     || ISSUES="$ISSUES pods:${PODS#ISSUES: }"
            [ "${PVS#OK}" != "$PVS" ]       || ISSUES="$ISSUES pvs:${PVS#ISSUES: }"
            [ "${VELERO#OK}" != "$VELERO" ] || ISSUES="$ISSUES velero:${VELERO#ISSUES: }"
            [ "${GATEKEEPER#OK}" != "$GATEKEEPER" ] || ISSUES="$ISSUES gatekeeper:${GATEKEEPER#ISSUES: }"

            # Full report to stdout (captured in workflow logs)
            echo "=== Daily Cluster Health Check: $NOW ==="
            echo "ArgoCD:     $ARGOCD"
            echo "Pods:       $PODS"
            echo "PVs:        $PVS"
            echo "Velero:     $VELERO"
            echo "Gatekeeper: $GATEKEEPER"
            echo ""

            if [ -z "$ISSUES" ]; then
              echo "RESULT: ALL CHECKS PASSED"
              exit 0
            fi

            echo "RESULT: ISSUES DETECTED:$ISSUES"

            # Fire AlertManager alert — routes to email via existing SMTP config
            SUMMARY="Daily health check failed:$(echo $ISSUES | cut -c1-200)"
            curl -s -X POST "$ALERTMANAGER/api/v2/alerts" \
              -H 'Content-Type: application/json' \
              -d "[{
                \"labels\": {
                  \"alertname\": \"ClusterHealthDegraded\",
                  \"severity\": \"warning\",
                  \"job\": \"cluster-healthcheck\"
                },
                \"annotations\": {
                  \"summary\": \"$SUMMARY\",
                  \"description\": \"ArgoCD: $ARGOCD | Pods: $PODS | PVs: $PVS | Velero: $VELERO | Gatekeeper: $GATEKEEPER\"
                },
                \"startsAt\": \"$NOW\"
              }]"
            echo ""
            echo "AlertManager notified."
            exit 1
