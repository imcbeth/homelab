# Argo Workflows Configuration for Raspberry Pi 5 Kubernetes Homelab
# Cluster: 5x Pi 5 nodes (16GB each, 80GB total)
# Purpose: CI/CD pipeline automation engine
# Artifact Storage: Backblaze B2 (primary), LocalStack (fallback)

# =============================================================================
# Controller Configuration
# =============================================================================
controller:
  replicas: 1

  # Resource limits optimized for Pi cluster
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi

  # Workflow defaults for all workflows
  workflowDefaults:
    spec:
      # Service account for workflow pods
      serviceAccountName: argo-workflow
      # TTL strategy to automatically clean up completed workflows
      ttlStrategy:
        secondsAfterCompletion: 3600   # 1 hour
        secondsAfterSuccess: 1800       # 30 minutes
        secondsAfterFailure: 7200       # 2 hours
      # Pod garbage collection
      podGC:
        strategy: OnPodCompletion

  # Metrics configuration
  metricsConfig:
    enabled: true
    port: 9090
    portName: metrics
    servicePort: 8080
    servicePortName: metrics

  # ServiceMonitor for Prometheus scraping
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
    namespace: argo-workflows
    interval: 60s
    scrapeTimeout: 10s

  # Service account for controller
  serviceAccount:
    create: true
    name: argo-workflows-controller

  # Container runtime executor
  containerRuntimeExecutor: emissary

# =============================================================================
# Executor Configuration (init + wait sidecar containers in each workflow pod)
# =============================================================================
# Sets resource limits on the Argo-injected init and wait containers so that
# Gatekeeper's require-resource-limits constraint is satisfied.
executor:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# =============================================================================
# Server Configuration
# =============================================================================
server:
  replicas: 1

  # Resource limits optimized for Pi cluster
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 50m
      memory: 128Mi

  # Authentication mode - server mode for internal use
  # Note: For production, consider SSO integration
  extraArgs:
    - --auth-mode=server

  # Service configuration
  serviceType: ClusterIP
  servicePort: 2746

  # Service account for server
  serviceAccount:
    create: true
    name: argo-workflows-server

# =============================================================================
# Artifact Repository Configuration
# =============================================================================
# LocalStack S3-compatible storage (in-cluster, no external dependency)
# Bucket: argo-workflows (pre-created: awslocal s3 mb s3://argo-workflows)
# Credentials: argo-workflows-localstack-credentials secret (key=test, secret=test)
useDefaultArtifactRepo: true
artifactRepository:
  archiveLogs: true
  s3:
    bucket: argo-workflows
    endpoint: localstack.localstack.svc.cluster.local:4566
    region: us-east-1
    accessKeySecret:
      name: argo-workflows-localstack-credentials
      key: access-key
    secretKeySecret:
      name: argo-workflows-localstack-credentials
      key: secret-key
    insecure: true
    useSDKCreds: false

# =============================================================================
# Workflow Configuration
# =============================================================================
workflow:
  serviceAccount:
    create: true
    name: argo-workflow

  # RBAC for workflow execution
  rbac:
    create: true

# =============================================================================
# Main Container Resources (for workflow pods)
# =============================================================================
mainContainer:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# =============================================================================
# RBAC Configuration
# =============================================================================
createAggregateRoles: true

# =============================================================================
# CRDs
# =============================================================================
# Let ArgoCD manage CRDs
crds:
  install: true
  keep: true
  # Use minified CRDs to avoid the v1 chart's hook Job (which downloads from GitHub
  # and would be blocked by Gatekeeper's require-resource-limits constraint)
  full: false
