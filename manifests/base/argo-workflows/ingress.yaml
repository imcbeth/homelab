apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argo-workflows-ingress
  namespace: argo-workflows
  annotations:
    cert-manager.io/cluster-issuer: lets-encrypt-k8s-n37-ca-prod
    external-dns.alpha.kubernetes.io/hostname: workflows.k8s.n37.ca
    external-dns.alpha.kubernetes.io/ttl: "300"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # oauth2-proxy authentication — GitHub login required
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://oauth.k8s.n37.ca/oauth2/start?rd=$scheme://$host$request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email"
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/component: ingress
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - workflows.k8s.n37.ca
      secretName: argo-workflows-tls
  rules:
    - host: workflows.k8s.n37.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argo-workflows-server
                port:
                  number: 2746
