# Build workflow for lifeonabike.ca
#
# Clones https://github.com/imcbeth/lifeonabike.ca, builds the Docker image
# with Kaniko, and pushes two tags to the local Zot registry:
#   registry.k8s.n37.ca/lifeonabike/lifeonabike.ca:<git-sha>
#   registry.k8s.n37.ca/lifeonabike/lifeonabike.ca:latest
#
# Triggered by Argo Events on push to main (see manifests/base/argo-events/).
# Can also be submitted manually:
#   argo submit --from workflowtemplate/lifeonabike-build -n argo-workflows
#
# Prerequisites (one-time cluster setup):
#   kubectl create secret docker-registry lifeonabike-registry-creds \
#     --docker-server=zot.zot.svc.cluster.local:5000 \
#     --docker-username=admin \
#     --docker-password='<password>' \
#     -n argo-workflows
#   (Uses in-cluster HTTP endpoint — pod-to-MetalLB HTTPS is broken in-cluster)
#
#   kubectl create secret generic github-clone-token \
#     --from-literal=token='<github-pat>' \
#     -n argo-workflows
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: lifeonabike-build
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: lifeonabike-build
    app.kubernetes.io/component: ci
spec:
  entrypoint: build-and-push
  serviceAccountName: argo-workflow   # created by the argo-workflows Helm chart

  arguments:
    parameters:
      - name: revision
        value: main

  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: synology-iscsi-delete-ssd
        resources:
          requests:
            storage: 2Gi

  volumes:
    - name: registry-creds
      secret:
        secretName: lifeonabike-registry-creds
        items:
          - key: .dockerconfigjson
            path: config.json

  # Required by Gatekeeper require-labels constraint (all workflow pods).
  # ambient.istio.io/redirection: disabled — ztunnel resets TLS connections to
  # non-mesh destinations (Zot registry via MetalLB, GitHub); bypass interception.
  podMetadata:
    labels:
      app.kubernetes.io/name: lifeonabike-build
    annotations:
      ambient.istio.io/redirection: disabled

  # Default resource limits applied to all step containers (Gatekeeper: require-resource-limits)
  templateDefaults:
    container:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi

  ttlStrategy:
    secondsAfterSuccess: 3600    # 1h
    secondsAfterFailure: 28800   # 8h

  templates:
    - name: build-and-push
      steps:
        - - name: clone
            template: git-clone
        - - name: build
            template: kaniko-build
            arguments:
              parameters:
                - name: image-tag
                  value: "{{steps.clone.outputs.parameters.sha}}"
        - - name: deploy
            template: rollout-restart

    # ── Step 1: shallow-clone the app repo, capture git SHA ──────────────────
    - name: git-clone
      outputs:
        parameters:
          - name: sha
            valueFrom:
              path: /tmp/sha
      container:
        image: alpine/git:v2.52.0
        command: [sh, -c]
        args:
          - |
            git clone https://x-access-token:${GITHUB_TOKEN}@github.com/imcbeth/lifeonabike.ca.git /workspace \
              --branch {{workflow.parameters.revision}} \
              --single-branch \
              --depth 1 && \
            git -C /workspace remote set-url origin https://github.com/imcbeth/lifeonabike.ca.git && \
            git -C /workspace rev-parse --short HEAD > /tmp/sha
        env:
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-clone-token
                key: token
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    # ── Step 2: build image with Kaniko, push sha + latest tags ──────────────
    - name: kaniko-build
      inputs:
        parameters:
          - name: image-tag
      container:
        image: gcr.io/kaniko-project/executor:v1.24.0
        # Building a Docker image is memory-intensive — override the templateDefaults.
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1536Mi
        args:
          - --dockerfile=/workspace/deploy/Dockerfile
          - --context=/workspace
          # Push directly to Zot's in-cluster ClusterIP over HTTP — pod-to-MetalLB
          # HTTPS is broken in-cluster. Kubelet pulls (node-level) still use the
          # external registry.k8s.n37.ca hostname and are unaffected.
          - --insecure
          - --destination=zot.zot.svc.cluster.local:5000/lifeonabike/lifeonabike.ca:{{inputs.parameters.image-tag}}
          - --destination=zot.zot.svc.cluster.local:5000/lifeonabike/lifeonabike.ca:latest
          - --cache=true
          - --cache-repo=zot.zot.svc.cluster.local:5000/lifeonabike/lifeonabike.ca/cache
          - --insecure-pull
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: registry-creds
            mountPath: /kaniko/.docker

    # ── Step 3: trigger rolling restart so pods pull the new :latest image ──────
    - name: rollout-restart
      container:
        image: alpine/k8s:1.31.13
        command: [kubectl, rollout, restart, deployment/web, -n, lifeonabike]
