apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: test-k8s-n37-ca-stg
  namespace: cert-manager
spec:
  secretName: le-test-k8s-n37-ca-stg
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  issuerRef:
    name: lets-encrypt-k8s-n37-ca-staging
    kind: ClusterIssuer
  dnsNames:
    - test.k8s.n37.ca