apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka-cluster
  namespace: kafka
  annotations:
    # Enable KRaft mode (no ZooKeeper)
    strimzi.io/kraft: enabled
    # Enable KafkaNodePool support (replicas/storage defined in KafkaNodePool)
    strimzi.io/node-pools: enabled
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: kafka-cluster
spec:
  kafka:
    # Bumped 2026-07-16 alongside strimzi-kafka-operator 1.0.1 → 1.1.0 (PR #804).
    # strimzi 1.1.0 dropped support for Kafka 4.1.x; supported now: 4.2.0, 4.2.1, 4.3.0.
    version: 4.2.1
    # Listeners — plain (no TLS) on port 9092 for internal cluster access
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # Single-replica settings appropriate for a one-node demo cluster
      offsets.topic.replication.factor: "1"
      transaction.state.log.replication.factor: "1"
      transaction.state.log.min.isr: "1"
      default.replication.factor: "1"
      min.insync.replicas: "1"
  entityOperator:
    # Only topic-operator is deployed — user-operator is omitted intentionally.
    # Strimzi 1.0.0's Kafka CRD does not expose startupProbe in the
    # userOperatorContainer template, and the built-in liveness probe
    # (initialDelaySeconds=10, failureThreshold=3) kills the container at ~30s,
    # before the ARM64 JVM + AdminClient init completes (~35s). This cluster
    # has no KafkaUser CRDs, so user management is not needed.
    topicOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
