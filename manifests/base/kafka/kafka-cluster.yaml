apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka-cluster
  namespace: kafka
  annotations:
    # Enable KRaft mode (no ZooKeeper)
    strimzi.io/kraft: enabled
    # Enable KafkaNodePool support (replicas/storage defined in KafkaNodePool)
    strimzi.io/node-pools: enabled
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: kafka-cluster
spec:
  kafka:
    version: 4.1.2
    # Listeners — plain (no TLS) on port 9092 for internal cluster access
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # Single-replica settings appropriate for a one-node demo cluster
      offsets.topic.replication.factor: "1"
      transaction.state.log.replication.factor: "1"
      transaction.state.log.min.isr: "1"
      default.replication.factor: "1"
      min.insync.replicas: "1"
  entityOperator:
    # Manages KafkaTopic and KafkaUser CRs
    topicOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    userOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
