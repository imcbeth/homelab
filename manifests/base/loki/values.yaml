# Loki configuration for Raspberry Pi cluster
# Deployment mode: SingleBinary (monolithic)
# Storage: 20Gi PVC on Synology iSCSI
# Retention: 7 days (168h)

deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  # Note: In singleBinary mode, caches are managed internally by the Loki process
  # External cache configuration is disabled to avoid creating separate cache pods
  # Memory is controlled via GOMEMLIMIT and pod resource limits below

  schemaConfig:
    configs:
      - from: 2025-01-01
        store: tsdb        # Modern index store
        object_store: filesystem
        schema: v13        # Latest schema
        index:
          prefix: loki_index_
          period: 24h      # Required for retention

  limits_config:
    retention_period: 720h  # 30 days
    max_query_series: 500
    max_query_parallelism: 32
    # Memory limits for ingester (aligned with 768Mi pod limit)
    ingestion_rate_mb: 10  # Limit ingestion rate to 10MB/sec
    ingestion_burst_size_mb: 20  # Allow bursts up to 20MB

  compactor:
    retention_enabled: true
    compaction_interval: 10m
    delete_request_store: filesystem

  # Ruler config via structuredConfig (rulerConfig is ignored when ruler.enabled=false)
  structuredConfig:
    ruler:
      alertmanager_url: http://kube-prometheus-stack-alertmanager.default.svc.cluster.local:9093
      enable_api: true
      enable_alertmanager_v2: true
      storage:
        type: local
        local:
          directory: /rules
      rule_path: /tmp/rules
      ring:
        kvstore:
          store: inmemory

singleBinary:
  replicas: 1

  resources:
    requests:
      cpu: 200m
      memory: 512Mi  # Increased from 384Mi for better stability
    limits:
      cpu: 500m
      memory: 768Mi

  # Additional configuration for memory management
  extraEnv:
    - name: GOMEMLIMIT
      value: "700MiB"  # Go memory limit, leave ~68Mi for overhead

  persistence:
    enabled: true
    storageClass: synology-iscsi-retain
    size: 20Gi
    accessModes:
      - ReadWriteOnce

# Backend and read/write/gateway disabled (using singleBinary)
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
gateway:
  enabled: false

# Disable external caches (singleBinary mode uses internal caching)
chunksCache:
  enabled: false
  replicas: 0
resultsCache:
  enabled: false
  replicas: 0

sidecar:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi

# Loki canary DaemonSet resources
lokiCanary:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

# Note: Alloy (log collector) is deployed separately via its own ArgoCD application
# See manifests/applications/alloy.yaml

# Monitoring - Enable ServiceMonitor for Prometheus metrics collection
monitoring:
  dashboards:
    enabled: false
  rules:
    enabled: true  # Enable Loki alerting rules
    alerting: true  # Enable alerting to AlertManager
    namespace: loki  # PrometheusRules will be created in loki namespace
    labels:
      prometheus: kube-prometheus  # Match Prometheus selector
      role: alert-rules
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
    # Note: lokiCanary resources are set via the top-level lokiCanary.resources key above

# Ruler runs embedded in singleBinary pod, no separate Deployment needed
# Config is injected via loki.structuredConfig.ruler above
ruler:
  enabled: false
  replicas: 0

# Test configuration
test:
  enabled: false
