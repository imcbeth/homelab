# LogQL alerting rules evaluated by Loki's embedded ruler
# The k8s-sidecar (loki-sc-rules) picks up ConfigMaps with label loki_rule
# and writes them to /rules/ for the ruler to evaluate
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alerting-rules
  namespace: loki
  labels:
    loki_rule: "true"
  annotations:
    k8s-sidecar-target-directory: /rules/fake
data:
  log-alerts.yaml: |
    groups:
      - name: log_errors
        interval: 1m
        rules:
          - alert: HighErrorLogRate
            expr: |
              sum by (namespace, pod) (
                rate({namespace=~".+", namespace!="loki"} |~ "(?i)(error|err|fatal|exception|panic|fail)" [5m])
              ) > 1
            for: 5m
            labels:
              severity: warning
              component: loki
              alert_type: log_pattern
            annotations:
              summary: "High error log rate in {{ $labels.namespace }}/{{ $labels.pod }}"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is logging errors at {{ $value | humanize }}/s for 5 minutes."

          - alert: CriticalErrorLogs
            expr: |
              sum by (namespace, pod) (
                rate({namespace=~".+", namespace!="loki"} |~ "(?i)(critical|fatal|panic|emergency)" [5m])
              ) > 0.1
            for: 2m
            labels:
              severity: critical
              component: loki
              alert_type: log_pattern
            annotations:
              summary: "Critical errors in {{ $labels.namespace }}/{{ $labels.pod }}"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is logging critical/fatal errors at {{ $value | humanize }}/s."

      - name: pod_failures
        interval: 1m
        rules:
          # ── Why every selector below excludes namespace="loki" ──────────────────
          #
          # Loki's ruler logs the full TEXT of each query it evaluates:
          #
          #   caller=metrics.go component=ruler ... query="(sum by (namespace,pod)
          #     (rate({namespace=~\".+\"} |~ \"(?i)(attack|intrusion|exploit...
          #
          # Alloy ships those lines straight back into Loki. The next evaluation then
          # matches its OWN logged query string, so the alert fires forever and can
          # never clear. Confirmed 2026-09-19: OOMKilledDetected,
          # CrashLoopBackOffDetected and SuspiciousActivity each matched exactly one
          # series — loki/loki-0 — and nothing else in the cluster. Three of them are
          # `critical`, so this was paging on the ruler reading its own logs.
          #
          # Excluding the loki namespace is deterministic: the ruler only ever runs
          # there. Verified against live Loki — the same queries return 0 series with
          # the exclusion, so no real event is being hidden.
          #
          # These are TEXT-matching rules and remain inherently fragile: they detect a
          # pod that LOGS a phrase, not a pod the phrase is ABOUT. A pod that is
          # OOMKilled does not log "oomkilled" — the kubelet does. Treat them as a
          # coarse net; metric-based alerts are authoritative. KubePodCrashLooping is
          # already loaded. `KubeContainerOOMKilled` is NOT — worth adding.
          - alert: CrashLoopBackOffDetected
            expr: |
              sum by (namespace, pod) (
                rate({namespace=~".+", namespace!="loki"} |~ "(?i)(back-off restarting failed container|crashloopbackoff)" [5m])
              ) > 0
            for: 5m
            labels:
              severity: critical
              component: loki
              alert_type: pod_failure
            annotations:
              summary: "CrashLoopBackOff in {{ $labels.namespace }}/{{ $labels.pod }}"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is in CrashLoopBackOff state."

          - alert: OOMKilledDetected
            expr: |
              sum by (namespace, pod) (
                rate({namespace=~".+", namespace!="loki"} |~ "(?i)(oomkilled|out of memory|memory cgroup out of memory)" [5m])
              ) > 0
            for: 1m
            labels:
              severity: critical
              component: loki
              alert_type: pod_failure
            annotations:
              summary: "OOMKilled in {{ $labels.namespace }}/{{ $labels.pod }}"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} was OOM killed."

          - alert: PersistentPodRestarts
            expr: |
              count_over_time({namespace=~".+", namespace!="loki"} |~ "(?i)(restarting container|restart count)" [15m]) > 5
            for: 10m
            labels:
              severity: warning
              component: loki
              alert_type: pod_failure
            annotations:
              summary: "Persistent restarts in {{ $labels.namespace }}/{{ $labels.pod }}"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted multiple times in 15 minutes."

      - name: application_errors
        interval: 1m
        rules:
          - alert: HighHTTP5xxErrorRate
            expr: |
              sum by (namespace, pod) (
                rate({namespace=~".+", namespace!="loki"} |~ "(?i)(status[= :]5[0-9]{2}|http.*5[0-9]{2})" [5m])
              ) > 1
            for: 5m
            labels:
              severity: warning
              component: loki
              alert_type: application_error
            annotations:
              summary: "High HTTP 5xx rate in {{ $labels.namespace }}/{{ $labels.pod }}"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is returning HTTP 5xx errors at {{ $value | humanize }}/s."

          - alert: DatabaseConnectionErrors
            expr: |
              sum by (namespace, pod) (
                rate({namespace=~".+", namespace!="loki"} |~ "(?i)(connection.*refused|connection.*timeout|database.*error|sql.*error)" [5m])
              ) > 0.5
            for: 5m
            labels:
              severity: warning
              component: loki
              alert_type: application_error
            annotations:
              summary: "Database errors in {{ $labels.namespace }}/{{ $labels.pod }}"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is experiencing database connection errors."

      - name: security_events
        interval: 1m
        rules:
          - alert: AuthenticationFailures
            expr: |
              sum by (namespace, pod) (
                rate({namespace=~".+", namespace!="loki"} |~ "(?i)(authentication.*failed|auth.*failed|unauthorized|invalid.*credentials)" [5m])
              ) > 5
            for: 5m
            labels:
              severity: warning
              component: loki
              alert_type: security
            annotations:
              summary: "Auth failures in {{ $labels.namespace }}/{{ $labels.pod }}"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has {{ $value | humanize }} auth failures/s."

          - alert: SuspiciousActivity
            expr: |
              sum by (namespace, pod) (
                rate({namespace=~".+", namespace!="loki"} |~ "(?i)(attack|intrusion|exploit|malicious|suspicious)" [5m])
              ) > 0
            for: 2m
            labels:
              severity: critical
              component: loki
              alert_type: security
            annotations:
              summary: "Suspicious activity in {{ $labels.namespace }}/{{ $labels.pod }}"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has logs indicating potential security concerns."
