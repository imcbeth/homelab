apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://raw.githubusercontent.com/projectcalico/calico/v3.31.4/manifests/tigera-operator.yaml
  - installation.yaml
  - apiserver.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: tigera-operator
        namespace: tigera-operator
      spec:
        template:
          spec:
            containers:
              - name: tigera-operator
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi
    target:
      kind: Deployment
      name: tigera-operator
