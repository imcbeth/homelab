controller:
  image:
    tag: "v1.14.3"

  # Hardening settings (previously in separate ConfigMap)
  config:
    ssl-protocols: "TLSv1.2 TLSv1.3"
    ssl-prefer-server-ciphers: "true"
    hsts: "true"
    hsts-max-age: "31536000"
    hsts-include-subdomains: "true"
    server-tokens: "false"
    hide-headers: "X-Powered-By"
    force-ssl-redirect: "true"
    client-max-body-size: "20m"

  # Security headers (previously in custom-headers ConfigMap)
  addHeaders:
    X-Frame-Options: "DENY"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"
    Permissions-Policy: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=()"

  # Two replicas on different nodes, so one node failing doesn't take down
  # all LAN ingress (10.0.10.10). With externalTrafficPolicy: Local, MetalLB L2
  # announces the VIP from a node that has a ready pod, so the second replica is
  # a warm standby: the VIP moves in ~10-20 s rather than waiting ~5 min for the
  # pod to be rescheduled (measured 2026-11-06: LAN requests failed for ~20-30 s
  # while the PR #1120 rollout moved the VIP three times, ~10-12 s per move).
  # replicaCount > 1 also makes the chart create a PDB
  # (minAvailable: 1), so drains evict one at a time.
  replicaCount: 2
  minAvailable: 1
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
          topologyKey: kubernetes.io/hostname

  # Resource limits for cluster stability
  resources:
    requests:
      cpu: 100m
      memory: 90Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Prometheus metrics
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack

  # Service config to match existing
  service:
    externalTrafficPolicy: Local

  # Webhook cert jobs resource limits
  admissionWebhooks:
    createSecretJob:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
    patchWebhookJob:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
