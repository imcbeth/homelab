# VPA objects for key cluster workloads — updateMode: Off (recommendations only).
#
# Recommendations appear in: kubectl describe vpa <name> -n <namespace>
# Review after 2-4 weeks, then consider switching to updateMode: Initial or Auto.
#
# Excluded from VPA (no point recommending):
#   - DaemonSets with fixed per-node duties (node-exporter, alloy, calico-node)
#   - StatefulSets with strict resource budgets (Prometheus — 50Gi iSCSI PVC)
#   - Helm-managed resources with override values already tuned

# ── Prometheus ───────────────────────────────────────────────────────────────
# NOTE: updateMode Off — Prometheus has a dedicated 50Gi iSCSI PVC on node01.
# Eviction would cause the pod/VolumeAttachment node mismatch issue seen 2026-03.
# Treat recommendations as informational only; apply manually via values.yaml.
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: prometheus
  namespace: default
  labels:
    app.kubernetes.io/name: vpa-prometheus
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: prometheus-kube-prometheus-stack-prometheus
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: prometheus
        minAllowed:
          cpu: 50m
          memory: 512Mi
        maxAllowed:
          cpu: "2"
          memory: 2Gi
      - containerName: config-reloader
        minAllowed:
          cpu: 10m
          memory: 32Mi
        maxAllowed:
          cpu: 200m
          memory: 128Mi

