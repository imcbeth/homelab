# Falco Runtime Security Configuration for Raspberry Pi 5 Kubernetes Homelab
# Cluster: 5x Pi 5 nodes (16GB each, 80GB total)
# Purpose: Runtime threat detection and security monitoring

# =============================================================================
# Driver Configuration
# =============================================================================
# Use modern eBPF driver (more efficient than kernel module on ARM64)
driver:
  kind: modern_ebpf
  modernEbpf:
    # Optimized buffer size for Pi cluster
    bufSizePreset: 4

# =============================================================================
# Falco DaemonSet Configuration
# =============================================================================
# Resource limits optimized for Pi cluster
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Tolerations to run on all nodes including control-plane
tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
  - effect: NoSchedule
    key: node-role.kubernetes.io/master
    operator: Exists

# =============================================================================
# Falco Configuration
# =============================================================================
falco:
  # JSON output for structured logging
  jsonOutput: true
  jsonIncludeOutputProperty: true
  jsonIncludeTagsProperty: true

  # Log level (info is good balance for production)
  logLevel: info

  # Priority threshold - only alert on notice and above
  # Reduces noise from debug/info events
  priority: notice

  # Enable metrics endpoint for Prometheus
  httpOutput:
    enabled: true
    url: ""

  # Syscall event drops - buffer tuning
  syscallEventDrops:
    threshold: 0.1
    actions:
      - log
      - alert
    rate: 0.03333
    maxBurst: 1

  # Output settings
  outputs:
    rate: 0
    maxBurst: 1000

  # Metadata settings
  metadataDownload:
    maxMb: 100
    chunkWaitUs: 1000
    watchFreqSec: 1

# =============================================================================
# Rules Configuration
# =============================================================================
# Load default rules but customize for homelab
falcoctl:
  artifact:
    install:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
    follow:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
  config:
    artifact:
      allowedTypes:
        - rulesfile
      install:
        refs:
          - falco-rules:3
      follow:
        refs:
          - falco-rules:3

# Custom rules to reduce noise in homelab environment
customRules:
  homelab-rules.yaml: |-
    # Homelab-specific rule overrides
    # These rules are tuned for a Kubernetes homelab environment to reduce noise
    # Using Falco 0.40+ override syntax

    # Disable noisy rules that generate many false positives in homelab
    - rule: Terminal shell in container
      override:
        enabled: replace
      enabled: false

    # -----------------------------------------------------------------------
    # "Contact K8S API Server From Container" — 99.8% of all Falco matches
    # -----------------------------------------------------------------------
    # Measured over 7 days on 2026-10-29:
    #
    #   178,428  Contact K8S API Server From Container   99.8%
    #       230  Read sensitive file untrusted            0.1%
    #        28  Drop and execute new binary in container 0.0%
    #        15  Clear Log Activities                     0.0%
    #
    # This is not a cosmetic problem. falcosidekick-ui keeps 7 days in Redis
    # under `maxmemory-policy allkeys-lru`, so ~25k events/day of this one
    # rule actively EVICTS the 0.2% that matters. The signal was being
    # deleted by the noise.
    #
    # Every source was identified from the event stream in Loki (24h window,
    # 24,551 events, 20 distinct sources) and every one is a cluster
    # component doing the job it was deployed to do:
    #
    #   11139  synology-csi     alpine/k8s                  pvc-writability-prober, pvc-ro-remediator, vsc-orphan-janitor
    #    5782  default          kiwigrid/k8s-sidecar        grafana dashboard sidecar
    #    2881  loki             kiwigrid/k8s-sidecar        loki rules sidecar
    #    2683  flink-operator   flink-kubernetes-operator   operator reconcile loop
    #    1956  strimzi/kafka    strimzi/operator            operator reconcile loop
    #      54  default          prometheus                  service discovery
    #      20  calico-system    calico/node, calico/typha   CNI
    #      16  argo-workflows   bitnami/kubectl, argoexec   cluster-healthcheck workflows
    #      12  default,uptime-kuma  alpine/k8s              CronJobs
    #       4  velero           velero/velero
    #       4  argocd           argocd-application-controller
    #
    # Fixed at the upstream extension point rather than by disabling the
    # rule: `user_known_contact_k8s_api_server_activities` ships as
    # `(never_true)` precisely so operators can fill it in. The rule itself
    # stays enabled, so an unexpected container talking to the API server
    # still fires.
    #
    # Pairs are (namespace AND image), never image alone. A compromised pod
    # running alpine/k8s somewhere other than synology-csi/uptime-kuma/default
    # still alerts — which is most of the value of keeping the rule on.
    #
    # Note two of these would have been covered by the upstream
    # `k8s_containers` allowlist except that it spells them unqualified
    # (`velero/velero`, `prom/prometheus`) and our images carry the registry
    # prefix. Hence `docker.io/velero/velero` and
    # `quay.io/prometheus/prometheus` appear here explicitly.
    #
    # If a new controller is deployed, its noise reappears here rather than
    # being silently swallowed — the failure direction is "too many alerts",
    # which is the safe one.
    - macro: user_known_contact_k8s_api_server_activities
      override:
        condition: replace
      condition: >
        (
          (k8s.ns.name in (synology-csi, uptime-kuma, default) and
           container.image.repository = "docker.io/alpine/k8s") or
          (k8s.ns.name = "argo-workflows" and
           container.image.repository in ("registry.k8s.n37.ca/bitnami/kubectl",
                                          "quay.io/argoproj/argoexec")) or
          (k8s.ns.name = "default" and
           container.image.repository = "quay.io/kiwigrid/k8s-sidecar") or
          (k8s.ns.name = "loki" and
           container.image.repository = "docker.io/kiwigrid/k8s-sidecar") or
          (k8s.ns.name = "flink-operator" and
           container.image.repository = "docker.io/apache/flink-kubernetes-operator") or
          (k8s.ns.name in (strimzi-system, kafka) and
           container.image.repository = "quay.io/strimzi/operator") or
          (k8s.ns.name = "default" and
           container.image.repository = "quay.io/prometheus/prometheus") or
          (k8s.ns.name = "calico-system" and
           container.image.repository in ("docker.io/calico/node",
                                          "docker.io/calico/typha")) or
          (k8s.ns.name = "velero" and
           container.image.repository = "docker.io/velero/velero") or
          (k8s.ns.name = "argocd" and
           container.image.repository = "quay.io/argoproj/argocd")
        )

    # Custom rule: Detect cryptocurrency mining
    - rule: Detect Cryptocurrency Mining
      desc: Detect cryptocurrency mining processes
      condition: >
        spawned_process and
        (proc.name in (xmrig, minerd, minergate, cpuminer, cgminer, bfgminer, ethminer) or
         proc.cmdline contains "stratum+tcp" or
         proc.cmdline contains "pool.minergate")
      output: >
        Cryptocurrency mining detected
        (user=%user.name user_loginuid=%user.loginuid command=%proc.cmdline
        container_id=%container.id container_name=%container.name image=%container.image.repository)
      priority: CRITICAL
      tags: [cryptomining, mitre_execution]

    # Custom rule: Detect reverse shell attempts
    - rule: Reverse Shell Detected
      desc: Detect reverse shell connections
      condition: >
        spawned_process and
        ((proc.name = "bash" or proc.name = "sh") and
         (proc.cmdline contains "/dev/tcp" or
          proc.cmdline contains "nc -e" or
          proc.cmdline contains "ncat -e" or
          proc.cmdline contains "python" and proc.cmdline contains "socket"))
      output: >
        Reverse shell detected
        (user=%user.name command=%proc.cmdline container_id=%container.id
        container_name=%container.name image=%container.image.repository)
      priority: CRITICAL
      tags: [shell, mitre_execution]

# =============================================================================
# Prometheus Metrics
# =============================================================================
metrics:
  enabled: true
  service:
    port: 8765

serviceMonitor:
  create: true
  labels:
    release: kube-prometheus-stack
  interval: 30s

# =============================================================================
# Falcosidekick Configuration
# =============================================================================
# Sidekick handles alert routing and integrations
falcosidekick:
  enabled: true

  # Resource limits for sidekick
  # Bumped memory limit from 64Mi → 128Mi after both replicas OOMKilled 2026-04-08
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  # Web UI for viewing alerts
  webui:
    enabled: true
    replicaCount: 1
    # 30d was too much: 167k events → 1.19GB in Redis (2026-07-14 profile).
    # Combined with ReJSON + RediSearch module overhead + fresh event ingest,
    # the Redis container OOMKilled repeatedly against the 2Gi Gatekeeper cap.
    # 7d ≈ 40k events ≈ ~280MB dataset, leaving plenty of headroom.
    # Falco events also go out via AlertManager email → not the sole trail.
    ttl: "7d"
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    redis:
      # storageEnabled: false — the PVC was pointless (2026-09-09).
      #
      # `save ""` below disables RDB, and redis-stack has AOF off by default,
      # so this Redis has NO persistence path at all. The 2Gi iSCSI PVC could
      # therefore never contain anything, and did not: verified on both the
      # live volume and a Velero restore of it — only `.` and `..`, and
      # redis reported 0 keys with 0 keyspace hits/misses across 114,776
      # commands in 2 days.
      #
      # It was a leftover. `save ""` was added 2026-07-14 to stop BGSAVE fork
      # spikes OOMKilling the container; the storage that only existed to
      # serve BGSAVE was never removed to match.
      #
      # Cost of keeping it: a nightly Velero snapshot of an empty volume, a
      # NAS LUN, and one more iSCSI PVC that can go read-only and drag the
      # RO-remediation machinery in for nothing.
      #
      # NOTE: volumeClaimTemplates are immutable, so flipping this requires
      # deleting the StatefulSet so ArgoCD recreates it. Safe here precisely
      # because there is no data to lose.
      storageEnabled: false
      resources:
        requests:
          cpu: 50m
          memory: 1536Mi
        limits:
          cpu: 200m
          memory: 2Gi
      # Custom Redis config passed as `--<key> <value>` args to redis-server.
      # The falcosidekick chart's key is `customConfig` (a LIST of strings),
      # NOT `config` (a map). Discovered 2026-07-13: the old `config:` block
      # was silently ignored by the chart.
      #
      # 2026-07-14 revision — 1500mb was still too aggressive. Redis kept
      # OOMKilling because BGSAVE fork copy-on-write spikes memory well
      # above `maxmemory` (which only caps key data). Live observation:
      # container hit 2047 MiB with maxmemory=1500 → OOM at 2Gi limit.
      #
      # Budget breakdown for the 2Gi container limit:
      #   1000 MiB — Redis key data (maxmemory)
      #    300 MiB — RediSearch + TimeSeries module overhead
      #    600 MiB — fork COW headroom (up to ~50% of RSS during BGSAVE)
      #    148 MiB — process + kernel overhead
      #   = 2048 MiB
      #
      # `save ""` disables RDB snapshots to eliminate the BGSAVE spike
      # entirely. Trade-off: Redis loses ability to persist to disk on
      # normal shutdown → recent Falco UI event history is lost across
      # restarts. Acceptable since falcosidekick-ui is a live-events
      # viewer, not an incident forensics tool. AOF also disabled by
      # default in redis-stack, so this is a full "no persistence" mode.
      customConfig:
        - "maxmemory 1000mb"
        - "maxmemory-policy allkeys-lru"
        - 'save ""'
    initContainer:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi

  # Prometheus metrics for sidekick
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

  # Output configuration
  config:
    # Debug logging disabled for production
    debug: false

    # Prometheus metrics output
    prometheus:
      extralabels: ""

    # Alertmanager integration
    alertmanager:
      hostport: "http://alertmanager-operated.default:9093"
      minimumpriority: warning
      mutetimestamps: false

    # Loki integration for log aggregation
    loki:
      hostport: "http://loki.loki:3100"
      minimumpriority: notice
      tenant: ""
      endpoint: "/loki/api/v1/push"

# =============================================================================
# Security Context
# =============================================================================
podSecurityContext:
  runAsNonRoot: false  # Falco needs root for syscall monitoring

containerSecurityContext:
  privileged: true  # Required for syscall monitoring

# =============================================================================
# Additional Configuration
# =============================================================================
# Service account
serviceAccount:
  create: true
  name: falco

# Pod priority (security monitoring is important)
priorityClassName: ""

# Affinity rules (none - run everywhere)
affinity: {}

# Node selector (none - run on all nodes)
nodeSelector: {}
