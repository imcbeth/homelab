# localstack-manifests/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: localstack
spec:
  selector:
    matchLabels:
      app: localstack
  replicas: 1
  # Single replica with a RWO iSCSI PVC — RollingUpdate would deadlock
  # on Multi-Attach (new pod can't get the volume until the old pod
  # releases it, but rolling update won't kill the old until the new is
  # Ready). Recreate: kill old first, then start new. Discovered
  # 2026-07-16 during PR #732's livenessProbe rollout.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          # PINNED to 4.14.0 — the last COMMUNITY release under the semver
          # line. DO NOT bump to a CalVer tag (2026.8.x) without checking the
          # edition first.
          #
          # Tried 2026.8.2 on 2026-09-09 and it CrashLooped immediately:
          #
          #   Localstack returning with exit code 55.
          #   License activation failed!
          #   No credentials were found in the environment. Please make sure
          #   to either set the LOCALSTACK_AUTH_TOKEN variable...
          #
          # The CalVer tags on this repository require a licence to start at
          # all — they are not a drop-in continuation of the community line.
          # The tag existing and being newer is NOT sufficient evidence that
          # it is the same distribution.
          #
          # Consequence: this image cannot be updated without a LocalStack
          # licence, so its CVEs are frozen at whatever 4.14.0 ships. That is
          # tolerable only because this is a disposable test emulator on a
          # private network with no untrusted input.
          image: localstack/localstack:4.14.0
          ports:
            - containerPort: 4566 # Default LocalStack port
          # Right-sized resources (actual usage ~89Mi)
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: SERVICES
              value: iam,s3,sns,sqs,lambda,dynamodb,ec2,elb # Enabled Services
            - name: DEBUG
              value: "1"
            - name: EXTRA_CORS_ALLOWED_ORIGINS
              value: "https://localstack.k8s.n37.ca"
            # NO-OP ON THIS INSTALL — kept only so it starts working if a
            # licence is ever added. Persistence is a LICENSED feature and
            # this is `edition: community`, `is_license_activated: false`.
            # Verified 2026-09-09: created a bucket, then found
            # /var/lib/localstack/state still holding 0 files. The PVC stores
            # cache and logs, not service state.
            #
            # Bucket durability is handled by the init hooks mounted at
            # /etc/localstack/init/ready.d instead. Do not rely on this.
            - name: PERSISTENCE
              value: "1"
          # Liveness probe — combined health-check + write-test on the PVC.
          # Catches the iSCSI RO-remount failure mode (cluster restart on
          # 2026-06-04 hit Loki + Falco-Redis). When a write fails, kubelet
          # kills the container and the deployment controller schedules a
          # fresh pod → fresh CSI mount → RW restored, no manual action.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'curl -fsS http://localhost:4566/_localstack/health > /dev/null && touch /var/lib/localstack/.healthz && rm -f /var/lib/localstack/.healthz'
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: localstack-data
              mountPath: /var/lib/localstack
            # Init hooks run on every start. This is what recreates the
            # argo-workflows S3 bucket, which does NOT survive a restart
            # because persistence is a licensed feature (see PERSISTENCE).
            - name: init-scripts
              mountPath: /etc/localstack/init/ready.d
              readOnly: true
      volumes:
        - name: localstack-data
          persistentVolumeClaim:
            claimName: localstack-data
        - name: init-scripts
          configMap:
            name: localstack-init-scripts
            defaultMode: 0555
