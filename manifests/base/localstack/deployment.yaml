# localstack-manifests/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: localstack
spec:
  selector:
    matchLabels:
      app: localstack
  replicas: 1
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:4.13.1
          ports:
            - containerPort: 4566 # Default LocalStack port
          # Right-sized resources (actual usage ~89Mi)
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: SERVICES
              value: iam,s3,sns,sqs,lambda,dynamodb,ec2,elb # Enabled Services
            - name: DEBUG
              value: "1"
