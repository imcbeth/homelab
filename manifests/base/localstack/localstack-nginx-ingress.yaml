apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: localstack-ingress
  namespace: localstack
  annotations:
    cert-manager.io/cluster-issuer: lets-encrypt-k8s-n37-ca-prod # Or your chosen issuer
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP" # LocalStack uses HTTP internally
    external-dns.alpha.kubernetes.io/hostname: localstack.k8s.n37.ca
    external-dns.alpha.kubernetes.io/ttl: "300"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # oauth2-proxy authentication — GitHub login required
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://oauth.k8s.n37.ca/oauth2/start?rd=$scheme%3A%2F%2F$host$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - localstack.k8s.n37.ca
    secretName: localstack-k8s-n37-ca-nginx-tls # Cert-manager will create this secret
  rules:
  - host: localstack.k8s.n37.ca
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: localstack
            port:
              number: 4566
