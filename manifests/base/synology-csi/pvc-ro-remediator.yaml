---
# pvc-ro-remediator — auto-remediates PVC read-only remounts.
#
# Final step of TODO #17a (PVC RO-mount automation). Closes the loop:
#
#   pvc-mount-monitor DaemonSet (PR #734) → exports pvc_mount_readonly gauge
#   PrometheusRule PVCMountReadOnly  (PR #734) → fires after 2m sustained RO
#   pvc-ro-remediator CronJob       (this PR) → consumes alert, deletes pod
#                                              → fresh pod gets RW mount
#
# Total detection-to-recovery: 2m (alert window) + up to 2m (next CronJob)
# = ~4 min worst case. Beats the hours it took to notice manually.
#
# Safety:
#   - Hard-coded exclude list of system namespaces (won't touch kube-system,
#     calico-system, tigera-operator, gatekeeper-system, etc.)
#   - DRY_RUN env var (default false) prints the action without taking it
#   - Each action logged with alert labels + pod identity for audit trail
#   - If a pod gets repeatedly RO-remounted, the human still sees the alert
#     fire each cycle — automation doesn't suppress notification
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pvc-ro-remediator
  namespace: synology-csi
  labels:
    app.kubernetes.io/name: pvc-ro-remediator
    app.kubernetes.io/component: remediator
---
# Cluster-wide pod delete permission. Narrow on resource: only pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pvc-ro-remediator
  labels:
    app.kubernetes.io/name: pvc-ro-remediator
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pvc-ro-remediator
  labels:
    app.kubernetes.io/name: pvc-ro-remediator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pvc-ro-remediator
subjects:
  - kind: ServiceAccount
    name: pvc-ro-remediator
    namespace: synology-csi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pvc-ro-remediator-script
  namespace: synology-csi
  labels:
    app.kubernetes.io/name: pvc-ro-remediator
data:
  remediate.sh: |
    #!/bin/sh
    set -eu

    PROM_URL="${PROM_URL:-http://kube-prometheus-stack-prometheus.default.svc:9090}"
    DRY_RUN="${DRY_RUN:-false}"

    # Namespaces we will NEVER act on, even if alerts fire from them.
    # Keep this list small but cover anything where pod-delete-without-thought
    # could cascade badly.
    PROTECTED_NS="kube-system|calico-system|tigera-operator|gatekeeper-system|metallb-system|istio-system|cert-manager|argocd"

    echo "[$(date -u +%FT%TZ)] pvc-ro-remediator starting"
    echo "  prometheus: $PROM_URL"
    echo "  dry-run: $DRY_RUN"
    echo "  protected namespaces: $PROTECTED_NS"

    # Fetch active alerts. The alerts API returns every state (firing/pending),
    # so filter to firing only.
    if ! alerts=$(curl -fsS --max-time 10 "${PROM_URL}/api/v1/alerts" 2>&1); then
      echo "[$(date -u +%FT%TZ)] ERROR: cannot reach Prometheus: $alerts"
      exit 1
    fi

    firing=$(echo "$alerts" | jq -c '.data.alerts[] | select(.labels.alertname=="PVCMountReadOnly" and .state=="firing")')

    if [ -z "$firing" ]; then
      echo "[$(date -u +%FT%TZ)] no firing PVCMountReadOnly alerts"
      exit 0
    fi

    echo "$firing" | while IFS= read -r alert; do
      mountpoint=$(echo "$alert" | jq -r '.labels.mountpoint')
      node=$(echo "$alert" | jq -r '.labels.node')
      pvc=$(echo "$alert" | jq -r '.labels.pvc')

      # Extract pod UID from the mountpoint path.
      # Format: /var/lib/kubelet/pods/<UID>/volumes/kubernetes.io~csi/<PVC>/mount
      pod_uid=$(echo "$mountpoint" | sed -n 's|.*/pods/\([a-f0-9-]*\)/volumes/.*|\1|p')

      if [ -z "$pod_uid" ]; then
        echo "[$(date -u +%FT%TZ)] WARN cannot extract pod UID from mountpoint=$mountpoint"
        continue
      fi

      # Look up the pod by UID. The pod-with-this-UID may have terminated
      # between alert firing and now, in which case we have nothing to do.
      pod_info=$(kubectl get pod -A -o json 2>/dev/null \
                 | jq -r --arg uid "$pod_uid" \
                     '.items[] | select(.metadata.uid==$uid) | "\(.metadata.namespace)/\(.metadata.name)"' \
                 | head -1)

      if [ -z "$pod_info" ]; then
        echo "[$(date -u +%FT%TZ)] no pod found with uid=$pod_uid (alert may be stale)"
        continue
      fi

      ns="${pod_info%/*}"
      pod="${pod_info#*/}"

      # Safety: refuse to touch protected namespaces.
      if echo "$ns" | grep -qE "^(${PROTECTED_NS})$"; then
        echo "[$(date -u +%FT%TZ)] REFUSE delete pod=$ns/$pod (protected namespace)"
        continue
      fi

      echo "[$(date -u +%FT%TZ)] ACTION pvc=$pvc node=$node pod=$ns/$pod uid=$pod_uid"

      if [ "$DRY_RUN" = "true" ]; then
        echo "[$(date -u +%FT%TZ)] DRY-RUN would: kubectl delete pod -n $ns $pod"
      else
        if kubectl delete pod -n "$ns" "$pod" --grace-period=30 2>&1; then
          echo "[$(date -u +%FT%TZ)] OK deleted pod=$ns/$pod"
        else
          echo "[$(date -u +%FT%TZ)] FAIL kubectl delete returned non-zero"
        fi
      fi
    done

    echo "[$(date -u +%FT%TZ)] pvc-ro-remediator done"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-ro-remediator
  namespace: synology-csi
  labels:
    app.kubernetes.io/name: pvc-ro-remediator
    app.kubernetes.io/component: remediator
spec:
  # Every 2 minutes. Detection-to-action: 2m alert window + up to 2m next
  # run = ~4 min worst case.
  schedule: "*/2 * * * *"
  timeZone: "America/Edmonton"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pvc-ro-remediator
            app.kubernetes.io/component: remediator
        spec:
          serviceAccountName: pvc-ro-remediator
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: remediator
              # alpine/k8s has kubectl + curl + jq + sh
              image: docker.io/alpine/k8s:1.36.2
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 48Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              env:
                # Start in dry-run mode so the first few cycles can be
                # observed before destructive actions are enabled. Flip
                # to "false" via a values change once happy.
                - name: DRY_RUN
                  value: "false"
                - name: PROM_URL
                  value: "http://kube-prometheus-stack-prometheus.default.svc:9090"
              command: ["/bin/sh", "/scripts/remediate.sh"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: kube
                  mountPath: /.kube
          volumes:
            - name: scripts
              configMap:
                name: pvc-ro-remediator-script
                defaultMode: 0755
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
            - name: kube
              emptyDir:
                sizeLimit: 4Mi
