---
# pvc-ro-remediator — auto-remediates PVC read-only remounts.
#
# Final step of TODO #17a (PVC RO-mount automation). Closes the loop:
#
#   pvc-mount-monitor DaemonSet (PR #734) → exports pvc_mount_readonly gauge
#   PrometheusRule PVCMountReadOnly  (PR #734) → fires after 2m sustained RO
#   pvc-ro-remediator CronJob       (this PR) → consumes alert, deletes pod
#                                              → fresh pod gets RW mount
#
# Total detection-to-recovery: 2m (alert window) + up to 2m (next CronJob)
# = ~4 min worst case. Beats the hours it took to notice manually.
#
# Safety:
#   - Hard-coded exclude list of system namespaces (won't touch kube-system,
#     calico-system, tigera-operator, gatekeeper-system, etc.)
#   - DRY_RUN env var (default false) prints the action without taking it
#   - Each action logged with alert labels + pod identity for audit trail
#   - If a pod gets repeatedly RO-remounted, the human still sees the alert
#     fire each cycle — automation doesn't suppress notification
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pvc-ro-remediator
  namespace: synology-csi
  labels:
    app.kubernetes.io/name: pvc-ro-remediator
    app.kubernetes.io/component: remediator
---
# Cluster-wide pod delete + monitor-endpoint discovery.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pvc-ro-remediator
  labels:
    app.kubernetes.io/name: pvc-ro-remediator
rules:
  - apiGroups: [""]
    resources: ["pods"]
    # `watch` added 2026-09-09. Without it `kubectl delete pod` still deletes,
    # but its wait-for-deletion watch fails, spamming reflector errors and
    # leaving the remediator unable to confirm the delete completed:
    #   Failed to watch ... cannot watch resource "pods" in namespace "..."
    verbs: ["get", "list", "watch", "delete"]
  # Cordon/uncordon. Required because deleting the pod is NOT sufficient on
  # its own — see the remediation block below. `patch` on nodes is the
  # narrowest verb that can set spec.unschedulable.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
  # Read-only: used to confirm the volume actually detached from the bad node,
  # which is the only real proof the read-only globalmount was torn down.
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list"]
  # Needed to discover pvc-mount-monitor pod IPs without going through
  # Prometheus. Endpoints are RBAC-checked at namespace scope but the
  # remediator may query monitors from any node, so keep cluster-scoped.
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pvc-ro-remediator
  labels:
    app.kubernetes.io/name: pvc-ro-remediator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pvc-ro-remediator
subjects:
  - kind: ServiceAccount
    name: pvc-ro-remediator
    namespace: synology-csi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pvc-ro-remediator-script
  namespace: synology-csi
  labels:
    app.kubernetes.io/name: pvc-ro-remediator
data:
  remediate.sh: |
    #!/bin/sh
    set -eu

    # Tracks a node WE cordoned, so the EXIT trap can undo it.
    #
    # A cordon that outlives this Job is worse than the fault it was meant to
    # fix: the node quietly stops accepting work and nothing says why. The
    # trap fires on every exit path — success, failure, `set -e` abort, or the
    # Job hitting activeDeadlineSeconds — which is the same lesson the restore
    # validator learned the hard way on 2026-09-08.
    #
    # Deliberately empty when the node was ALREADY cordoned by someone else:
    # that state is not ours to clear.
    CORDONED_NODE=""

    uncordon_if_needed() {
      if [ -n "${CORDONED_NODE:-}" ]; then
        if kubectl uncordon "$CORDONED_NODE" >/dev/null 2>&1; then
          echo "[$(date -u +%FT%TZ)] uncordoned node=$CORDONED_NODE"
        else
          echo "[$(date -u +%FT%TZ)] ALERT failed to uncordon node=$CORDONED_NODE — uncordon it by hand"
        fi
        CORDONED_NODE=""
      fi
    }
    trap uncordon_if_needed EXIT

    # Query the pvc-mount-monitor DaemonSet pods DIRECTLY via the headless
    # Service, bypassing Prometheus + alert evaluation entirely.
    #
    # Why: discovered 2026-06-21 that the remediator's previous design (query
    # Prometheus /api/v1/alerts for firing PVCMountReadOnly) silently became
    # a no-op when Prometheus itself was the workload with a RO PVC. That's
    # the single-point-of-failure trap of the "monitor the system from the
    # system" anti-pattern. Loki + Uptime Kuma + Grafana + Falco-Redis +
    # Prometheus all crashlooped for 16 days because the remediator's curl
    # to Prom failed silently (BackoffLimitExceeded, no actionable signal).
    #
    # The new path: enumerate pvc-mount-monitor endpoints via the K8s API,
    # scrape each one's /metrics directly, parse `pvc_mount_readonly{...} 1`
    # lines, act. Dependencies: K8s API + DNS + monitor pods themselves —
    # none of which depend on Prometheus.
    MONITOR_SVC="${MONITOR_SVC:-pvc-mount-monitor.synology-csi.svc.cluster.local}"
    MONITOR_PORT="${MONITOR_PORT:-9300}"
    DRY_RUN="${DRY_RUN:-false}"

    # Namespaces we will NEVER act on, even if alerts fire from them.
    # Keep this list small but cover anything where pod-delete-without-thought
    # could cascade badly.
    PROTECTED_NS="kube-system|calico-system|tigera-operator|gatekeeper-system|metallb-system|istio-system|cert-manager|argocd"

    echo "[$(date -u +%FT%TZ)] pvc-ro-remediator starting"
    echo "  monitor service: $MONITOR_SVC:$MONITOR_PORT"
    echo "  dry-run: $DRY_RUN"
    echo "  protected namespaces: $PROTECTED_NS"

    # Get monitor pod IPs from the Endpoints object — the headless Service
    # already has them and we have RBAC for endpoints (added by this PR).
    pod_ips=$(kubectl get endpoints -n synology-csi pvc-mount-monitor -o json 2>/dev/null \
              | jq -r '.subsets[]?.addresses[]?.ip')

    if [ -z "$pod_ips" ]; then
      echo "[$(date -u +%FT%TZ)] ERROR: no pvc-mount-monitor endpoints found — monitor DaemonSet down?"
      exit 1
    fi

    n_endpoints=$(echo "$pod_ips" | wc -l | tr -d ' ')
    echo "[$(date -u +%FT%TZ)] discovered $n_endpoints monitor endpoint(s)"

    # Scrape each endpoint and collect RO mount lines.
    # Format from monitor: pvc_mount_readonly{node="..",device="..",mountpoint="..",fstype="..",pvc=".."} 1
    ro_lines=""
    n_reached=0
    for ip in $pod_ips; do
      metrics=$(curl -fsS --max-time 5 "http://${ip}:${MONITOR_PORT}/metrics" 2>/dev/null) || {
        echo "[$(date -u +%FT%TZ)] WARN cannot reach monitor at $ip:$MONITOR_PORT"
        continue
      }
      n_reached=$((n_reached + 1))
      # `set -e` quirk: `grep` exits 1 on no match. The "no RO mounts" case
      # is the healthy state, so suppress non-zero with `|| true`. Without
      # this, every healthy run aborts the script before reaching the
      # success-path log line — exactly the silent-no-op pattern PR #753
      # was supposed to eliminate.
      ro=$(echo "$metrics" | grep '^pvc_mount_readonly{' | grep ' 1$' || true)
      ro_lines="${ro_lines}${ro}
    "
    done

    if [ "$n_reached" -eq 0 ]; then
      echo "[$(date -u +%FT%TZ)] ERROR: zero monitors reachable (of $n_endpoints endpoints)"
      exit 1
    fi

    # Strip blank lines and dedupe.
    ro_lines=$(echo "$ro_lines" | awk 'NF' | sort -u)

    if [ -z "$ro_lines" ]; then
      echo "[$(date -u +%FT%TZ)] no RO mounts detected ($n_reached/$n_endpoints monitors reachable)"
      exit 0
    fi

    n_ro=$(echo "$ro_lines" | wc -l | tr -d ' ')
    echo "[$(date -u +%FT%TZ)] $n_ro RO mount(s) detected"

    echo "$ro_lines" | while IFS= read -r line; do
      # Parse the label block. Each label is `key="value"`.
      mountpoint=$(echo "$line" | sed -n 's/.*mountpoint="\([^"]*\)".*/\1/p')
      node=$(echo "$line" | sed -n 's/.*node="\([^"]*\)".*/\1/p')
      pvc=$(echo "$line" | sed -n 's/.*pvc="\([^"]*\)".*/\1/p')

      # Extract pod UID from the mountpoint path.
      # Format: /var/lib/kubelet/pods/<UID>/volumes/kubernetes.io~csi/<PVC>/mount
      pod_uid=$(echo "$mountpoint" | sed -n 's|.*/pods/\([a-f0-9-]*\)/volumes/.*|\1|p')

      if [ -z "$pod_uid" ]; then
        echo "[$(date -u +%FT%TZ)] WARN cannot extract pod UID from mountpoint=$mountpoint"
        continue
      fi

      # Look up the pod by UID. The pod-with-this-UID may have terminated
      # between alert firing and now, in which case we have nothing to do.
      pod_info=$(kubectl get pod -A -o json 2>/dev/null \
                 | jq -r --arg uid "$pod_uid" \
                     '.items[] | select(.metadata.uid==$uid) | "\(.metadata.namespace)/\(.metadata.name)"' \
                 | head -1)

      if [ -z "$pod_info" ]; then
        echo "[$(date -u +%FT%TZ)] no pod found with uid=$pod_uid (alert may be stale)"
        continue
      fi

      ns="${pod_info%/*}"
      pod="${pod_info#*/}"

      # Safety: refuse to touch protected namespaces.
      if echo "$ns" | grep -qE "^(${PROTECTED_NS})$"; then
        echo "[$(date -u +%FT%TZ)] REFUSE delete pod=$ns/$pod (protected namespace)"
        continue
      fi

      echo "[$(date -u +%FT%TZ)] ACTION pvc=$pvc node=$node pod=$ns/$pod uid=$pod_uid"

      if [ "$DRY_RUN" = "true" ]; then
        echo "[$(date -u +%FT%TZ)] DRY-RUN would: cordon $node; delete pod -n $ns $pod; wait for detach; uncordon"
      else
        # WHY THIS IS NOT JUST `kubectl delete pod`
        #
        # A pod's volume dir is a bind-mount of the CSI driver's per-node
        # globalmount. When btrfs remounts that globalmount read-only, deleting
        # the pod achieves nothing if the replacement lands on the SAME node —
        # it bind-mounts the identical read-only globalmount and crashes the
        # same way. Only NodeUnstageVolume rebuilds it, and that requires the
        # volume to detach from the node entirely.
        #
        # Observed live 2026-09-09: uptime-kuma went EROFS, this remediator
        # deleted the pod every 2 minutes and reported OK each time, and the
        # replacement kept landing back on node03 still read-only. It took
        # manual intervention. The Jobs were succeeding while fixing nothing.
        #
        # Scaling the workload to 0 is not an option either: ArgoCD selfHeal
        # reverts it within seconds (confirmed — it self-healed at 18:51:29
        # that same day, seconds after a manual scale to 0).
        #
        # So: cordon the node, delete the pod, and let the scheduler place the
        # replacement elsewhere. The cordon is what makes it deterministic
        # rather than a coin flip on scheduler placement.
        cordon_ok="false"
        already_cordoned=$(kubectl get node "$node" -o jsonpath='{.spec.unschedulable}' 2>/dev/null)

        if [ "$already_cordoned" = "true" ]; then
          # Someone else cordoned this node. Work with it, but do NOT uncordon
          # on the way out — that state is not ours to clear.
          echo "[$(date -u +%FT%TZ)] node=$node already cordoned (not by us); leaving it that way"
          cordon_ok="true"
        else
          # Refuse if there is nowhere for the pod to go. Cordoning the last
          # schedulable node converts a one-workload outage into a cluster-wide
          # one, which is a far worse failure than the one being fixed.
          schedulable=$(kubectl get nodes -o json 2>/dev/null \
            | jq '[.items[] | select(.spec.unschedulable != true)] | length')
          if [ "${schedulable:-0}" -lt 2 ]; then
            echo "[$(date -u +%FT%TZ)] REFUSE cordon node=$node — only ${schedulable:-0} schedulable node(s); pod would have nowhere to go"
            continue
          fi
          if kubectl cordon "$node" >/dev/null 2>&1; then
            CORDONED_NODE="$node"   # the EXIT trap guarantees this is undone
            cordon_ok="true"
            echo "[$(date -u +%FT%TZ)] cordoned node=$node ($schedulable schedulable before)"
          else
            echo "[$(date -u +%FT%TZ)] FAIL could not cordon node=$node — deleting pod anyway (may land on the same node)"
          fi
        fi

        if kubectl delete pod -n "$ns" "$pod" --grace-period=30 >/dev/null 2>&1; then
          echo "[$(date -u +%FT%TZ)] OK deleted pod=$ns/$pod"
        else
          echo "[$(date -u +%FT%TZ)] FAIL kubectl delete returned non-zero"
        fi

        # Success is the volume DETACHING from the bad node. That is the only
        # evidence NodeUnstageVolume ran and the read-only globalmount is gone.
        # Pod-is-Running is not evidence: it can be Running on the same node,
        # still read-only, which is exactly how this went unnoticed.
        if [ "$cordon_ok" = "true" ]; then
          waited=0
          detached="false"
          while [ "$waited" -lt "${DETACH_TIMEOUT:-180}" ]; do
            n_att=$(kubectl get volumeattachment -o json 2>/dev/null \
              | jq --arg pv "$pvc" --arg n "$node" \
                  '[.items[] | select(.spec.source.persistentVolumeName==$pv and .spec.nodeName==$n)] | length')
            if [ "${n_att:-1}" = "0" ]; then detached="true"; break; fi
            sleep 5; waited=$((waited + 5))
          done
          if [ "$detached" = "true" ]; then
            echo "[$(date -u +%FT%TZ)] OK volume $pvc detached from $node after ${waited}s — globalmount torn down"
          else
            echo "[$(date -u +%FT%TZ)] WARN volume $pvc still attached to $node after ${waited}s; it may still be read-only"
          fi
        fi

        uncordon_if_needed
      fi
    done

    echo "[$(date -u +%FT%TZ)] pvc-ro-remediator done"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-ro-remediator
  namespace: synology-csi
  labels:
    app.kubernetes.io/name: pvc-ro-remediator
    app.kubernetes.io/component: remediator
spec:
  # Every 2 minutes. Detection-to-action: 2m alert window + up to 2m next
  # run = ~4 min worst case.
  schedule: "*/2 * * * *"
  timeZone: "America/Edmonton"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pvc-ro-remediator
            app.kubernetes.io/component: remediator
        spec:
          serviceAccountName: pvc-ro-remediator
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: remediator
              # alpine/k8s has kubectl + curl + jq + sh
              image: docker.io/alpine/k8s:1.37.0
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 48Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              env:
                - name: DRY_RUN
                  value: "false"
                # Monitor service overrides — defaults are fine, exposed for
                # debugging without rebuilding the ConfigMap.
                # - name: MONITOR_SVC
                #   value: "pvc-mount-monitor.synology-csi.svc.cluster.local"
                # - name: MONITOR_PORT
                #   value: "9300"
              command: ["/bin/sh", "/scripts/remediate.sh"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: kube
                  mountPath: /.kube
          volumes:
            - name: scripts
              configMap:
                name: pvc-ro-remediator-script
                defaultMode: 0755
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
            - name: kube
              emptyDir:
                sizeLimit: 4Mi
