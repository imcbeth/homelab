---
# pvc-ro-remediator — auto-remediates PVC read-only remounts.
#
# Final step of TODO #17a (PVC RO-mount automation). Closes the loop:
#
#   pvc-mount-monitor DaemonSet (PR #734) → exports pvc_mount_readonly gauge
#   PrometheusRule PVCMountReadOnly  (PR #734) → fires after 2m sustained RO
#   pvc-ro-remediator CronJob       (this PR) → consumes alert, deletes pod
#                                              → fresh pod gets RW mount
#
# Total detection-to-recovery: 2m (alert window) + up to 2m (next CronJob)
# = ~4 min worst case. Beats the hours it took to notice manually.
#
# Safety:
#   - Hard-coded exclude list of system namespaces (won't touch kube-system,
#     calico-system, tigera-operator, gatekeeper-system, etc.)
#   - DRY_RUN env var (default false) prints the action without taking it
#   - Each action logged with alert labels + pod identity for audit trail
#   - If a pod gets repeatedly RO-remounted, the human still sees the alert
#     fire each cycle — automation doesn't suppress notification
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pvc-ro-remediator
  namespace: synology-csi
  labels:
    app.kubernetes.io/name: pvc-ro-remediator
    app.kubernetes.io/component: remediator
---
# Cluster-wide pod delete + monitor-endpoint discovery.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pvc-ro-remediator
  labels:
    app.kubernetes.io/name: pvc-ro-remediator
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  # Needed to discover pvc-mount-monitor pod IPs without going through
  # Prometheus. Endpoints are RBAC-checked at namespace scope but the
  # remediator may query monitors from any node, so keep cluster-scoped.
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pvc-ro-remediator
  labels:
    app.kubernetes.io/name: pvc-ro-remediator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pvc-ro-remediator
subjects:
  - kind: ServiceAccount
    name: pvc-ro-remediator
    namespace: synology-csi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pvc-ro-remediator-script
  namespace: synology-csi
  labels:
    app.kubernetes.io/name: pvc-ro-remediator
data:
  remediate.sh: |
    #!/bin/sh
    set -eu

    # Query the pvc-mount-monitor DaemonSet pods DIRECTLY via the headless
    # Service, bypassing Prometheus + alert evaluation entirely.
    #
    # Why: discovered 2026-06-21 that the remediator's previous design (query
    # Prometheus /api/v1/alerts for firing PVCMountReadOnly) silently became
    # a no-op when Prometheus itself was the workload with a RO PVC. That's
    # the single-point-of-failure trap of the "monitor the system from the
    # system" anti-pattern. Loki + Uptime Kuma + Grafana + Falco-Redis +
    # Prometheus all crashlooped for 16 days because the remediator's curl
    # to Prom failed silently (BackoffLimitExceeded, no actionable signal).
    #
    # The new path: enumerate pvc-mount-monitor endpoints via the K8s API,
    # scrape each one's /metrics directly, parse `pvc_mount_readonly{...} 1`
    # lines, act. Dependencies: K8s API + DNS + monitor pods themselves —
    # none of which depend on Prometheus.
    MONITOR_SVC="${MONITOR_SVC:-pvc-mount-monitor.synology-csi.svc.cluster.local}"
    MONITOR_PORT="${MONITOR_PORT:-9300}"
    DRY_RUN="${DRY_RUN:-false}"

    # Namespaces we will NEVER act on, even if alerts fire from them.
    # Keep this list small but cover anything where pod-delete-without-thought
    # could cascade badly.
    PROTECTED_NS="kube-system|calico-system|tigera-operator|gatekeeper-system|metallb-system|istio-system|cert-manager|argocd"

    echo "[$(date -u +%FT%TZ)] pvc-ro-remediator starting"
    echo "  monitor service: $MONITOR_SVC:$MONITOR_PORT"
    echo "  dry-run: $DRY_RUN"
    echo "  protected namespaces: $PROTECTED_NS"

    # Get monitor pod IPs from the Endpoints object — the headless Service
    # already has them and we have RBAC for endpoints (added by this PR).
    pod_ips=$(kubectl get endpoints -n synology-csi pvc-mount-monitor -o json 2>/dev/null \
              | jq -r '.subsets[]?.addresses[]?.ip')

    if [ -z "$pod_ips" ]; then
      echo "[$(date -u +%FT%TZ)] ERROR: no pvc-mount-monitor endpoints found — monitor DaemonSet down?"
      exit 1
    fi

    n_endpoints=$(echo "$pod_ips" | wc -l | tr -d ' ')
    echo "[$(date -u +%FT%TZ)] discovered $n_endpoints monitor endpoint(s)"

    # Scrape each endpoint and collect RO mount lines.
    # Format from monitor: pvc_mount_readonly{node="..",device="..",mountpoint="..",fstype="..",pvc=".."} 1
    ro_lines=""
    n_reached=0
    for ip in $pod_ips; do
      metrics=$(curl -fsS --max-time 5 "http://${ip}:${MONITOR_PORT}/metrics" 2>/dev/null) || {
        echo "[$(date -u +%FT%TZ)] WARN cannot reach monitor at $ip:$MONITOR_PORT"
        continue
      }
      n_reached=$((n_reached + 1))
      # `set -e` quirk: `grep` exits 1 on no match. The "no RO mounts" case
      # is the healthy state, so suppress non-zero with `|| true`. Without
      # this, every healthy run aborts the script before reaching the
      # success-path log line — exactly the silent-no-op pattern PR #753
      # was supposed to eliminate.
      ro=$(echo "$metrics" | grep '^pvc_mount_readonly{' | grep ' 1$' || true)
      ro_lines="${ro_lines}${ro}
    "
    done

    if [ "$n_reached" -eq 0 ]; then
      echo "[$(date -u +%FT%TZ)] ERROR: zero monitors reachable (of $n_endpoints endpoints)"
      exit 1
    fi

    # Strip blank lines and dedupe.
    ro_lines=$(echo "$ro_lines" | awk 'NF' | sort -u)

    if [ -z "$ro_lines" ]; then
      echo "[$(date -u +%FT%TZ)] no RO mounts detected ($n_reached/$n_endpoints monitors reachable)"
      exit 0
    fi

    n_ro=$(echo "$ro_lines" | wc -l | tr -d ' ')
    echo "[$(date -u +%FT%TZ)] $n_ro RO mount(s) detected"

    echo "$ro_lines" | while IFS= read -r line; do
      # Parse the label block. Each label is `key="value"`.
      mountpoint=$(echo "$line" | sed -n 's/.*mountpoint="\([^"]*\)".*/\1/p')
      node=$(echo "$line" | sed -n 's/.*node="\([^"]*\)".*/\1/p')
      pvc=$(echo "$line" | sed -n 's/.*pvc="\([^"]*\)".*/\1/p')

      # Extract pod UID from the mountpoint path.
      # Format: /var/lib/kubelet/pods/<UID>/volumes/kubernetes.io~csi/<PVC>/mount
      pod_uid=$(echo "$mountpoint" | sed -n 's|.*/pods/\([a-f0-9-]*\)/volumes/.*|\1|p')

      if [ -z "$pod_uid" ]; then
        echo "[$(date -u +%FT%TZ)] WARN cannot extract pod UID from mountpoint=$mountpoint"
        continue
      fi

      # Look up the pod by UID. The pod-with-this-UID may have terminated
      # between alert firing and now, in which case we have nothing to do.
      pod_info=$(kubectl get pod -A -o json 2>/dev/null \
                 | jq -r --arg uid "$pod_uid" \
                     '.items[] | select(.metadata.uid==$uid) | "\(.metadata.namespace)/\(.metadata.name)"' \
                 | head -1)

      if [ -z "$pod_info" ]; then
        echo "[$(date -u +%FT%TZ)] no pod found with uid=$pod_uid (alert may be stale)"
        continue
      fi

      ns="${pod_info%/*}"
      pod="${pod_info#*/}"

      # Safety: refuse to touch protected namespaces.
      if echo "$ns" | grep -qE "^(${PROTECTED_NS})$"; then
        echo "[$(date -u +%FT%TZ)] REFUSE delete pod=$ns/$pod (protected namespace)"
        continue
      fi

      echo "[$(date -u +%FT%TZ)] ACTION pvc=$pvc node=$node pod=$ns/$pod uid=$pod_uid"

      if [ "$DRY_RUN" = "true" ]; then
        echo "[$(date -u +%FT%TZ)] DRY-RUN would: kubectl delete pod -n $ns $pod"
      else
        if kubectl delete pod -n "$ns" "$pod" --grace-period=30 2>&1; then
          echo "[$(date -u +%FT%TZ)] OK deleted pod=$ns/$pod"
        else
          echo "[$(date -u +%FT%TZ)] FAIL kubectl delete returned non-zero"
        fi
      fi
    done

    echo "[$(date -u +%FT%TZ)] pvc-ro-remediator done"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-ro-remediator
  namespace: synology-csi
  labels:
    app.kubernetes.io/name: pvc-ro-remediator
    app.kubernetes.io/component: remediator
spec:
  # Every 2 minutes. Detection-to-action: 2m alert window + up to 2m next
  # run = ~4 min worst case.
  schedule: "*/2 * * * *"
  timeZone: "America/Edmonton"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pvc-ro-remediator
            app.kubernetes.io/component: remediator
        spec:
          serviceAccountName: pvc-ro-remediator
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: remediator
              # alpine/k8s has kubectl + curl + jq + sh
              image: docker.io/alpine/k8s:1.36.4
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 48Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              env:
                - name: DRY_RUN
                  value: "false"
                # Monitor service overrides — defaults are fine, exposed for
                # debugging without rebuilding the ConfigMap.
                # - name: MONITOR_SVC
                #   value: "pvc-mount-monitor.synology-csi.svc.cluster.local"
                # - name: MONITOR_PORT
                #   value: "9300"
              command: ["/bin/sh", "/scripts/remediate.sh"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: kube
                  mountPath: /.kube
          volumes:
            - name: scripts
              configMap:
                name: pvc-ro-remediator-script
                defaultMode: 0755
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
            - name: kube
              emptyDir:
                sizeLimit: 4Mi
