apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink-demo
  namespace: flink-demo
  labels:
    app.kubernetes.io/name: flink-demo
    app.kubernetes.io/component: serviceaccount
---
# Flink JobManager needs to create/list/delete TaskManager pods
# and watch Services/ConfigMaps within the flink-demo namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink-demo
  namespace: flink-demo
  labels:
    app.kubernetes.io/name: flink-demo
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-demo
  namespace: flink-demo
  labels:
    app.kubernetes.io/name: flink-demo
    app.kubernetes.io/component: rbac
subjects:
  - kind: ServiceAccount
    name: flink-demo
    namespace: flink-demo
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: flink-demo
