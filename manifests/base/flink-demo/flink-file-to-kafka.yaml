apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: file-to-kafka
  namespace: flink-demo
  labels:
    app.kubernetes.io/name: flink-demo
    app.kubernetes.io/component: file-to-kafka
spec:
  # Custom image: apache/flink:2.2.1-java17 + Temurin 17 JDK + Python3 + PyFlink + Kafka JAR + boto3
  # Built in-cluster: argo submit --from workflowtemplate/flink-demo-build -n argo-workflows -p version=<v>
  image: registry.k8s.n37.ca/flink-demo:2.0.0
  flinkVersion: v2_2

  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "1"
    # Suppress verbose Flink internal logs; pipeline logs use INFO
    rootLogger.level: INFO

  serviceAccount: flink-demo

  jobManager:
    resource:
      memory: "1Gi"
      cpu: 0.25

  taskManager:
    resource:
      memory: "1Gi"
      cpu: 0.25

  # Mount CSV data and pipeline script from ConfigMaps
  podTemplate:
    spec:
      # flink-demo enforces PodSecurity "restricted" since 2026-10-29 (#1086).
      # kafka-to-s3 got these settings then (O14); this job had already
      # FINISHED and was not redeployed until the Flink 2.2 move (2026-11-21),
      # when its JobManager pod was refused. Same values as kafka-to-s3. 9999
      # is the flink user in apache/flink.
      securityContext:
        runAsNonRoot: true
        runAsUser: 9999
        runAsGroup: 9999
        fsGroup: 9999
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: test-data
          configMap:
            name: flink-test-data
        - name: pipeline-script
          configMap:
            name: flink-pipeline-file-to-kafka
            defaultMode: 0755
      containers:
        - name: flink-main-container
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: test-data
              mountPath: /opt/flink/data
            - name: pipeline-script
              mountPath: /opt/flink/scripts
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
            - name: KAFKA_TOPIC
              value: "flink-events"
            - name: DATA_FILE
              value: "/opt/flink/data/sales-data.csv"

  job:
    # flink-python.jar bootstraps PyFlink; the -py flag points to the script
    jarURI: local:///opt/flink/opt/flink-python.jar
    entryClass: org.apache.flink.client.python.PythonDriver
    args:
      - "-py"
      - "/opt/flink/scripts/pipeline_file_to_kafka.py"
    parallelism: 1
    # stateless: job restarts from scratch (re-reads file, re-publishes)
    upgradeMode: stateless
