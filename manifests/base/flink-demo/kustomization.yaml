apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # RBAC: ServiceAccount + Role + RoleBinding for FlinkDeployment pods
  - rbac.yaml
  # Config: CSV test data mounted into the file-to-kafka job
  - test-data-configmap.yaml
  # Pipeline scripts (ConfigMaps override scripts baked into Docker image)
  - pipeline-file-to-kafka-configmap.yaml
  - pipeline-kafka-to-s3-configmap.yaml
  # PreSync hook: creates the flink-output S3 bucket in LocalStack
  - localstack-setup-job.yaml
  # Flink jobs
  - flink-file-to-kafka.yaml
  - flink-kafka-to-s3.yaml
  # Ingress: flink.k8s.n37.ca -> file-to-kafka Flink UI (oauth2-proxy SSO)
  - ingress.yaml
