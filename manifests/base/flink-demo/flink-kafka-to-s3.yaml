apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: kafka-to-s3
  namespace: flink-demo
  labels:
    app.kubernetes.io/name: flink-demo
    app.kubernetes.io/component: kafka-to-s3
spec:
  # Custom image: apache/flink:2.2.1-java17 + Temurin 17 JDK + Python3 + PyFlink + Kafka JAR + boto3
  # Built in-cluster: argo submit --from workflowtemplate/flink-demo-build -n argo-workflows -p version=<v>
  image: registry.k8s.n37.ca/flink-demo:2.0.0
  flinkVersion: v2_2

  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "1"
    rootLogger.level: INFO
    # No checkpointing for this demo — restarts replay from EARLIEST offset
    # For production: enable checkpointing with a persistent state backend
    #
    # Without checkpointing Flink's default restart strategy is "none", so one
    # lost TaskManager ended this job for good: it sat FAILED from 2026-08-15
    # ("TaskManager ... is no longer reachable", NoRestartBackoffTimeStrategy)
    # until 2026-11-16 (O14). Retry with backoff instead.
    restart-strategy.type: exponential-delay

  serviceAccount: flink-demo

  jobManager:
    resource:
      memory: "1Gi"
      cpu: 0.25

  taskManager:
    resource:
      memory: "1Gi"
      cpu: 0.25

  # Mount pipeline script from ConfigMap
  podTemplate:
    spec:
      # flink-demo enforces PodSecurity "restricted" since 2026-10-29 (#1086),
      # after this job last ran; without these the operator's JobManager and
      # TaskManager pods are refused. 9999 is the flink user in apache/flink.
      securityContext:
        runAsNonRoot: true
        runAsUser: 9999
        runAsGroup: 9999
        fsGroup: 9999
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: pipeline-script
          configMap:
            name: flink-pipeline-kafka-to-s3
            defaultMode: 0755
      containers:
        - name: flink-main-container
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: pipeline-script
              mountPath: /opt/flink/scripts
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
            - name: KAFKA_TOPIC
              value: "flink-events"
            - name: KAFKA_CONSUMER_GROUP
              value: "flink-kafka-to-s3"
            - name: S3_ENDPOINT_URL
              value: "http://localstack.localstack.svc.cluster.local:4566"
            - name: S3_BUCKET
              value: "flink-output"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"

  # Bump to force a redeploy (operator compares it with the last deployed
  # spec). 1: restart after the August failure (O14).
  restartNonce: 1

  job:
    jarURI: local:///opt/flink/opt/flink-python.jar
    entryClass: org.apache.flink.client.python.PythonDriver
    args:
      - "-py"
      - "/opt/flink/scripts/pipeline_kafka_to_s3.py"
    parallelism: 1
    # stateless: restarts replay from EARLIEST offset in Kafka
    upgradeMode: stateless
