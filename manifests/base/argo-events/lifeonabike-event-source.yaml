# GitHub EventSource for the lifeonabike build pipelines.
#
# Listens for push events (main branch only) on two repos and fires one event
# per repo:
#   lifeonabike-push        imcbeth/lifeonabike.ca     -> Sensor lifeonabike-build
#   lifeonabike-agent-push  imcbeth/lifeonabike-agent  -> Sensor lifeonabike-agent-build
#
# Both share this EventSource's server on port 12000, the HMAC secret, and the
# public hostname; they differ by path. The agent's path is /push/agent rather
# than /push-agent so the internal Ingress's `/push` Prefix rule (path-element
# matching) covers it too. The Cloudflare tunnel route is path-agnostic.
#
# imcbeth/lifeonabike-agent is PRIVATE: github-access-token must be able to
# manage hooks on it (classic PAT with admin:repo_hook, or a fine-grained PAT
# that includes the repo with Webhooks: read/write), and github-clone-token in
# argo-workflows must be able to read it.
#
# `active: true` is required on every event. Argo Events creates the GitHub
# hook with the `active` flag from the spec, which defaults to false — the
# lifeonabike-agent hook was created inactive (2026-11-03) and received no
# deliveries. The site's hook was only active because it had been switched on
# by hand; declaring it here keeps a re-created hook working.
#
# Prerequisites (one-time cluster setup):
#   # GitHub PAT with repo scope + admin:repo_hook for auto-registration
#   kubectl create secret generic github-access-token \
#     --from-literal=token=<your-pat> -n argo-events
#
#   # Shared HMAC secret — paste the same value into the GitHub webhook form
#   kubectl create secret generic github-lifeonabike-webhook-secret \
#     --from-literal=secret=$(openssl rand -hex 32) -n argo-events
#
# Exposes port 12000 via the lifeonabike-github-eventsource-svc Service,
# routed publicly at https://build-webhook.n37.ca/push (via Cloudflare Tunnel homelab-k8s).
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: lifeonabike-github
  namespace: argo-events
spec:
  service:
    ports:
      - port: 12000
        targetPort: 12000
  github:
    lifeonabike-push:
      repositories:
        - owner: imcbeth
          names:
            - lifeonabike.ca
      webhook:
        endpoint: /push
        port: "12000"
        method: POST
        url: https://build-webhook.n37.ca
      events:
        - push
      active: true
      apiToken:
        name: github-access-token
        key: token
      webhookSecret:
        name: github-lifeonabike-webhook-secret
        key: secret
      filter:
        expression: "body.ref == 'refs/heads/main'"
    lifeonabike-agent-push:
      repositories:
        - owner: imcbeth
          names:
            - lifeonabike-agent
      webhook:
        endpoint: /push/agent
        port: "12000"
        method: POST
        url: https://build-webhook.n37.ca
      events:
        - push
      active: true
      apiToken:
        name: github-access-token
        key: token
      webhookSecret:
        name: github-lifeonabike-webhook-secret
        key: secret
      filter:
        expression: "body.ref == 'refs/heads/main'"
