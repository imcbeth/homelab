# Scrapes the EventBus's prometheus-nats-exporter sidecar (port 7777).
#
# The exporter has run in eventbus-default-js-0 since the EventBus was created,
# and the argo-events NetworkPolicy has admitted Prometheus on 7777 for it all
# along, but nothing ever selected it: the chart's ServiceMonitor covers only
# the controller-manager. Found 2026-11-15 while verifying the NATS sidecar
# bump (#1156), when `up{namespace="argo-events"}` showed only the controller.
#
# The Service is created by the eventbus-controller (headless, ports
# tcp-client/cluster/metrics/monitor), so this selects it by the labels that
# controller sets rather than by a name this repo does not own.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: eventbus-default-nats
  namespace: argo-events
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      controller: eventbus-controller
      eventbus-name: default
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 10s
