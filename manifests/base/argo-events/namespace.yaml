apiVersion: v1
kind: Namespace
metadata:
  name: argo-events
  labels:
    # Pod Security Admission. Verified with `kubectl label --dry-run=server`
    # against the running pods on 2026-10-29 — this level does not evict or
    # block anything currently deployed.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    # Enrol in Istio Ambient mesh (mTLS via ztunnel)
    istio.io/dataplane-mode: ambient
    kubernetes.io/metadata.name: argo-events
