apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
  namespace: argo-events
spec:
  jetstream:
    # NATS JetStream — default messaging backbone for EventSources and Sensors
    # Resolved against configs.jetstream.versions in values.yaml, which pins
    # patched sidecars for this entry (2026-11-15). Rollback: "2.10.10".
    #
    # Changing this restarts eventbus-default-js-0. With persistence (below)
    # the streams and the sensors' K/V buckets survive; a GitHub push
    # delivered during the ~1 minute restart can still be missed.
    version: "2.10.29"
    replicas: 1
    # Override stream replicas: Argo Events defaults to 3, which is rejected by
    # a non-clustered (single-node) NATS server with "replicas > 1 not supported".
    streamConfig: |
      replicas: 1
    # Persistent JetStream storage (2026-11-15). Without it js-data is an
    # emptyDir, so every restart of eventbus-default-js-0 -- upgrade, node
    # reboot, drain -- wiped JetStream, including each sensor's K/V bucket.
    # Sensors create that bucket only at startup, so they looped on
    # "nats: bucket not found" and triggered no builds until restarted
    # (after #1156; alerted on by ArgoEventsSensorBucketMissing, #1170).
    #
    # Sized from measured use: 506 bytes across 3 streams on 2026-11-15,
    # stream cap 1GB (maxbytes). The controller's default is 20Gi.
    # synology-iscsi-delete because the data is transient (72h maxage) and the
    # controller deletes this PVC itself if the EventBus is ever removed.
    #
    # Rolling this out needs ONE manual step: the controller updates the
    # StatefulSet in place, and volumeClaimTemplates is immutable, so the
    # update is rejected until the StatefulSet is deleted and recreated:
    #   kubectl delete sts -n argo-events eventbus-default-js
    # The new PVC starts empty, so restart both sensors once afterwards.
    persistence:
      storageClassName: synology-iscsi-delete
      accessMode: ReadWriteOnce
      volumeSize: 2Gi
    # PodSecurity `restricted` (2026-11-15, O9). None of the nats images sets
    # a USER, so all three containers ran as root.
    #
    # fsGroup is what makes this safe on the existing PVC: its JetStream data
    # was written by root-run NATS (0750 dirs), and synology-csi's
    # fsGroupPolicy is ReadWriteOnceWithFSType, so the kubelet re-owns the
    # volume to group 65534 and makes it group-writable on mount. The
    # reloader signals NATS through the shared pid file (the controller sets
    # shareProcessNamespace), which works because all three share one UID.
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerTemplate:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
    reloaderContainerTemplate:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
    metricsContainerTemplate:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
