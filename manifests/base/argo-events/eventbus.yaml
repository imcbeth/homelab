apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
  namespace: argo-events
spec:
  jetstream:
    # NATS JetStream — default messaging backbone for EventSources and Sensors
    version: "2.10.10"
    replicas: 1
    # Override stream replicas: Argo Events defaults to 3, which is rejected by
    # a non-clustered (single-node) NATS server with "replicas > 1 not supported".
    streamConfig: |
      replicas: 1
    containerTemplate:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
    reloaderContainerTemplate:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
    metricsContainerTemplate:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
