apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lifeonabike
  labels:
    app: lifeonabike-web
    app.kubernetes.io/name: lifeonabike-web
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lifeonabike-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: lifeonabike-web
        app.kubernetes.io/name: lifeonabike-web
    spec:
      # Read-only registry credentials, NOT admin.
      #
      # This used to mount `lifeonabike-registry-creds`, which is the zot
      # `admin` account: read/create/update/delete on every repository. On
      # the public-facing pod. A compromise here meant the attacker could
      # replace or delete any image in the registry, including ones other
      # workloads pull.
      #
      # `zot-puller-creds` authenticates as `puller`, which zot's
      # `defaultPolicy: ["read"]` grants read and nothing else. The admin
      # credential stays in argo-workflows, where the build pipeline
      # genuinely needs create/update to push.
      imagePullSecrets:
        - name: zot-puller-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 101          # nginx user in the alpine image
        fsGroup: 101
      containers:
        - name: web
          # Tag is updated by the Argo build workflow after each successful build.
          image: registry.k8s.n37.ca/lifeonabike/lifeonabike.ca:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # nginx needs /var/cache, /var/run
            capabilities:
              drop: ["ALL"]
