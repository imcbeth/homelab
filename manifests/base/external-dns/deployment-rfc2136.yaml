apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-rfc2136
  namespace: external-dns
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/component: rfc2136
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
      app.kubernetes.io/component: rfc2136
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
        app.kubernetes.io/component: rfc2136
    spec:
      serviceAccountName: external-dns-rfc2136
      containers:
      - name: external-dns
        image: registry.k8s.io/external-dns/external-dns:v0.15.0
        args:
        # Provider configuration
        - --provider=rfc2136
        - --rfc2136-host=10.0.1.1  # UniFi UDR7 controller
        - --rfc2136-port=53
        - --rfc2136-zone=n37.ca  # Your internal DNS zone
        - --rfc2136-insecure  # UniFi typically doesn't use TLS for RFC2136
        - --rfc2136-tsig-axfr  # Use TSIG for zone transfers

        # Source configuration - watch both Ingress and LoadBalancer services
        - --source=ingress
        - --source=service

        # Domain filtering - same domain as Cloudflare
        - --domain-filter=k8s.n37.ca

        # Policy - upsert-only (safe, won't delete records)
        - --policy=upsert-only

        # TXT registry for ownership tracking
        - --registry=txt
        - --txt-owner-id=external-dns-rfc2136
        - --txt-prefix=external-dns-

        # Logging
        - --log-level=info
        - --log-format=text

        # Sync interval
        - --interval=1m

        env:
        - name: EXTERNAL_DNS_RFC2136_TSIG_KEYNAME
          valueFrom:
            secretKeyRef:
              name: rfc2136-credentials
              key: tsig-keyname
        - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
          valueFrom:
            secretKeyRef:
              name: rfc2136-credentials
              key: tsig-secret
        - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET_ALG
          valueFrom:
            secretKeyRef:
              name: rfc2136-credentials
              key: tsig-algorithm

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
