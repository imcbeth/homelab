apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-cloudflare
  namespace: external-dns
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/component: cloudflare
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
      app.kubernetes.io/component: cloudflare
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
        app.kubernetes.io/component: cloudflare
    spec:
      serviceAccountName: external-dns-cloudflare
      containers:
      - name: external-dns
        image: registry.k8s.n37.ca/external-dns/external-dns:v0.21.0
        args:
        # Provider configuration
        - --provider=cloudflare
        - --cloudflare-dns-records-per-page=5000

        # Source configuration - watch both Ingress and LoadBalancer services
        - --source=ingress
        - --source=service

        # Domain filtering - managed zones
        - --domain-filter=n37.ca
        - --domain-filter=lifeonabike.ca
        # Never publish RFC1918 addresses to PUBLIC DNS.
        #
        # Every k8s.n37.ca Ingress hostname resolved publicly to 10.0.10.10
        # (the MetalLB LB) — argocd, grafana, status, workflows, registry,
        # oauth, falco, localstack, flink. Verified via DNS-over-HTTPS against
        # Cloudflare on 2026-09-10, which is the only way to check: the UDR
        # intercepts outbound DNS, so `dig @1.1.1.1` is answered locally and
        # tells you nothing about what is actually published.
        #
        # RFC1918 is unroutable so this was not an exploit path, but it
        # disclosed the internal addressing scheme and the full list of
        # services to anyone who asked Cloudflare. Internal names are served
        # by external-dns-unifi, which is where they belong.
        #
        # NOTE: --policy=upsert-only below means external-dns never deletes.
        # This stops NEW records being published; the records already in
        # Cloudflare must be removed separately.
        - --exclude-target-net=10.0.0.0/8

        # Policy - upsert-only (safe, won't delete records)
        - --policy=upsert-only

        # TXT registry for ownership tracking
        - --registry=txt
        - --txt-owner-id=external-dns-cloudflare
        - --txt-prefix=external-dns-

        # Logging
        - --log-level=info
        - --log-format=text

        # Sync interval
        - --interval=1m

        # Cloudflare-specific settings
        # Note: cloudflare-proxied defaults to false (direct to MetalLB IPs, not proxied)

        env:
        - name: CF_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-api-token
              key: api-token

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
