apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-cloudflare
  namespace: external-dns
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/component: cloudflare
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
      app.kubernetes.io/component: cloudflare
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
        app.kubernetes.io/component: cloudflare
    spec:
      serviceAccountName: external-dns-cloudflare
      containers:
      - name: external-dns
        image: registry.k8s.io/external-dns/external-dns:v0.20.0
        args:
        # Provider configuration
        - --provider=cloudflare
        - --cloudflare-dns-records-per-page=5000

        # Source configuration - watch both Ingress and LoadBalancer services
        - --source=ingress
        - --source=service

        # Domain filtering - managed zones
        - --domain-filter=n37.ca
        - --domain-filter=lifeonabike.ca

        # Policy - upsert-only (safe, won't delete records)
        - --policy=upsert-only

        # TXT registry for ownership tracking
        - --registry=txt
        - --txt-owner-id=external-dns-cloudflare
        - --txt-prefix=external-dns-

        # Logging
        - --log-level=info
        - --log-format=text

        # Sync interval
        - --interval=1m

        # Cloudflare-specific settings
        # Note: cloudflare-proxied defaults to false (direct to MetalLB IPs, not proxied)

        env:
        - name: CF_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-api-token
              key: api-token

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
