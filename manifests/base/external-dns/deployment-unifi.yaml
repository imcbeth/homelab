---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-unifi
  namespace: external-dns
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/component: unifi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
      app.kubernetes.io/component: unifi
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
        app.kubernetes.io/component: unifi
    spec:
      serviceAccountName: external-dns-unifi
      securityContext:
        runAsNonRoot: true
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: external-dns
        image: registry.k8s.n37.ca/external-dns/external-dns:v0.21.0
        args:
        # Webhook provider configuration
        - --provider=webhook
        - --webhook-provider-url=http://external-dns-unifi-webhook:8888

        # Gateway-outage tolerance. external-dns classifies provider failures
        # two ways, and ONLY one of them is survivable:
        #   - webhook answers with a non-2xx  -> SoftError, counted, tolerated
        #   - webhook does not answer in time -> hard error -> log.Fatal -> exit
        # There is no flag to make a hard error non-fatal (checked --help on
        # v0.21.0), so the only lever is making sure the webhook's reply lands
        # inside the window.
        #
        # At the 5s default that window was too small. During the 2026-09-12 UDR
        # outage the webhook was still waiting on the gateway when external-dns
        # gave up, so the gateway's eventual HTTP 502 -- which WOULD have been
        # tolerated -- never arrived, and the pod exited instead: 54 restarts in
        # ~2h. The proof the soft path works is in the same logs, from the runs
        # where the 502 did come back fast enough:
        #   "soft error ... (consecutive soft errors: 3)"
        #   "Reconciliation succeeded after 3 consecutive soft errors"
        #
        # 60s is chosen to exceed how long the gateway took to return its own
        # error under load. This is a reconciler on a 1m interval, so blocking a
        # full minute on a sick gateway costs nothing.
        #
        # This does NOT make it immortal: a gateway that hangs past 60s still
        # exits, by design. It converts the common case (slow/erroring gateway)
        # from crashloop into tolerated soft errors. Full tolerance would need a
        # webhook build with UNIFI_RETRY_* bounds -- absent from v0.8.2.
        - --webhook-provider-read-timeout=60s
        - --webhook-provider-write-timeout=60s

        # Source configuration - watch both Ingress and LoadBalancer services
        - --source=ingress
        - --source=service
        # DNSEndpoint CRs — internal infrastructure records declared in git
        # (see internal-records.yaml). Deliberately NOT added to
        # deployment-cloudflare.yaml: that instance publishes to public DNS
        # and must never see RFC1918 targets.
        - --source=crd
        - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
        - --crd-source-kind=DNSEndpoint

        # Domain filtering - internal domains (split-horizon)
        - --domain-filter=k8s.n37.ca
        - --domain-filter=lifeonabike.ca

        # Policy - upsert-only (safe, won't delete records)
        - --policy=upsert-only

        # TXT registry for ownership tracking
        - --registry=txt
        - --txt-owner-id=external-dns-unifi
        - --txt-prefix=external-dns-

        # Logging
        - --log-level=info
        - --log-format=text

        # Sync interval
        - --interval=1m

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
