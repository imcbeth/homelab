---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-unifi
  namespace: external-dns
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/component: unifi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
      app.kubernetes.io/component: unifi
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
        app.kubernetes.io/component: unifi
    spec:
      serviceAccountName: external-dns-unifi
      containers:
      - name: external-dns
        image: registry.k8s.io/external-dns/external-dns:v0.15.0
        args:
        # Webhook provider configuration
        - --provider=webhook
        - --webhook-provider-url=http://external-dns-unifi-webhook:8080

        # Source configuration - watch both Ingress and LoadBalancer services
        - --source=ingress
        - --source=service

        # Domain filtering - internal k8s domain
        - --domain-filter=k8s.n37.ca

        # Policy - upsert-only (safe, won't delete records)
        - --policy=upsert-only

        # TXT registry for ownership tracking
        - --registry=txt
        - --txt-owner-id=external-dns-unifi
        - --txt-prefix=external-dns-

        # Logging
        - --log-level=info
        - --log-format=text

        # Sync interval
        - --interval=1m

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
