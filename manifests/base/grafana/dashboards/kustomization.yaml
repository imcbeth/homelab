  - node-resource-monitoring.yaml
  - pi-cluster-overview.yaml
  - temperature-monitoring.yaml

  # Loki Dashboards
  - logging-dashboard-via-loki.yaml
  - loki-dashboard.yaml
  - loki-stack-monitoring.yaml
  - loki2-global-metrics.yaml

