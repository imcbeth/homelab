            {
              "expr": "kubelet_volume_stats_used_bytes",
              "format": "table",
              "instant": true,
              "refId": "B"
            },
            {
              "expr": "kubelet_volume_stats_available_bytes",
              "format": "table",
              "instant": true,
              "refId": "C"
            }
          ],
          "title": "PVC Usage Table",
          "transformations": [
            {
              "id": "seriesToColumns",
              "options": {
                "byField": "persistentvolumeclaim"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "__name__": true,
                  "__name__ 1": true,
                  "__name__ 2": true,
                  "__name__ 3": true,
                  "endpoint": true,
                  "endpoint 1": true,
                  "endpoint 2": true,
                  "endpoint 3": true,
                  "instance": true,
                  "instance 1": true,
                  "instance 2": true,
                  "instance 3": true,
                  "job": true,
                  "job 1": true,
                  "job 2": true,
                  "job 3": true,
                  "metrics_path": true,
                  "metrics_path 1": true,
                  "metrics_path 2": true,
                  "metrics_path 3": true,
                  "node": true,
                  "node 1": true,
                  "node 2": true,
                  "node 3": true,
                  "service": true,
                  "service 1": true,
                  "service 2": true,
                  "service 3": true
                },
                "indexByName": {},
                "renameByName": {
                  "namespace": "Namespace",
                  "namespace 1": "Namespace",
                  "persistentvolumeclaim": "PVC",
                  "Value #A": "Capacity",
                  "Value #B": "Used",
                  "Value #C": "Available"
                }
              }
            },
            {
              "id": "calculateField",
              "options": {
                "alias": "Usage %",
                "binary": {
                  "left": "Used",
                  "operator": "/",
                  "right": "Capacity",
                  "reducer": "sum"
                },
                "mode": "binary",
                "reduce": { "reducer": "sum" }
              }
            },
            {
              "id": "calculateField",
              "options": {
                "alias": "Usage %",
                "binary": {
                  "left": "Usage %",
                  "operator": "*",
                  "right": "100"
                },
                "mode": "binary",
                "reduce": { "reducer": "sum" },
                "replaceFields": false
              }
            }
          ],
          "type": "table"
        },
