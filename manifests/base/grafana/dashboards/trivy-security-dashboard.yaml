apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-trivy-security
  namespace: default
  labels:
    grafana_dashboard: "1"
    app: grafana
    folder: security
data:
  trivy-security-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Trivy Operator vulnerability and security scanning dashboard for Kubernetes cluster",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "9.0.0",
          "targets": [
            {
              "expr": "sum(trivy_image_vulnerabilities{severity=\"Critical\"})",
              "refId": "A"
            }
          ],
          "title": "Total Critical Vulnerabilities",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 100
                  },
                  {
                    "color": "orange",
                    "value": 500
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "9.0.0",
          "targets": [
            {
              "expr": "sum(trivy_image_vulnerabilities{severity=\"High\"})",
              "refId": "A"
            }
          ],
          "title": "Total High Vulnerabilities",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "9.0.0",
          "targets": [
            {
              "expr": "sum(trivy_image_vulnerabilities{severity=\"Medium\"})",
              "refId": "A"
            }
          ],
          "title": "Total Medium Vulnerabilities",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "9.0.0",
          "targets": [
            {
              "expr": "count(count by (image_repository, image_tag) (trivy_image_vulnerabilities))",
              "refId": "A"
            }
          ],
          "title": "Images Scanned",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "displayMode": "auto",
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #Critical"
                },
                "properties": [
                  {
                    "id": "custom.displayMode",
                    "value": "color-background"
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "red",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "displayName",
                    "value": "Critical"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #High"
                },
                "properties": [
                  {
                    "id": "custom.displayMode",
                    "value": "color-background"
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 1
                        },
                        {
                          "color": "red",
                          "value": 10
                        }
                      ]
                    }
                  },
                  {
                    "id": "displayName",
                    "value": "High"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #Medium"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Medium"
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "id": 5,
          "options": {
            "footer": {
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Critical"
              }
            ]
          },
          "pluginVersion": "9.0.0",
          "targets": [
            {
              "expr": "trivy_image_vulnerabilities{severity=\"Critical\"}",
              "format": "table",
              "instant": true,
              "refId": "Critical"
            },
            {
              "expr": "trivy_image_vulnerabilities{severity=\"High\"}",
              "format": "table",
              "instant": true,
              "refId": "High"
            },
            {
              "expr": "trivy_image_vulnerabilities{severity=\"Medium\"}",
              "format": "table",
              "instant": true,
              "refId": "Medium"
            }
          ],
          "title": "Vulnerabilities by Image",
          "transformations": [
            {
              "id": "seriesToColumns",
              "options": {
                "byField": "image_repository"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "__name__": true,
                  "__name__ 1": true,
                  "__name__ 2": true,
                  "__name__ 3": true,
                  "container_name": false,
                  "container_name 1": true,
                  "container_name 2": true,
                  "container_name 3": true,
                  "image_digest": true,
                  "image_digest 1": true,
                  "image_digest 2": true,
                  "image_digest 3": true,
                  "image_registry": false,
                  "image_registry 1": true,
                  "image_registry 2": true,
                  "image_registry 3": true,
                  "image_tag": false,
                  "image_tag 1": true,
                  "image_tag 2": true,
                  "image_tag 3": true,
                  "job": true,
                  "job 1": true,
                  "job 2": true,
                  "job 3": true,
                  "name": true,
                  "name 1": true,
                  "name 2": true,
                  "name 3": true,
                  "namespace": false,
                  "namespace 1": true,
                  "namespace 2": true,
                  "namespace 3": true,
                  "resource_kind": true,
                  "resource_kind 1": true,
                  "resource_kind 2": true,
                  "resource_kind 3": true,
                  "resource_name": false,
                  "resource_name 1": true,
                  "resource_name 2": true,
                  "resource_name 3": true,
                  "severity": true,
                  "severity 1": true,
                  "severity 2": true,
                  "severity 3": true
                },
                "indexByName": {
                  "Value #Critical": 6,
                  "Value #High": 7,
                  "Value #Medium": 8,
                  "container_name": 4,
                  "image_registry": 0,
                  "image_repository": 1,
                  "image_tag": 2,
                  "namespace": 3,
                  "resource_name": 5
                },
                "renameByName": {
                  "container_name": "Container",
                  "image_registry": "Registry",
                  "image_repository": "Image",
                  "image_tag": "Tag",
                  "namespace": "Namespace",
                  "resource_name": "Resource"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                }
              },
              "mappings": []
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "id": 6,
          "options": {
            "displayLabels": [
              "name",
              "percent"
            ],
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "values": [
                "value"
              ]
            },
            "pieType": "pie",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "pluginVersion": "9.0.0",
          "targets": [
            {
              "expr": "sum by (severity) (trivy_image_vulnerabilities)",
              "refId": "A"
            }
          ],
          "title": "Vulnerabilities by Severity",
          "type": "piechart"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                }
              },
              "mappings": []
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "id": 7,
          "options": {
            "displayLabels": [
              "name",
              "percent"
            ],
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "values": [
                "value"
              ]
            },
            "pieType": "pie",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "pluginVersion": "9.0.0",
          "targets": [
            {
              "expr": "sum by (namespace) (trivy_image_vulnerabilities{severity=~\"Critical|High\"})",
              "refId": "A"
            }
          ],
          "title": "Critical + High Vulnerabilities by Namespace",
          "type": "piechart"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 36,
      "style": "dark",
      "tags": [
        "security",
        "trivy",
        "vulnerabilities"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "Trivy Security Scanning",
      "uid": "trivy-security-dashboard",
      "version": 1,
      "weekStart": ""
    }
