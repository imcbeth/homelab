---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trivy-operator-alerts
  namespace: trivy-system
  labels:
    app: trivy-operator
    prometheus: kube-prometheus
    role: alert-rules
    release: kube-prometheus-stack
spec:
  groups:
  - name: trivy_rbac_security
    interval: 60s
    rules:
    # Critical RBAC issues on ClusterRoles
    - alert: CriticalClusterRoleRBACIssues
      expr: sum(trivy_clusterrole_clusterrbacassessments{severity="Critical"}) > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Critical RBAC issues detected in ClusterRoles"
        description: |
          {{ $value }} ClusterRoles have CRITICAL RBAC security issues.
          Review ClusterRbacAssessmentReports for details.
          These may indicate overly permissive roles.

    - alert: HighClusterRoleRBACIssues
      expr: sum(trivy_clusterrole_clusterrbacassessments{severity="High"}) > 10
      for: 30m
      labels:
        severity: info
      annotations:
        summary: "High number of RBAC issues in ClusterRoles"
        description: |
          {{ $value }} ClusterRoles have HIGH severity RBAC issues.
          Review ClusterRbacAssessmentReports and apply principle of least privilege.

  - name: trivy_vulnerabilities
    interval: 60s
    rules:
    - alert: CriticalVulnerabilitiesDetected
      expr: sum by (image_repository, image_tag, namespace, resource_name) (trivy_image_vulnerabilities{severity="Critical"}) > 0
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "Critical vulnerabilities in {{ $labels.image_repository }}:{{ $labels.image_tag }}"
        description: |
          {{ $value }} critical vulnerabilities detected in {{ $labels.namespace }}/{{ $labels.resource_name }}.
          Image: {{ $labels.image_repository }}:{{ $labels.image_tag }}
          Review VulnerabilityReports and plan image updates.
    - alert: HighVulnerabilityCount
      expr: sum(trivy_image_vulnerabilities{severity=~"Critical|High"}) > 50
      for: 1h
      labels:
        severity: info
      annotations:
        summary: "High total vulnerability count across cluster"
        description: |
          {{ $value }} Critical+High vulnerabilities detected across all images.
          Review Trivy dashboard for affected images and prioritize remediation.

  - name: trivy_configuration_audit
    interval: 60s
    rules:
    # Configuration audit alerts
    - alert: CriticalConfigurationIssues
      expr: |
        trivy_role_configauditreports{severity="Critical"} > 0 or
        trivy_clusterrole_configauditreports{severity="Critical"} > 0
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "Critical Kubernetes configuration issues detected"
        description: |
          Critical configuration issues found in {{ $labels.resource_kind }}/{{ $labels.resource_name }}.
          Namespace: {{ $labels.namespace }}
          Review and remediate configuration audit findings.

  - name: trivy_rbac_assessment
    interval: 60s
    rules:
    # RBAC permission alerts
    - alert: HighRiskRBACPermissions
      expr: trivy_clusterrole_clusterrbacassessments{severity="Critical"} > 0
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "High-risk RBAC permissions detected in {{ $labels.resource_name }}"
        description: |
          ClusterRole {{ $labels.resource_name }} has {{ $value }} critical RBAC issues.
          Review the role's permissions and apply principle of least privilege.

  - name: trivy_exposed_secrets
    interval: 60s
    rules:
    # Exposed secrets alerts
    - alert: ExposedSecretsDetected
      expr: |
        max by (image_repository, image_tag, namespace, resource_name, resource_kind) (
          trivy_image_exposedsecrets{severity=~"Critical|High", namespace!="localstack"}
        ) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Exposed secrets detected in {{ $labels.namespace }}/{{ $labels.resource_name }}"
        description: |
          CRITICAL: Exposed secrets found in {{ $labels.image_repository }}:{{ $labels.image_tag }}!
          Namespace: {{ $labels.namespace }}
          Resource: {{ $labels.resource_kind }}/{{ $labels.resource_name }}
          Severity: {{ $labels.severity }}
          IMMEDIATE ACTION REQUIRED: Rotate credentials and rebuild image without secrets.

  - name: trivy_compliance
    interval: 300s  # Check every 5 minutes
    rules:
    # Compliance failures
    - alert: CISKubernetesBenchmarkFailures
      expr: trivy_cluster_compliance{title=~"CIS Kubernetes.*",status="Fail"} > 0
      for: 1h
      labels:
        severity: info
      annotations:
        summary: "CIS Kubernetes Benchmark compliance failures detected"
        description: |
          CIS Kubernetes Benchmark ({{ $labels.title }}) has failing checks.
          Review compliance report for details and remediation steps.

    - alert: NSAKubernetesHardeningFailures
      expr: trivy_cluster_compliance{title=~"National Security Agency.*",status="Fail"} > 0
      for: 1h
      labels:
        severity: info
      annotations:
        summary: "NSA Kubernetes Hardening Guidance compliance failures"
        description: |
          NSA Kubernetes Hardening Guidance has failing checks.
          Review compliance report for security hardening recommendations.

    - alert: PSSBaselineComplianceFailures
      expr: trivy_cluster_compliance{title=~".*PSS.*Baseline.*",status="Fail"} > 0
      for: 1h
      labels:
        severity: info
      annotations:
        summary: "Pod Security Standards Baseline compliance failures"
        description: |
          PSS Baseline has failing checks.
          Review compliance report for pod security baseline violations.

    - alert: PSSRestrictedComplianceFailures
      expr: trivy_cluster_compliance{title=~".*PSS.*Restricted.*",status="Fail"} > 0
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "Pod Security Standards Restricted compliance failures"
        description: |
          PSS Restricted has failing checks.
          Review compliance report for pod security restricted violations.
