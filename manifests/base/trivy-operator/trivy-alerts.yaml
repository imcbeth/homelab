---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trivy-operator-alerts
  namespace: trivy-system
  labels:
    app: trivy-operator
    prometheus: kube-prometheus
    role: alert-rules
    release: kube-prometheus-stack
spec:
  groups:
  - name: trivy_rbac_security
    interval: 60s
    rules:
    # Critical RBAC issues on ClusterRoles — AGGREGATE ONLY.
    #
    # A second rule (`HighRiskRBACPermissions`, group trivy_rbac_assessment)
    # used the same metric WITHOUT aggregation:
    #   trivy_clusterrole_clusterrbacassessments{severity="Critical"} > 0
    # That produced 51 per-ClusterRole alerts alongside this one aggregate —
    # the identical signal counted twice, at two cardinalities. Removed
    # 2026-09-07; this rule carries the same information in one alert.
    #
    # On the findings themselves: they are real Trivy KSV checks, but largely
    # inherent rather than fixable. The 67 failing CRITICAL checks are
    # dominated by KSV041 (can manage secrets, 38x) and KSV046 (can manage
    # all resources, 15x) against operator ClusterRoles — ArgoCD, Gatekeeper,
    # Velero and friends legitimately need those grants to function.
    # Treat this alert as a "did the count change" signal, not a work queue.
    - alert: CriticalClusterRoleRBACIssues
      expr: sum(trivy_clusterrole_clusterrbacassessments{severity="Critical"}) > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Critical RBAC issues detected in ClusterRoles"
        description: |
          {{ $value }} ClusterRoles have CRITICAL RBAC security issues.

          Mostly inherent to operators that need broad grants (KSV041 manage
          secrets, KSV046 manage all resources). Investigate when the COUNT
          CHANGES, not on every evaluation.

          List the failing checks:
            kubectl get clusterrbacassessmentreports -o json | jq -r '
              .items[] | .metadata.name as $n
              | .report.checks[]
              | select(.severity=="CRITICAL" and .success==false)
              | "\($n) \(.checkID) \(.title)"'

    - alert: HighClusterRoleRBACIssues
      expr: sum(trivy_clusterrole_clusterrbacassessments{severity="High"}) > 10
      for: 30m
      labels:
        severity: info
      annotations:
        summary: "High number of RBAC issues in ClusterRoles"
        description: |
          {{ $value }} ClusterRoles have HIGH severity RBAC issues.
          Review ClusterRbacAssessmentReports and apply principle of least privilege.

  - name: trivy_vulnerabilities
    interval: 60s
    rules:
    # DESIGN NOTE (rewritten 2026-09-07)
    #
    # The previous rule was:
    #   sum by (image_repository,image_tag,namespace,resource_name)(
    #     trivy_image_vulnerabilities{severity="Critical"}) > 0
    #
    # A `> 0` threshold at per-workload cardinality meant one permanently
    # firing alert for every workload carrying any critical CVE — 51 of them,
    # continuously, drowning genuinely actionable alerts in the same stream.
    #
    # "Some critical CVEs exist in upstream base images" is the steady state
    # of any cluster, not an incident. There is no fix to apply and the alert
    # never resolves, so it trains people to ignore the security channel —
    # the same cry-wolf failure as the Velero delayed alert (PR #889).
    #
    # Trivy exposes no `fixed_version` label, so we cannot filter to
    # *actionable* CVEs. Instead alert on the two things that ARE actionable:
    #   1. the number went UP (a bad image was introduced)
    #   2. a single image is an outlier
    #
    # Measured against live data on 2026-09-07:
    #   old rule (>0 per workload) ......... 51 alerts, permanent
    #   per-image > 10 ......................  5 alerts
    #   24h increase > 0 ....................  fires on regression only
    #     (would have fired today: 141 -> 154 after the Renovate image bumps)

    # 1. REGRESSION — the cluster got measurably worse in the last day.
    #    This is the high-signal one: it means an upgrade or new deployment
    #    introduced critical CVEs.
    - alert: CriticalVulnerabilitiesIncreased
      expr: |
        sum(trivy_image_vulnerabilities{severity="Critical"})
        - sum(trivy_image_vulnerabilities{severity="Critical"} offset 24h) > 0
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "Cluster critical CVE count rose by {{ $value }} in 24h"
        description: |
          Critical vulnerabilities across the cluster increased by {{ $value }}
          in the last 24 hours — a newly deployed or upgraded image introduced them.

          Find the change:
            sum by (image_repository,image_tag) (trivy_image_vulnerabilities{severity="Critical"})
          compared against the same query with `offset 24h`.

    # 2. OUTLIER IMAGE — one image carrying a lot of criticals is worth a
    #    deliberate decision (pin, replace, or accept). Threshold 10 chosen
    #    from the observed distribution: it selects the head (5 images) and
    #    excludes the long tail of 22 images carrying 1-3 criticals.
    - alert: ImageCriticalVulnerabilitiesHigh
      expr: |
        sum by (image_repository, image_tag) (trivy_image_vulnerabilities{severity="Critical"}) > 10
      for: 6h
      labels:
        severity: warning
      annotations:
        summary: "{{ $labels.image_repository }}:{{ $labels.image_tag }} has {{ $value }} critical CVEs"
        description: |
          Image {{ $labels.image_repository }}:{{ $labels.image_tag }} carries
          {{ $value }} critical vulnerabilities.

          Decide explicitly: upgrade the image, switch base, or accept and
          document. `for: 6h` avoids firing during image-rollout churn.

          NOTE: reports can outlive the workload. trivy-operator writes one
          VulnerabilityReport per ReplicaSet, and Kubernetes keeps old
          ReplicaSets (revisionHistoryLimit, default 10). After three argocd
          upgrades in one day there were reports for v3.4.5, v3.5.0 and
          v3.5.2 while only v3.5.2 was running. Confirm the image is live
          before chasing it:
            kubectl get pods -A -o jsonpath='{range .items[*]}{.spec.containers[*].image}{"\n"}{end}' | sort -u | grep <image>
    - alert: HighVulnerabilityCount
      expr: sum(trivy_image_vulnerabilities{severity=~"Critical|High"}) > 50
      for: 1h
      labels:
        severity: info
      annotations:
        summary: "High total vulnerability count across cluster"
        description: |
          {{ $value }} Critical+High vulnerabilities detected across all images.
          Review Trivy dashboard for affected images and prioritize remediation.

  - name: trivy_configuration_audit
    interval: 60s
    rules:
    # Configuration audit alerts
    - alert: CriticalConfigurationIssues
      expr: |
        trivy_role_configauditreports{severity="Critical"} > 0 or
        trivy_clusterrole_configauditreports{severity="Critical"} > 0
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "Critical Kubernetes configuration issues detected"
        description: |
          Critical configuration issues found in {{ $labels.resource_kind }}/{{ $labels.resource_name }}.
          Namespace: {{ $labels.namespace }}
          Review and remediate configuration audit findings.

  - name: trivy_exposed_secrets
    interval: 60s
    rules:
    # Exposed secrets alerts
    - alert: ExposedSecretsDetected
      expr: |
        max by (image_repository, image_tag, namespace, resource_name, resource_kind) (
          trivy_image_exposedsecrets{severity=~"Critical|High", namespace!="localstack"}
        ) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Exposed secrets detected in {{ $labels.namespace }}/{{ $labels.resource_name }}"
        description: |
          CRITICAL: Exposed secrets found in {{ $labels.image_repository }}:{{ $labels.image_tag }}!
          Namespace: {{ $labels.namespace }}
          Resource: {{ $labels.resource_kind }}/{{ $labels.resource_name }}
          Severity: {{ $labels.severity }}
          IMMEDIATE ACTION REQUIRED: Rotate credentials and rebuild image without secrets.

  - name: trivy_compliance
    interval: 300s  # Check every 5 minutes
    rules:
    # Compliance failures
    - alert: CISKubernetesBenchmarkFailures
      expr: trivy_cluster_compliance{title=~"CIS Kubernetes.*",status="Fail"} > 0
      for: 1h
      labels:
        severity: info
      annotations:
        summary: "CIS Kubernetes Benchmark compliance failures detected"
        description: |
          CIS Kubernetes Benchmark ({{ $labels.title }}) has failing checks.
          Review compliance report for details and remediation steps.

    - alert: NSAKubernetesHardeningFailures
      expr: trivy_cluster_compliance{title=~"National Security Agency.*",status="Fail"} > 0
      for: 1h
      labels:
        severity: info
      annotations:
        summary: "NSA Kubernetes Hardening Guidance compliance failures"
        description: |
          NSA Kubernetes Hardening Guidance has failing checks.
          Review compliance report for security hardening recommendations.

    - alert: PSSBaselineComplianceFailures
      expr: trivy_cluster_compliance{title=~".*PSS.*Baseline.*",status="Fail"} > 0
      for: 1h
      labels:
        severity: info
      annotations:
        summary: "Pod Security Standards Baseline compliance failures"
        description: |
          PSS Baseline has failing checks.
          Review compliance report for pod security baseline violations.

    - alert: PSSRestrictedComplianceFailures
      expr: trivy_cluster_compliance{title=~".*PSS.*Restricted.*",status="Fail"} > 0
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "Pod Security Standards Restricted compliance failures"
        description: |
          PSS Restricted has failing checks.
          Review compliance report for pod security restricted violations.
