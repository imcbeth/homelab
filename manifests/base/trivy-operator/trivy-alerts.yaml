---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trivy-operator-alerts
  namespace: trivy-system
  labels:
    app: trivy-operator
    prometheus: kube-prometheus
    role: alert-rules
    release: kube-prometheus-stack
spec:
  groups:
  - name: trivy_rbac_security
    interval: 60s
    rules:
    # REWRITTEN 2026-11-15 as a delta, replacing CriticalClusterRoleRBACIssues
    # (`sum(...{severity="Critical"}) > 0`) and HighClusterRoleRBACIssues
    # (`sum(...{severity="High"}) > 10`).
    #
    # Both were absolute thresholds on a steady-state count. The findings are
    # real Trivy KSV checks but largely inherent: KSV041 (can manage secrets)
    # and KSV046 (can manage all resources) against operator ClusterRoles --
    # ArgoCD, Gatekeeper, Velero and friends need those grants to function.
    # So both fired continuously and never cleared (48 Critical / 23 High on
    # 2026-11-15). They had been demoted to info (null receiver) on
    # 2026-09-14 to stop a 24-hourly email, which also meant RBAC drift was
    # never notified at all -- the old comment here said as much.
    #
    # A ClusterRole that newly earns a Critical or High finding IS worth a
    # look: it means a chart upgrade or a new app widened its grants. This
    # fires on exactly that, the same 24h-offset pattern as
    # CriticalVulnerabilitiesIncreased, and resolves on its own once the
    # higher count is 24h old. Max delta over the 14 days before this
    # change: 0 for both severities.
    #
    # The earlier per-ClusterRole duplicate (HighRiskRBACPermissions, 51
    # alerts for the same signal) was removed 2026-09-07; this stays
    # aggregate, one alert per severity.
    - alert: ClusterRoleRBACIssuesIncreased
      expr: |
        sum by (severity) (trivy_clusterrole_clusterrbacassessments{severity=~"Critical|High"})
        - sum by (severity) (trivy_clusterrole_clusterrbacassessments{severity=~"Critical|High"} offset 24h) > 0
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "ClusterRole {{ $labels.severity }} RBAC findings rose by {{ $value }} in 24h"
        description: |
          {{ $value }} more {{ $labels.severity }} RBAC findings on ClusterRoles
          than 24 hours ago -- a chart upgrade or new app widened its grants.

          List the failing checks (compare with the previous day's set):
            kubectl get clusterrbacassessmentreports -o json | jq -r '
              .items[] | .metadata.name as $n
              | .report.checks[]
              | select((.severity=="CRITICAL" or .severity=="HIGH") and .success==false)
              | "\($n) \(.severity) \(.checkID) \(.title)"'

          Inherent operator grants (KSV041, KSV046) are expected; decide
          whether the new one is.

  - name: trivy_vulnerabilities
    interval: 60s
    rules:
    # DESIGN NOTE (rewritten 2026-09-07)
    #
    # The previous rule was:
    #   sum by (image_repository,image_tag,namespace,resource_name)(
    #     trivy_image_vulnerabilities{severity="Critical"}) > 0
    #
    # A `> 0` threshold at per-workload cardinality meant one permanently
    # firing alert for every workload carrying any critical CVE — 51 of them,
    # continuously, drowning genuinely actionable alerts in the same stream.
    #
    # "Some critical CVEs exist in upstream base images" is the steady state
    # of any cluster, not an incident. There is no fix to apply and the alert
    # never resolves, so it trains people to ignore the security channel —
    # the same cry-wolf failure as the Velero delayed alert (PR #889).
    #
    # Trivy exposes no `fixed_version` label, so we cannot filter to
    # *actionable* CVEs. Instead alert on the two things that ARE actionable:
    #   1. the number went UP (a bad image was introduced)
    #   2. a single image is an outlier
    #
    # Measured against live data on 2026-09-07:
    #   old rule (>0 per workload) ......... 51 alerts, permanent
    #   per-image > 10 ......................  5 alerts
    #   24h increase > 0 ....................  fires on regression only
    #     (would have fired today: 141 -> 154 after the Renovate image bumps)

    # 1. REGRESSION — the cluster got measurably worse in the last day.
    #    This is the high-signal one: it means an upgrade or new deployment
    #    introduced critical CVEs.
    - alert: CriticalVulnerabilitiesIncreased
      expr: |
        sum(trivy_image_vulnerabilities{severity="Critical"})
        - sum(trivy_image_vulnerabilities{severity="Critical"} offset 24h) > 0
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "Cluster critical CVE count rose by {{ $value }} in 24h"
        description: |
          Critical vulnerabilities across the cluster increased by {{ $value }}
          in the last 24 hours — a newly deployed or upgraded image introduced them.

          Find the change:
            sum by (image_repository,image_tag) (trivy_image_vulnerabilities{severity="Critical"})
          compared against the same query with `offset 24h`.

    # 2. OUTLIER IMAGE — one image carrying a lot of criticals is worth a
    #    deliberate decision (pin, replace, or accept). Threshold 10 chosen
    #    from the observed distribution: it selects the head (5 images) and
    #    excludes the long tail of 22 images carrying 1-3 criticals.
    # Accepted risk, pinned to exact tags so that the next tag is checked
    # again from scratch. Remove an entry when that image is upgraded.
    #
    # 2026-11-06, both triaged with ignoreUnfixed already on:
    # - argoproj/argo-events:v1.9.11 is the newest release (2026-07-13).
    #   7 unique CRITICALs, all in Go deps (amqp091-go, pgx, grpc, stdlib
    #   1.25.6); the alert's sum of 35 counts them once per report.
    #   Nothing newer to move to; Renovate brings the next release.
    # - argoproj/argocd:v3.5.6 has one CRITICAL, CVE-2025-68121 in a Go
    #   1.24.0 stdlib built into the image, repeated across 7 reports to make
    #   the sum of 14. v3.5.7 does not bump Go. Renovate brings the next
    #   release.
    # - localstack/localstack:4.14.0 was pinned on purpose in #1091, because
    #   newer images require a licence. It is a LAN-only test S3 emulator
    #   holding disposable data. The real fix is to retire it, not upgrade
    #   it.
    - alert: ImageCriticalVulnerabilitiesHigh
      expr: |
        sum by (image_repository, image_tag) (
          trivy_image_vulnerabilities{severity="Critical"}
            unless trivy_image_vulnerabilities{image_repository="argoproj/argo-events", image_tag="v1.9.11"}
            unless trivy_image_vulnerabilities{image_repository="argoproj/argocd", image_tag="v3.5.6"}
            unless trivy_image_vulnerabilities{image_repository="localstack/localstack", image_tag="4.14.0"}
        ) > 10
      for: 6h
      labels:
        severity: warning
      annotations:
        summary: "{{ $labels.image_repository }}:{{ $labels.image_tag }} has {{ $value }} critical CVEs"
        description: |
          Image {{ $labels.image_repository }}:{{ $labels.image_tag }} carries
          {{ $value }} critical vulnerabilities.

          Decide explicitly: upgrade the image, switch base, or accept and
          document. `for: 6h` avoids firing during image-rollout churn.

          NOTE: reports can outlive the workload. trivy-operator writes one
          VulnerabilityReport per ReplicaSet, and Kubernetes keeps old
          ReplicaSets (revisionHistoryLimit, default 10). After three argocd
          upgrades in one day there were reports for v3.4.5, v3.5.0 and
          v3.5.2 while only v3.5.2 was running. Confirm the image is live
          before chasing it:
            kubectl get pods -A -o jsonpath='{range .items[*]}{.spec.containers[*].image}{"\n"}{end}' | sort -u | grep <image>
    # 3. HIGH-severity drift. Replaced `sum(Critical|High) > 50` on
    #    2026-11-15: that compared ~1,600 findings against 50, so it fired
    #    permanently and never cleared. Criticals are covered by rule 1;
    #    this tracks High alone. It stays info (null receiver): High counts
    #    move with nearly every image bump (-103 on 2026-11-15 alone), so as
    #    a warning it would email after most Renovate weekends. Visible in
    #    the Alertmanager UI as a regression marker, nothing more.
    - alert: HighVulnerabilitiesIncreased
      expr: |
        sum(trivy_image_vulnerabilities{severity="High"})
        - sum(trivy_image_vulnerabilities{severity="High"} offset 24h) > 0
      for: 1h
      labels:
        severity: info
      annotations:
        summary: "Cluster High CVE count rose by {{ $value }} in 24h"
        description: |
          High vulnerabilities across the cluster increased by {{ $value }}
          in the last 24 hours.

          Find the change:
            sum by (image_repository,image_tag) (trivy_image_vulnerabilities{severity="High"})
          compared against the same query with `offset 24h`.

  - name: trivy_configuration_audit
    interval: 60s
    rules:
    # Configuration audit alerts
    - alert: CriticalConfigurationIssues
      expr: |
        trivy_role_configauditreports{severity="Critical"} > 0 or
        trivy_clusterrole_configauditreports{severity="Critical"} > 0
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "Critical Kubernetes configuration issues detected"
        description: |
          Critical configuration issues found in {{ $labels.resource_kind }}/{{ $labels.resource_name }}.
          Namespace: {{ $labels.namespace }}
          Review and remediate configuration audit findings.

  - name: trivy_exposed_secrets
    interval: 60s
    rules:
    # Exposed secrets alerts
    - alert: ExposedSecretsDetected
      expr: |
        max by (image_repository, image_tag, namespace, resource_name, resource_kind) (
          trivy_image_exposedsecrets{severity=~"Critical|High", namespace!="localstack"}
        ) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Exposed secrets detected in {{ $labels.namespace }}/{{ $labels.resource_name }}"
        description: |
          CRITICAL: Exposed secrets found in {{ $labels.image_repository }}:{{ $labels.image_tag }}!
          Namespace: {{ $labels.namespace }}
          Resource: {{ $labels.resource_kind }}/{{ $labels.resource_name }}
          Severity: {{ $labels.severity }}
          IMMEDIATE ACTION REQUIRED: Rotate credentials and rebuild image without secrets.

  - name: trivy_compliance
    interval: 300s  # Check every 5 minutes
    rules:
    # REWRITTEN 2026-11-15. Replaces four per-framework rules
    # (CIS/NSA/PSS Baseline/PSS Restricted), each `{status="Fail"} > 0`.
    #
    # Two problems with those:
    #  - Absolute thresholds on standing posture (CIS 16, NSA 7, PSS 3+3
    #    failing controls), so they fired permanently and never cleared.
    #  - The two PSS rules matched `title=~".*PSS.*"`, but the real titles
    #    are "Kubernetes Pod Security Standards - Baseline" / "- Restricted".
    #    Neither could EVER fire, including the Restricted one at warning.
    #
    # One rule per report `title` avoids the regex entirely, so a renamed or
    # newly enabled framework is covered without editing this file. It fires
    # when a framework's failing-control count rises over 24h. Aggregated by
    # title because the raw series carry `pod`, which changes whenever
    # trivy-operator restarts and would otherwise break the offset match.
    # Max delta over the 14 days before this change: 0 for all four.
    - alert: ClusterComplianceFailuresIncreased
      expr: |
        max by (title) (trivy_cluster_compliance{status="Fail"})
        - max by (title) (trivy_cluster_compliance{status="Fail"} offset 24h) > 0
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "{{ $labels.title }}: {{ $value }} more failing controls than 24h ago"
        description: |
          {{ $labels.title }} has {{ $value }} more failing controls than it
          did 24 hours ago.

          See which controls fail now:
            kubectl get clustercompliancereports -o json | jq -r '
              .items[] | select(.spec.compliance.title=="{{ $labels.title }}")
              | .status.summaryReport.controlCheck[]
              | select(.totalFail > 0) | "\(.id) \(.severity) \(.name)"'
