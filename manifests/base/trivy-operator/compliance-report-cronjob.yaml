---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: compliance-reporter
  namespace: trivy-system
  labels:
    app.kubernetes.io/name: compliance-reporter
    app.kubernetes.io/part-of: trivy-operator
spec:
  schedule: "0 8 * * 1"  # Monday 8 AM
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: compliance-reporter
        app.kubernetes.io/part-of: trivy-operator
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: compliance-reporter
            app.kubernetes.io/part-of: trivy-operator
        spec:
          serviceAccountName: compliance-reporter
          restartPolicy: OnFailure
          containers:
          - name: reporter
            image: registry.k8s.n37.ca/bitnami/kubectl:latest
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi
            command:
            - /bin/bash
            - -c
            - |
              set -uo pipefail

              ALERTMANAGER_URL="http://kube-prometheus-stack-alertmanager.default.svc.cluster.local:9093"

              # Collect compliance report summaries using jsonpath
              COMPLIANCE_SUMMARY=""
              REPORTS=$(kubectl get clustercompliancereport -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.summary.passCount}{" "}{.status.summary.failCount}{"\n"}{end}' 2>/dev/null || true)
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                NAME=$(echo "$line" | awk '{print $1}')
                PASS=$(echo "$line" | awk '{print $2}')
                FAIL=$(echo "$line" | awk '{print $3}')
                COMPLIANCE_SUMMARY="${COMPLIANCE_SUMMARY}${NAME}: ${PASS} pass / ${FAIL} fail\n"
              done <<< "$REPORTS"

              if [ -z "$COMPLIANCE_SUMMARY" ]; then
                COMPLIANCE_SUMMARY="No compliance reports found"
              fi

              # Count vulnerabilities by severity
              VULN_CRITICAL=$(kubectl get vulnerabilityreport -A -o jsonpath='{range .items[*]}{.report.summary.criticalCount}{"\n"}{end}' 2>/dev/null | awk '{s+=$1} END {print s+0}')
              VULN_HIGH=$(kubectl get vulnerabilityreport -A -o jsonpath='{range .items[*]}{.report.summary.highCount}{"\n"}{end}' 2>/dev/null | awk '{s+=$1} END {print s+0}')
              VULN_MEDIUM=$(kubectl get vulnerabilityreport -A -o jsonpath='{range .items[*]}{.report.summary.mediumCount}{"\n"}{end}' 2>/dev/null | awk '{s+=$1} END {print s+0}')
              VULN_TOTAL=$(kubectl get vulnerabilityreport -A --no-headers 2>/dev/null | wc -l | tr -d ' ')

              # Top 5 images by critical vulnerabilities
              TOP_IMAGES=$(kubectl get vulnerabilityreport -A -o jsonpath='{range .items[*]}{.report.summary.criticalCount}{" "}{.report.artifact.repository}:{.report.artifact.tag}{"\n"}{end}' 2>/dev/null \
                | sort -rn | head -5 | awk '{if ($1 > 0) printf "%s (%s critical)\\n", $2, $1}')

              if [ -z "$TOP_IMAGES" ]; then
                TOP_IMAGES="No critical vulnerabilities found"
              fi

              # Build description
              DESCRIPTION="Weekly Compliance Summary\n\n"
              DESCRIPTION+="== Compliance Benchmarks ==\n${COMPLIANCE_SUMMARY}\n"
              DESCRIPTION+="== Vulnerability Counts ==\n"
              DESCRIPTION+="Reports scanned: ${VULN_TOTAL}\n"
              DESCRIPTION+="Critical: ${VULN_CRITICAL} | High: ${VULN_HIGH} | Medium: ${VULN_MEDIUM}\n\n"
              DESCRIPTION+="== Top Images by Critical Vulns ==\n${TOP_IMAGES}"

              echo -e "$DESCRIPTION"

              # Build JSON payload using jq for proper escaping
              TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              DESC_TEXT=$(echo -e "$DESCRIPTION")

              PAYLOAD=$(jq -n \
                --arg summary "Weekly Security Compliance Report - Critical: ${VULN_CRITICAL}, High: ${VULN_HIGH}" \
                --arg description "$DESC_TEXT" \
                --arg startsAt "$TIMESTAMP" \
                '[{
                  "labels": {
                    "alertname": "WeeklyComplianceSummary",
                    "severity": "none",
                    "component": "trivy-operator",
                    "alert_type": "compliance_report"
                  },
                  "annotations": {
                    "summary": $summary,
                    "description": $description
                  },
                  "startsAt": $startsAt,
                  "generatorURL": "https://trivy.homelab.local/compliance"
                }]')

              echo "Payload built, posting to AlertManager..."

              # Wait for ztunnel to be ready (ambient mesh networking)
              sleep 3

              # Send to AlertManager API with retry
              HTTP_CODE="000"
              for i in 1 2 3; do
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 \
                  -X POST "${ALERTMANAGER_URL}/api/v2/alerts" \
                  -H "Content-Type: application/json" \
                  -d "$PAYLOAD" 2>/dev/null || echo "000")
                if [ "$HTTP_CODE" -ge 200 ] 2>/dev/null && [ "$HTTP_CODE" -lt 300 ] 2>/dev/null; then
                  break
                fi
                echo "Attempt $i: AlertManager returned HTTP ${HTTP_CODE}, retrying in 5s..."
                sleep 5
              done

              if [ "$HTTP_CODE" -ge 200 ] 2>/dev/null && [ "$HTTP_CODE" -lt 300 ] 2>/dev/null; then
                echo "Compliance report posted to AlertManager (HTTP ${HTTP_CODE})"
              else
                echo "Failed to post to AlertManager after 3 attempts (HTTP ${HTTP_CODE})"
                echo "Report printed above for manual review"
                exit 1
              fi
