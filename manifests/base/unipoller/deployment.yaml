apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-poller
  namespace: unipoller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unifi-poller
      type: poller
  template:
    metadata:
      labels:
        app: unifi-poller
        app.kubernetes.io/name: unifi-poller
        type: poller
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "9130"
        prometheus.io/scrape: "true"
    spec:
      containers:
      - name: unifi-poller
        image: golift/unifi-poller:v2.38.0
        ports:
        - containerPort: 9130
          name: tcp
          protocol: TCP
        imagePullPolicy: IfNotPresent
        # Right-sized resources (actual usage ~8Mi)
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        env:
        - name: UP_UNIFI_CONTROLLER_0_API_KEY
          valueFrom:
            secretKeyRef:
              name: unipoller-secret
              key: api-key
        envFrom:
        - configMapRef:
            name: uni-poller-config
      restartPolicy: Always
