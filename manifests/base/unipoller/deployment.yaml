apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-poller
  namespace: unipoller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unifi-poller
      type: poller
  template:
    metadata:
      labels:
        app: unifi-poller
        type: poller
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "9130"
        prometheus.io/scrape: "true"
    spec:
      containers:
      - name: unifi-poller
        image: ghcr.io/unpoller/unpoller:v2.11.2
        ports:
        - containerPort: 9130
          name: tcp
          protocol: TCP
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 512Mi
        env:

        - name: UP_UNIFI_CONTROLLER_0_API_KEY
          valueFrom:
            secretKeyRef:
              name: unipoller-secret
              key: api-key
        envFrom:
        - configMapRef:
            name: uni-poller-config
      restartPolicy: Always
