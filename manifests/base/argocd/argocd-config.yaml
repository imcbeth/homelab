# Pre-flight for argocd chart v10.0.0 (PR #815):
# Chart v10.0.0 flipped `global.networkPolicy.create` from false → true.
# We manage our own argocd NetworkPolicy in manifests/base/network-policies/argocd/
# — adding chart-managed NetPols on top would create overlapping/conflicting
# rules. Explicit opt-out.
global:
  networkPolicy:
    create: false

server:
  service:
    type: ClusterIP # Expose Argo CD server via a ClusterIP
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-internal: "true" # Example for AWS internal load balancer
  # Resource limits for ArgoCD server (actual usage ~100Mi)
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack

controller:
  replicas: 2 # Increase the number of application controller replicas
  # Resource limits for application controller
  # OOMKilled at 1Gi (25 apps) → bumped to 1536Mi; OOMKilled again at 1536Mi (31 apps, v3.3.8)
  # Gatekeeper max is 2Gi — bumped to 2Gi 2026-04-25
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 2Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack

# Repository server
repoServer:
  # Resource limits for repo-server
  # Spikes to 400Mi+ when generating large manifests (tigera-operator, kube-prometheus-stack)
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack

# Redis (used for caching)
redis:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Application set controller
applicationSet:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Notifications controller
notifications:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

# Redis secret initialization job
redisSecretInit:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

# Dex OIDC server
dex:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 50m
      memory: 128Mi

configs:
  cm:
    url: https://argocd.k8s.n37.ca
    accounts.mcp: apiKey
    # GitHub OIDC via Dex — replaces local user/password login.
    # Note: org/team restrictions require a GitHub org. For personal accounts,
    # RBAC policy.default='' ensures any unanticipated GitHub login gets no
    # permissions — only explicitly granted users (imcbeth) can act.
    dex.config: |
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: $argocd-github-secret:client-id
            clientSecret: $argocd-github-secret:client-secret
            redirectURI: https://argocd.k8s.n37.ca/api/dex/callback
            loadAllGroups: false
  rbac:
    # imcbeth (GitHub login via Dex) → admin; mcp API key → readonly
    # policy.default='' means any other GitHub user who authenticates gets no permissions
    # scopes uses preferred_username (not groups) because this is a personal GitHub account
    # with no org/team memberships — g rules match against preferred_username claim value
    policy.csv: |
      g, imcbeth, role:admin
      g, mcp, role:readonly
      p, role:readonly, applications, get, *, allow
      p, role:readonly, applications, list, *, allow
      p, role:readonly, clusters, get, *, allow
      p, role:readonly, projects, get, *, allow
      p, role:readonly, repositories, get, *, allow
      p, role:readonly, logs, get, *, allow
    policy.default: role:''
    scopes: '[preferred_username]'
