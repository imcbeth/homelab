server:
  service:
    type: ClusterIP # Expose Argo CD server via a ClusterIP
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-internal: "true" # Example for AWS internal load balancer
  # Resource limits for ArgoCD server (actual usage ~100Mi)
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

controller:
  replicas: 2 # Increase the number of application controller replicas
  # Resource limits for application controller (actual usage ~571Mi)
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Repository server
repoServer:
  # Resource limits for repo-server
  # Spikes to 400Mi+ when generating large manifests (tigera-operator, kube-prometheus-stack)
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Redis (used for caching)
redis:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Application set controller
applicationSet:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Notifications controller
notifications:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

configs:
  cm:
    url: https://argocd.k8s.n37.ca # Set the external URL for Argo CD
    accounts.mcp: apiKey
  rbac:
    policy.csv: |
      p, role:readonly, applications, get, *, allow
      p, role:readonly, applications, list, *, allow
      p, role:readonly, clusters, get, *, allow
      p, role:readonly, projects, get, *, allow
      p, role:readonly, repositories, get, *, allow
      p, role:readonly, logs, get, *, allow
      g, mcp, role:readonly
