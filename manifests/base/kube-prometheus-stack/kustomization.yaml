apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Include Grafana dashboards from separate kustomization
bases:
  - ../grafana/dashboards

# Explicitly list resources to deploy
# Note: Secrets now managed via SealedSecrets (no manual apply needed)
resources:
  - alertmanager-smtp-sealed.yaml
  - snmp-exporter-sealed.yaml
  - argo-workflows-alerts.yaml
  - blackbox-exporter-alerts.yaml
  - blackbox-exporter-configmap.yaml
  - blackbox-exporter-deployment.yaml
  - blackbox-exporter-service.yaml
  - snmp-exporter-configmap.yaml
  - snmp-exporter-deployment.yaml
  - snmp-exporter-service.yaml
  - storage-alerts.yaml
  - velero-alerts.yaml
  - istio-alerts.yaml
  - apm-alerts.yaml
