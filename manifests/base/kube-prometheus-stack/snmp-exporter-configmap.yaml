---
apiVersion: v1
kind: ConfigMap
metadata:
  name: snmp-exporter-config
  namespace: default
data:
  snmp.yml: |
    # Synology NAS monitoring with SNMPv3 authentication
    # Updated to new auth-split format (v0.23.0+)
    # Update the credentials in snmp-exporter-secret.yaml before deploying
    auths:
      synology_v3:
        version: 3
        # IMPORTANT: Update snmp-exporter-secret.yaml with your actual credentials
        # These values must match what you configure in Synology DSM:
        # Control Panel -> Terminal & SNMP -> SNMP -> SNMPv3 Settings
        username: snmp_monitor
        security_level: authPriv          # Requires both authentication and encryption
        password: YOUR_AUTH_PASSWORD      # Set this in snmp-exporter-secret.yaml
        auth_protocol: SHA                # SHA (recommended) or MD5
        priv_protocol: AES                # AES (recommended) or DES
        priv_password: YOUR_PRIV_PASSWORD # Set this in snmp-exporter-secret.yaml
        context_name: ""
    
    modules:
      synology:
      walk:
        - 1.3.6.1.2.1.1      # System information
        - 1.3.6.1.2.1.2      # Interfaces
        - 1.3.6.1.2.1.25     # Host resources (CPU, Memory, Storage)
        - 1.3.6.1.4.1.6574   # Synology-specific OIDs
      metrics:
        # System uptime
        - name: sysUpTime
          oid: 1.3.6.1.2.1.1.3
          type: gauge
          help: System uptime in hundredths of a second

        # System name and description
        - name: sysName
          oid: 1.3.6.1.2.1.1.5
          type: DisplayString
          help: System name

        # Disk status (Synology-specific)
        - name: diskStatus
          oid: 1.3.6.1.4.1.6574.2.1.1.5
          type: gauge
          help: Disk status (1=Normal, 2=Initialized, 3=NotInitialized, 4=SystemPartitionFailed, 5=Crashed)
          indexes:
          - labelname: diskIndex
            type: gauge

        # Disk temperature (Synology-specific)
        - name: diskTemperature
          oid: 1.3.6.1.4.1.6574.2.1.1.6
          type: gauge
          help: Disk temperature in Celsius
          indexes:
          - labelname: diskIndex
            type: gauge

        # RAID status (Synology-specific)
        - name: raidStatus
          oid: 1.3.6.1.4.1.6574.3.1.1.3
          type: gauge
          help: RAID status (1=Normal, 2=Repairing, 3=Migrating, 4=Expanding, 5=Deleting, 6=Creating, 7=RaidSyncing, 8=RaidParityChecking, 9=RaidAssembling, 10=Canceling, 11=Degraded, 12=Crashed)
          indexes:
          - labelname: raidIndex
            type: gauge

        # System status (Synology-specific)
        - name: systemStatus
          oid: 1.3.6.1.4.1.6574.1.1
          type: gauge
          help: System status (1=Normal, 2=Failed)

        # CPU temperature
        - name: temperature
          oid: 1.3.6.1.4.1.6574.1.2
          type: gauge
          help: CPU temperature in Celsius

        # System fan status
        - name: systemFanStatus
          oid: 1.3.6.1.4.1.6574.1.4.1
          type: gauge
          help: System fan status (1=Normal, 2=Failed)

        # CPU fan status
        - name: cpuFanStatus
          oid: 1.3.6.1.4.1.6574.1.4.2
          type: gauge
          help: CPU fan status (1=Normal, 2=Failed)

        # Interface statistics
        - name: ifInOctets
          oid: 1.3.6.1.2.1.2.2.1.10
          type: counter
          help: Number of octets received on interface
          indexes:
          - labelname: ifIndex
            type: gauge

        - name: ifOutOctets
          oid: 1.3.6.1.2.1.2.2.1.16
          type: counter
          help: Number of octets transmitted on interface
          indexes:
          - labelname: ifIndex
            type: gauge

        # Memory usage
        - name: hrMemorySize
          oid: 1.3.6.1.2.1.25.2.2
          type: gauge
          help: Total memory size in KB

        # Storage usage
        - name: hrStorageUsed
          oid: 1.3.6.1.2.1.25.2.3.1.6
          type: gauge
          help: Storage used
          indexes:
          - labelname: hrStorageIndex
            type: gauge

        - name: hrStorageSize
          oid: 1.3.6.1.2.1.25.2.3.1.5
          type: gauge
          help: Storage size
          indexes:
          - labelname: hrStorageIndex
            type: gauge

      lookups:
        - source_indexes: [diskIndex]
          lookup: 1.3.6.1.4.1.6574.2.1.1.2
        - source_indexes: [raidIndex]
          lookup: 1.3.6.1.4.1.6574.3.1.1.2
        - source_indexes: [hrStorageIndex]
          lookup: 1.3.6.1.2.1.25.2.3.1.3
        - source_indexes: [ifIndex]
          lookup: 1.3.6.1.2.1.2.2.1.2
