---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snmp-exporter
  namespace: default
  labels:
    app: snmp-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snmp-exporter
  template:
    metadata:
      labels:
        app: snmp-exporter
        app.kubernetes.io/name: snmp-exporter
    spec:
      initContainers:
      - name: config-processor
        image: busybox:1.37
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
        env:
        - name: SNMP_USERNAME
          valueFrom:
            secretKeyRef:
              name: snmp-exporter-credentials
              key: snmp-username
        - name: SNMP_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: snmp-exporter-credentials
              key: snmp-auth-password
        - name: SNMP_PRIV_PASSWORD
          valueFrom:
            secretKeyRef:
              name: snmp-exporter-credentials
              key: snmp-priv-password
        - name: SNMP_AUTH_PROTOCOL
          valueFrom:
            secretKeyRef:
              name: snmp-exporter-credentials
              key: snmp-auth-protocol
        - name: SNMP_PRIV_PROTOCOL
          valueFrom:
            secretKeyRef:
              name: snmp-exporter-credentials
              key: snmp-priv-protocol
        command:
        - /bin/sh
        - -c
        - |
          # Process the config template and substitute environment variables
          sed "s/\${SNMP_USERNAME}/$SNMP_USERNAME/g; \
               s/\${SNMP_AUTH_PASSWORD}/$SNMP_AUTH_PASSWORD/g; \
               s/\${SNMP_PRIV_PASSWORD}/$SNMP_PRIV_PASSWORD/g; \
               s/\${SNMP_AUTH_PROTOCOL}/$SNMP_AUTH_PROTOCOL/g; \
               s/\${SNMP_PRIV_PROTOCOL}/$SNMP_PRIV_PROTOCOL/g" \
               /config-template/snmp.yml > /config/snmp.yml
          echo "Configuration processed successfully"
          cat /config/snmp.yml | head -20
        volumeMounts:
        - name: snmp-config-template
          mountPath: /config-template
        - name: snmp-config-processed
          mountPath: /config
      containers:
      - name: snmp-exporter
        image: prom/snmp-exporter:v0.30.1
        args:
        - "--config.file=/config/snmp.yml"
        ports:
        - name: http
          containerPort: 9116
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: snmp-config-processed
          mountPath: /config
          readOnly: true
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: snmp-config-template
        configMap:
          name: snmp-exporter-config
      - name: snmp-config-processed
        emptyDir: {}
