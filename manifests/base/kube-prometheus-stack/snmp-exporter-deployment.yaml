---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snmp-exporter
  namespace: default
  labels:
    app: snmp-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snmp-exporter
  template:
    metadata:
      labels:
        app: snmp-exporter
    spec:
      containers:
      - name: snmp-exporter
        image: prom/snmp-exporter:v0.26.0
        args:
          - "--config.file=/config/snmp.yml"
          - "--config.expand-environment-variables"
        env:
        - name: SNMP_USERNAME
          valueFrom:
            secretKeyRef:
              name: snmp-exporter-credentials
              key: snmp-username
        - name: SNMP_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: snmp-exporter-credentials
              key: snmp-auth-password
        - name: SNMP_PRIV_PASSWORD
          valueFrom:
            secretKeyRef:
              name: snmp-exporter-credentials
              key: snmp-priv-password
        - name: SNMP_AUTH_PROTOCOL
          valueFrom:
            secretKeyRef:
              name: snmp-exporter-credentials
              key: snmp-auth-protocol
        - name: SNMP_PRIV_PROTOCOL
          valueFrom:
            secretKeyRef:
              name: snmp-exporter-credentials
              key: snmp-priv-protocol
        ports:
        - name: http
          containerPort: 9116
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: snmp-config
          mountPath: /config
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: snmp-config
        configMap:
          name: snmp-exporter-config
