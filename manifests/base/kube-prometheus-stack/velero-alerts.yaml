---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: velero-alerts
  # Must live where Prometheus's ruleSelector can find it AND carry the
  # `release: kube-prometheus-stack` label. Was in the `velero` namespace
  # WITHOUT that label — Prometheus's ruleSelector requires
  # `release: kube-prometheus-stack`, so this rule sat dormant for 198
  # days and never loaded. That silence let ~16 days of failed B2 backups
  # go unnoticed (see PR #847). All sibling rules live in `default`.
  namespace: default
  labels:
    app: velero
    prometheus: kube-prometheus
    role: alert-rules
    release: kube-prometheus-stack
spec:
  groups:
  - name: velero_backup
    interval: 60s
    rules:
    - alert: VeleroBackupFailed
      expr: increase(velero_backup_failure_total[1h]) > 0
      for: 5m
      labels:
        severity: critical
        component: backup
      annotations:
        summary: "Velero backup failed for schedule {{ $labels.schedule }}"
        description: |
          Velero backup has failed for schedule {{ $labels.schedule }}.
          Failed backups in last hour: {{ $value }}

          Troubleshooting:
          1. kubectl get backups -n velero
          2. kubectl logs -n velero -l app.kubernetes.io/name=velero
          3. kubectl get backupstoragelocation -n velero

    - alert: VeleroBackupMetricAbsent
      expr: absent(velero_backup_last_successful_timestamp)
      for: 1h
      labels:
        severity: warning
        component: backup
      annotations:
        summary: "Velero backup metric is absent"
        description: |
          The velero_backup_last_successful_timestamp metric is not present.
          This may indicate:
          - Velero is not running or not configured
          - No backups have been configured yet
          - Velero pod was recently restarted and no backup has completed

          This is informational if no backup schedules are configured yet.
          If backup schedules exist, this requires investigation.

          Troubleshooting:
          1. kubectl get pods -n velero
          2. kubectl get schedule -n velero
          3. kubectl logs -n velero -l app.kubernetes.io/name=velero

    # Thresholds are PER-SCHEDULE CADENCE. A single flat 24h threshold fired
    # on velero-weekly-cluster-resources (cron `0 3 * * 0`) for ~6 of every
    # 7 days — the backup had succeeded on schedule, the threshold was just
    # wrong for a weekly cadence. Caught 2026-09-07, one day after this rule
    # was resurrected from 198 days dormant (see PR #848).
    #
    # That matters more than the false positive itself: VeleroBackupDelayed
    # is the alert that should have caught the 16-day silent backup outage.
    # An alert that cries wolf 6 days a week trains people to ignore it,
    # which recreates the original failure by a different route.
    #
    # If you add a schedule, add a matching rule here — the daily rule
    # deliberately matches only `velero-daily-.*` so a new schedule shows up
    # as an un-alerted gap rather than being silently mis-thresholded.
    - alert: VeleroBackupDelayed
      expr: |
        time() - velero_backup_last_successful_timestamp{schedule=~"velero-daily-.*"} > 86400
      for: 1h
      labels:
        severity: critical
        component: backup
      annotations:
        summary: "No successful Velero backup in 24 hours (daily schedule)"
        description: |
          No successful backup for DAILY schedule {{ $labels.schedule }} in 24+ hours.
          Last successful backup was more than 24 hours ago.

          NOTE: This alert only fires when at least one successful backup has occurred.
          If the metric is absent, see VeleroBackupMetricAbsent.

          Troubleshooting:
          1. kubectl get schedule {{ $labels.schedule }} -n velero
          2. kubectl get backups -n velero
          3. kubectl get pods -n velero

    # Weekly cadence: 8 days = the 7-day interval plus a day of slack, so a
    # single missed run alerts but an on-time run never does.
    - alert: VeleroWeeklyBackupDelayed
      expr: |
        time() - velero_backup_last_successful_timestamp{schedule=~"velero-weekly-.*"} > 691200
      for: 1h
      labels:
        severity: critical
        component: backup
      annotations:
        summary: "No successful Velero backup in 8 days (weekly schedule)"
        description: |
          No successful backup for WEEKLY schedule {{ $labels.schedule }} in 8+ days.
          The weekly schedule runs Sundays 03:00; 8 days means at least one
          run was missed entirely.

          NOTE: This alert only fires when at least one successful backup has occurred.
          If the metric is absent (no backups configured or completed), see VeleroBackupMetricAbsent alert.

          Troubleshooting:
          1. kubectl get schedule {{ $labels.schedule }} -n velero
          2. kubectl get backups -n velero
          3. kubectl get pods -n velero

    # Backup COVERAGE, as distinct from backup success. Every alert above this
    # one answers "did the backups we configured run?" — none of them answers
    # "are the backups we configured pointed at everything that matters?"
    #
    # Found 2026-09-07: uptime-kuma held a 135-day-old 5Gi iSCSI PVC (14
    # monitors, 1.95M heartbeats) that had never been backed up, because its
    # namespace was simply never added to velero-daily-critical-pvcs. Every
    # backup reported Completed the whole time. Nothing was wrong with Velero;
    # the PVC was just outside its scope, and no signal existed for that.
    #
    # Deliberately-unprotected namespaces are listed in the exclusion below so
    # this stays silent until something genuinely new appears. Adding a
    # namespace to the schedule means adding it here too — a coupled edit, and
    # an intentional one: it forces a decision about whether new stateful
    # workloads are worth protecting, rather than defaulting to silence.
    - alert: PVCNotCoveredByBackup
      expr: |
        kube_persistentvolumeclaim_info{
          namespace!~"default|loki|trivy-system|falco|uptime-kuma|localstack|tempo|zot"
        }
      for: 6h
      labels:
        severity: warning
        component: backup
      annotations:
        summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is in no backup schedule"
        description: |
          A PersistentVolumeClaim exists in a namespace that no Velero
          schedule covers, so its data is NOT being backed up. Backups will
          continue reporting success — this PVC is simply outside their scope.

          Decide which of these applies, then act:

          1. The data matters → add {{ $labels.namespace }} to
             includedNamespaces in velero-daily-critical-pvcs
             (manifests/base/velero/values.yaml).
          2. The data is disposable/regenerable → add the namespace to this
             alert's exclusion list with a comment saying why.

          Deliberately unprotected today: localstack (test S3 emulator,
          disposable) and tempo (short-TTL traces, regenerable). Everything
          else in the exclusion list is excluded because it IS backed up.

          `for: 6h` so short-lived PVCs from restore tests and CI do not fire.

    # Restore VALIDATION, as distinct from backup success and from backup
    # coverage. The alerts above answer "did the backups run?" and
    # PVCNotCoveredByBackup answers "are they pointed at everything?". Neither
    # answers "would a restore actually work?" — which was never tested on
    # this cluster until 2026-09-07, and then only by hand.
    #
    # velero-restore-validator (monthly) restores a real scheduled backup into
    # a scratch namespace, mounts the volume and reads bytes off it. It exits
    # non-zero on any failure, so a failed Job IS the signal.
    - alert: VeleroRestoreValidationFailed
      expr: |
        kube_job_status_failed{job_name=~"velero-restore-validator.*"} > 0
      for: 15m
      labels:
        severity: critical
        component: backup
      annotations:
        summary: "Monthly Velero restore validation FAILED"
        description: |
          The velero-restore-validator Job failed. A backup that cannot be
          restored is not a backup, and every other Velero alert will keep
          reporting success while this is broken.

          Read the job log first — it names the exact step that failed:
            kubectl -n velero logs job/{{ $labels.job_name }}

          Likely causes, roughly in order:
            - the target namespace is not in the backup (coverage gap)
            - restore Completed but no PVC reached Bound (missing snapshot)
            - the restored volume mounted but held no readable data
            - RBAC or Gatekeeper rejected the verify pod

          Scratch namespace state, if the run left debris behind:
            kubectl -n velero-restore-test get pvc,pod
            kubectl -n velero get restore

    # The watcher must itself be watched. A monthly job that silently stops
    # running looks exactly like one that keeps passing — which is the whole
    # failure class this validator exists to catch, so leaving it unguarded
    # would be self-defeating. 40d allows one missed run plus slack.
    - alert: VeleroRestoreValidationStale
      expr: |
        time() - kube_cronjob_status_last_successful_time{cronjob="velero-restore-validator"} > 3456000
      for: 1h
      labels:
        severity: warning
        component: backup
      annotations:
        summary: "Velero restore validation has not passed in over 40 days"
        description: |
          velero-restore-validator last SUCCEEDED more than 40 days ago. It is
          scheduled monthly, so at least one run has been missed or has been
          failing without completing.

          Restorability is therefore currently unproven — not known-broken,
          but not known-good either.

            kubectl -n velero get cronjob velero-restore-validator
            kubectl -n velero get jobs -l app.kubernetes.io/name=velero-restore-validator

          If the CronJob is suspended or missing, that is the answer.

    - alert: VeleroBackupDurationHigh
      expr: velero_backup_duration_seconds > 1800
      for: 5m
      labels:
        severity: warning
        component: backup
      annotations:
        summary: "Velero backup duration >30 minutes"
        description: |
          Backup took {{ $value | humanizeDuration }} for {{ $labels.schedule }}
          May indicate large data volumes or resource constraints.

    - alert: VeleroBackupStorageLocationUnavailable
      expr: velero_backup_storage_location_available == 0
      for: 10m
      labels:
        severity: critical
        component: backup
      annotations:
        summary: "Velero backup storage unavailable"
        description: |
          Storage location {{ $labels.backup_storage_location }} unavailable.

          Troubleshooting:
          1. kubectl get backupstoragelocation -n velero
          2. kubectl get secret cloud-credentials -n velero
          3. Check LocalStack/S3 service availability

    - alert: VeleroVolumeSnapshotLocationUnavailable
      expr: velero_volume_snapshot_location_available == 0
      for: 10m
      labels:
        severity: warning
        component: backup
      annotations:
        summary: "Velero snapshot location unavailable"
        description: |
          Snapshot location {{ $labels.volume_snapshot_location }} unavailable.
          Kopia file-level backups continue, but CSI snapshots will fail.

    - alert: VeleroPartialBackupFailure
      expr: increase(velero_backup_partial_failure_total[1h]) > 0
      for: 10m
      labels:
        severity: warning
        component: backup
      annotations:
        summary: "Velero partial backup failure"
        description: |
          Partial failures detected: {{ $value }}
          Some resources may not have been backed up.
