---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: velero-alerts
  # Must live where Prometheus's ruleSelector can find it AND carry the
  # `release: kube-prometheus-stack` label. Was in the `velero` namespace
  # WITHOUT that label — Prometheus's ruleSelector requires
  # `release: kube-prometheus-stack`, so this rule sat dormant for 198
  # days and never loaded. That silence let ~16 days of failed B2 backups
  # go unnoticed (see PR #847). All sibling rules live in `default`.
  namespace: default
  labels:
    app: velero
    prometheus: kube-prometheus
    role: alert-rules
    release: kube-prometheus-stack
spec:
  groups:
  - name: velero_backup
    interval: 60s
    rules:
    - alert: VeleroBackupFailed
      expr: increase(velero_backup_failure_total[1h]) > 0
      for: 5m
      labels:
        severity: critical
        component: backup
      annotations:
        summary: "Velero backup failed for schedule {{ $labels.schedule }}"
        description: |
          Velero backup has failed for schedule {{ $labels.schedule }}.
          Failed backups in last hour: {{ $value }}

          Troubleshooting:
          1. kubectl get backups -n velero
          2. kubectl logs -n velero -l app.kubernetes.io/name=velero
          3. kubectl get backupstoragelocation -n velero

    - alert: VeleroBackupMetricAbsent
      expr: absent(velero_backup_last_successful_timestamp)
      for: 1h
      labels:
        severity: warning
        component: backup
      annotations:
        summary: "Velero backup metric is absent"
        description: |
          The velero_backup_last_successful_timestamp metric is not present.
          This may indicate:
          - Velero is not running or not configured
          - No backups have been configured yet
          - Velero pod was recently restarted and no backup has completed

          This is informational if no backup schedules are configured yet.
          If backup schedules exist, this requires investigation.

          Troubleshooting:
          1. kubectl get pods -n velero
          2. kubectl get schedule -n velero
          3. kubectl logs -n velero -l app.kubernetes.io/name=velero

    - alert: VeleroBackupDelayed
      expr: time() - velero_backup_last_successful_timestamp > 86400
      for: 1h
      labels:
        severity: critical
        component: backup
      annotations:
        summary: "No successful Velero backup in 24 hours"
        description: |
          No successful backup for schedule {{ $labels.schedule }} in 24+ hours.
          Last successful backup was more than 24 hours ago.

          NOTE: This alert only fires when at least one successful backup has occurred.
          If the metric is absent (no backups configured or completed), see VeleroBackupMetricAbsent alert.

          Troubleshooting:
          1. kubectl get schedule {{ $labels.schedule }} -n velero
          2. kubectl get backups -n velero
          3. kubectl get pods -n velero

    - alert: VeleroBackupDurationHigh
      expr: velero_backup_duration_seconds > 1800
      for: 5m
      labels:
        severity: warning
        component: backup
      annotations:
        summary: "Velero backup duration >30 minutes"
        description: |
          Backup took {{ $value | humanizeDuration }} for {{ $labels.schedule }}
          May indicate large data volumes or resource constraints.

    - alert: VeleroBackupStorageLocationUnavailable
      expr: velero_backup_storage_location_available == 0
      for: 10m
      labels:
        severity: critical
        component: backup
      annotations:
        summary: "Velero backup storage unavailable"
        description: |
          Storage location {{ $labels.backup_storage_location }} unavailable.

          Troubleshooting:
          1. kubectl get backupstoragelocation -n velero
          2. kubectl get secret cloud-credentials -n velero
          3. Check LocalStack/S3 service availability

    - alert: VeleroVolumeSnapshotLocationUnavailable
      expr: velero_volume_snapshot_location_available == 0
      for: 10m
      labels:
        severity: warning
        component: backup
      annotations:
        summary: "Velero snapshot location unavailable"
        description: |
          Snapshot location {{ $labels.volume_snapshot_location }} unavailable.
          Kopia file-level backups continue, but CSI snapshots will fail.

    - alert: VeleroPartialBackupFailure
      expr: increase(velero_backup_partial_failure_total[1h]) > 0
      for: 10m
      labels:
        severity: warning
        component: backup
      annotations:
        summary: "Velero partial backup failure"
        description: |
          Partial failures detected: {{ $value }}
          Some resources may not have been backed up.
