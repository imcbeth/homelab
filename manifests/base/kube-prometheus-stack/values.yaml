        scrape_interval: 30s
        scrape_timeout: 10s

      # Blackbox exporter - ICMP ping monitoring
      - job_name: 'blackbox-icmp'
        metrics_path: /probe
        params:
          module: [icmp_ping]
        static_configs:
          - targets:
