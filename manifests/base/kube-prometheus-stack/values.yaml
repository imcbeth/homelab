          - target_label: __address__
            replacement: snmp-exporter:9116
        scrape_interval: 60s
        scrape_timeout: 30s

      # Blackbox exporter - HTTPS with cert expiry monitoring
      - job_name: 'blackbox-https'
        metrics_path: /probe
        params:
          module: [https_cert_expiry]
        static_configs:
          - targets:
              - https://argocd.k8s.n37.ca  # ArgoCD external
              - https://grafana.k8s.n37.ca  # Grafana external
              - https://google.com  # External connectivity test
              - https://cloudflare.com  # External connectivity test
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115
        scrape_interval: 60s
        scrape_timeout: 10s

      # Blackbox exporter - HTTPS availability probes via ingress-nginx
      # (SLO inputs). Uses https_2xx (success = actual 2xx response).
      #
      # Restricted to services whose ingresses can be probed end-to-end:
      #   - argocd: TLS-passthrough, argocd-server serves its own 200
      #   - grafana: TLS-termination, returns 200 on /
      #
      # Other services hit the kube-proxy MetalLB VIP hairpin or auth
      # redirects — they are probed via blackbox-availability-internal below.
      - job_name: 'blackbox-availability'
        metrics_path: /probe
        params:
          module: [https_2xx]
        static_configs:
          - targets:
              - https://argocd.k8s.n37.ca
              - https://grafana.k8s.n37.ca
            labels:
              slo_target: "0.995"
              slo_path: "ingress"
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115
        scrape_interval: 30s
        scrape_timeout: 10s

      # Blackbox exporter - HTTP availability probes via internal ClusterIP
      # (SLO inputs). Uses http_2xx against pod-network Service URLs. Bypasses
      # ingress-nginx — measures backend service health only. Combined with the
      # external blackbox-availability job, the two together approximate full
      # end-to-end SLI; alone, this catches backend regressions.
      #
      # Internal probes are necessary because the MetalLB VIP (10.0.10.10) is
      # not reachable from non-meshed pods (kube-proxy KUBE-EXT chain only
      # DNATs LoadBalancer VIPs for src-type=LOCAL traffic). oauth2-proxy auth
      # redirects also break end-to-end ingress probes for protected services.
      - job_name: 'blackbox-availability-internal'
        metrics_path: /probe
        params:
