crds:
  enabled: true
  upgradeJob:
    # Enabled 2026-07-16 as pre-flight for chart v87.0.0 (PR #816).
    # Chart 87 bumps prometheus-operator v0.91.0 → v0.92.1 which requires
    # 10 CRDs to be updated to v0.92.x BEFORE the operator starts. The
    # upgradeJob runs a Job that kubectl-applies the CRDs pre-sync so we
    # don't have to run those `kubectl apply --server-side` commands
    # manually on every kps chart-minor bump.
    enabled: true
    # forceConflicts: true — needed to take SSA field-ownership from
    # existing CRDs installed by the current chart version.
    forceConflicts: true
    image:
      busybox:
        registry: docker.io
        repository: busybox
        tag: "latest"
        sha: ""
        pullPolicy: IfNotPresent
      kubectl:
        registry: registry.k8s.io
        repository: kubectl
        tag: ""
        sha: ""
        pullPolicy: IfNotPresent
    env: {}
    # Required for Gatekeeper `require-resource-limits` constraint.
    # Without these, the Job creation was denied by the admission webhook
    # (verified 2026-07-16 during initial 87.0.0 apply). The kubectl
    # container just runs `kubectl apply --server-side` per CRD, so
    # minimal budget is plenty.
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    extraVolumes: []
    extraVolumeMounts: []
    nodeSelector: {}
    affinity: {}
    tolerations: []
    topologySpreadConstraints: []
    labels: {}
    annotations: {}
    # Required for Gatekeeper `require-labels` constraint (2026-07-16).
    # Second gate after the resources fix; without podLabels the Job
    # pod is denied at admission with "Resource is missing required
    # labels: {app.kubernetes.io/name}".
    podLabels:
      app.kubernetes.io/name: kube-prometheus-stack-crds-upgrade
    podAnnotations: {}
    serviceAccount:
      create: true
      name: ""
      annotations: {}
      labels: {}
      automountServiceAccountToken: true
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    podSecurityContext:
      fsGroup: 65534
      runAsGroup: 65534
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault
customRules: {}
