grafana:
  enabled: true
  deploymentStrategy:
    type: Recreate
    rollingUpdate: null
  persistence:
    enabled: true
    storageClassName: synology-iscsi-retain
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    # Prevent ArgoCD prune from deleting the PVC during chart upgrades.
    # Without this, SSA field changes on chart upgrades caused PVC recreation
    # (new iSCSI LUN provisioned, old LUN orphaned on NAS).
    annotations:
      argocd.argoproj.io/sync-options: "Prune=false"
  # Fix fsGroup race condition with Synology CSI and SQLite journal files
  podSecurityContext:
    fsGroupChangePolicy: OnRootMismatch
  initChownData:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
