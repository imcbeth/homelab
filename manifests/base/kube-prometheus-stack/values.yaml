alertmanager:
  enabled: true
  namespaceOverride: ""
  annotations: {}
  additionalLabels: {}
  apiVersion: v2
  enableFeatures: []
  forceDeployDashboards: false
  networkPolicy:
    enabled: false
    policyTypes:
      - Ingress
    gateway:
      namespace: ""
      podLabels: {}
    additionalIngress: []
    egress:
      enabled: false
      rules: []
    enableClusterRules: true
    monitoringRules:
      prometheus: true
      configReloader: true
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    automountServiceAccountToken: true
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
  config:
    global:
      resolve_timeout: 5m
      smtp_from: 'alertmanager@n37.ca'
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_auth_username: 'imcbeth1980@gmail.com'
      smtp_auth_password_file: '/etc/alertmanager/secrets/alertmanager-smtp-credentials/smtp_password'
      # The above file-based SMTP credentials expect a Secret with the following structure:
      # ---
      # apiVersion: v1
      # kind: Secret
      # metadata:
      #   name: alertmanager-smtp-credentials
      #   namespace: <alertmanager-namespace>
      # type: Opaque
      # stringData:
      #   smtp_username: your-email@example.com        # plain text email
      #   smtp_password: your-app-specific-password    # plain text password
      # ---
      # Note: You can also use 'data:' instead of 'stringData:' if you prefer to
      # base64 encode the values yourself. Kubernetes will decode them when mounting
      # the files, so AlertManager always receives plain text credentials.
      # Example with base64 encoding:
      # data:
      #   smtp_username: eW91ci1lbWFpbEBleGFtcGxlLmNvbQ==  # base64 of email
      #   smtp_password: eW91ci1hcHAtc3BlY2lmaWMtcGFzc3dvcmQ=  # base64 of password
      smtp_require_tls: true
    inhibit_rules:
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'alertname = InfoInhibitor'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
      - target_matchers:
          - 'alertname = InfoInhibitor'
    route:
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
          continue: false
        - receiver: 'email-critical'
          matchers:
            - severity = "critical"
          continue: false
    receivers:
      - name: 'email-critical'
        email_configs:
          - to: 'imcbeth1980@gmail.com'
            headers:
              Subject: '[CRITICAL] {{ .GroupLabels.alertname }} - K8s Homelab'
            html: |
              <!DOCTYPE html>
              <html>
              <head>
                <style>
                  body { font-family: Arial, sans-serif; }
                  .alert { border-left: 4px solid #d9534f; padding: 10px; margin: 10px 0; background-color: #f2dede; }
                  .summary { font-weight: bold; font-size: 16px; }
                </style>
              </head>
              <body>
                <h2>🚨 Critical Alert - Kubernetes Homelab</h2>
                {{ range .Alerts }}
                <div class="alert">
                  <div class="summary">{{ .Annotations.summary }}</div>
                  <pre style="white-space: pre-wrap; margin: 0;">{{ .Annotations.description }}</pre>
                  <div style="margin-top: 10px; font-size: 12px; color: #666;">
                    <strong>Labels:</strong><br/>
                    {{ range .Labels.SortedPairs }}{{ .Name }}: {{ .Value }}<br/>{{ end }}
                  </div>
                </div>
                {{ end }}
                <p><small>Generated by AlertManager - Raspberry Pi 5 K8s Cluster</small></p>
              </body>
              </html>
      - name: 'null'
    templates:
      - '/etc/alertmanager/config/*.tmpl'
