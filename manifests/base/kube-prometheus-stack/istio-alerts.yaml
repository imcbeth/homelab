---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: istio-ambient-alerts
  namespace: default
  labels:
    app: istio
    prometheus: kube-prometheus
    role: alert-rules
    release: kube-prometheus-stack
spec:
  groups:
  - name: istio_control_plane
    interval: 60s
    rules:
    # Istiod has restarted (uptime reset)
    - alert: IstiodRestarted
      expr: istiod_uptime_seconds < 300
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "Istiod has restarted recently"
        description: |
          Istiod uptime is only {{ $value | humanizeDuration }}.
          Check istiod pod logs for crash reasons.

    # Connected ztunnel proxies dropped below expected count (5 nodes)
    - alert: IstioConnectedProxiesLow
      expr: sum(pilot_xds) < 5
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Fewer than 5 ztunnel proxies connected to istiod"
        description: |
          Only {{ $value }} proxies are connected to istiod (expected 5 for 5-node cluster).
          Check ztunnel DaemonSet pod status across nodes.

    # No connected proxies at all
    - alert: IstioNoConnectedProxies
      expr: sum(pilot_xds) == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "No ztunnel proxies connected to istiod"
        description: |
          Zero proxies are connected to istiod. The mesh data plane is completely disconnected.
          IMMEDIATE ACTION: Check istiod and ztunnel pod status.

  - name: istio_xds_performance
    interval: 60s
    rules:
    # XDS push convergence time is high (p95 > 5s)
    - alert: IstioHighConvergenceTime
      expr: |
        histogram_quantile(0.95, sum by (le) (rate(pilot_proxy_convergence_time_bucket[5m]))) > 5
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Istio XDS push convergence time is high"
        description: |
          p95 XDS push convergence time is {{ $value | humanizeDuration }}.
          This means configuration changes take too long to propagate to proxies.

    # XDS configs rejected by proxies (push failures)
    - alert: IstioXDSPushRejections
      expr: sum(rate(pilot_total_xds_rejects_total[5m])) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Istio XDS config pushes are being rejected by proxies"
        description: |
          Proxies are rejecting XDS configuration pushes at {{ $value | humanize }}/s.
          This means configuration updates are not propagating — check istiod logs
          for rejected resource types (CDS/EDS/LDS/RDS).

    # XDS connection terminations spike
    - alert: IstioXDSConnectionTerminations
      expr: rate(istio_xds_connection_terminations_total[5m]) > 0.1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Elevated XDS connection termination rate"
        description: |
          XDS connections are being terminated at {{ $value | humanize }}/s.
          This may indicate network issues between ztunnel and istiod.

  - name: istio_configuration_errors
    interval: 60s
    rules:
    # Listener conflicts detected
    - alert: IstioListenerConflicts
      expr: pilot_conflict_inbound_listener > 0 or pilot_conflict_outbound_listener_tcp_over_current_tcp > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "Istio listener conflicts detected"
        description: |
          Pilot has detected listener conflicts. This may cause traffic routing issues.
          Review service port configurations for overlapping ports.

    # Duplicate clusters
    - alert: IstioDuplicateClusters
      expr: pilot_duplicate_envoy_clusters > 0
      for: 15m
      labels:
        severity: info
      annotations:
        summary: "Duplicate Envoy clusters detected in Istio config"
        description: |
          {{ $value }} duplicate cluster configurations found.
          Review service definitions for naming conflicts.

  - name: istio_data_plane
    interval: 60s
    rules:
    # Net close rate exceeds open rate by >50% sustained (connection drain)
    - alert: IstioTCPConnectionsDrop
      expr: |
        (
          sum(rate(istio_tcp_connections_closed_total[5m]))
          - sum(rate(istio_tcp_connections_opened_total[5m]))
        ) > 0.5 * sum(rate(istio_tcp_connections_opened_total[5m]))
        and sum(rate(istio_tcp_connections_opened_total[5m])) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Active Istio TCP connections dropping (high close rate vs open rate)"
        description: |
          The rate of closed mesh TCP connections significantly exceeds the open rate.
          Net close rate excess: {{ $value | humanize }}/s.
          This may indicate widespread service failures or mesh connectivity issues.

    # DNS upstream failure rate spike (compared to baseline)
    # Note: ztunnel DNS proxy counts NXDOMAIN from search domain expansion
    # as failures, so a baseline failure rate is normal. Alert on 3x spike.
    - alert: IstioDNSFailures
      expr: |
        sum(rate(istio_dns_upstream_failures_total[5m]))
        > 3 * sum(rate(istio_dns_upstream_failures_total[1h] offset 5m))
        and sum(rate(istio_dns_upstream_failures_total[5m])) > 1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Istio DNS upstream failure rate spiked 3x above baseline"
        description: |
          Ztunnel DNS proxy failure rate is {{ $value | humanize }}/s,
          significantly above the 1-hour baseline.
          Check CoreDNS health and network connectivity.

    # Mesh connections refused between two KNOWN meshed namespaces.
    #
    # Added with O8 (2026-11-15), when every ambient namespace's HBONE (15008)
    # ingress was narrowed from "anywhere" to the namespaces that use it. If an
    # allowlist misses a rare flow, NetworkPolicy drops the HBONE SYN and the
    # only trace is here: ztunnel logs "connection timed out, maybe a
    # NetworkPolicy is blocking HBONE port 15008" and counts a failed
    # connection. Nothing else alerts on it -- the caller's own ztunnel
    # accepts the TCP connect locally, so the client just sees a stall.
    #
    # destination "unknown" is excluded: it is traffic leaving the mesh and has
    # standing failures unrelated to policy (loki -> unknown ~6.6k/day, O11).
    #
    # NOT written with increase(): a blocked flow creates a NEW failure
    # series, and increase() over a series whose first sample is already 2 or
    # 4 returns 0 -- verified 2026-11-15, the kafka -> unipoller test drops
    # were invisible to it. Current minus 1h ago, with a missing past sample
    # treated as 0, counts them.
    #
    # >= 10 in 1h: a blocked scrape (~120 failures/h) fires in ~15 min. Over
    # the 14 days before this change it would have fired at three moments,
    # all real disruptions -- 2026-11-01 20:00 (four pairs at once), the
    # 2026-11-04 network outage (default -> unipoller), and strimzi-system ->
    # kafka on 2026-11-11. A one-off burst of a few retries (e.g. a blocked
    # weekly CronJob) will NOT reach it; those surface as job failures.
    - alert: IstioMeshConnectionsRefused
      expr: |
        (
          sum by (source_workload_namespace, destination_workload_namespace) (
            istio_tcp_connections_failed_total{reporter="source", destination_workload_namespace!~"unknown|"})
          - (
            sum by (source_workload_namespace, destination_workload_namespace) (
              istio_tcp_connections_failed_total{reporter="source", destination_workload_namespace!~"unknown|"} offset 1h)
            or
            sum by (source_workload_namespace, destination_workload_namespace) (
              istio_tcp_connections_failed_total{reporter="source", destination_workload_namespace!~"unknown|"}) * 0
          )
        ) >= 10
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Mesh connections {{ $labels.source_workload_namespace }} -> {{ $labels.destination_workload_namespace }} failing"
        description: |
          {{ $value | humanize }} mesh connections from {{ $labels.source_workload_namespace }}
          to {{ $labels.destination_workload_namespace }} failed in the last hour.

          If {{ $labels.source_workload_namespace }} is not in the destination's
          HBONE allowlist (the 15008 ingress rule in
          manifests/base/network-policies/{{ $labels.destination_workload_namespace }}/),
          this is a NetworkPolicy drop: add it there. Confirm in the ztunnel log
          on the destination's node:
            kubectl logs -n istio-system <ztunnel pod> | grep "blocking HBONE"
