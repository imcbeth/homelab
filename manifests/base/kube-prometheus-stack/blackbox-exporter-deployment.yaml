---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: default
  labels:
    app: blackbox-exporter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
        app.kubernetes.io/name: blackbox-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9115"
        prometheus.io/path: "/metrics"
    spec:
      # Resolve the externally-probed hostnames to the LAN gateway's ClusterIP
      # to avoid pod-to-MetalLB-VIP hairpin NAT. (They pointed at
      # ingress-nginx's ClusterIP until every host moved, 2026-11-15.)
      hostAliases:
        # lan-gateway-istio ClusterIP, for hosts moved off ingress-nginx
        # (O4 Phase 1). Changes if the Gateway is renamed or recreated:
        #   kubectl get svc -n istio-system lan-gateway-istio -o jsonpath='{.spec.clusterIP}'
        - ip: "10.96.28.68"
          hostnames:
            - "grafana.k8s.n37.ca"
            - "argocd.k8s.n37.ca"
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.29.1
          args:
            - "--config.file=/config/blackbox.yml"
            - "--log.level=info"
          ports:
            - name: http
              containerPort: 9115
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_RAW  # Required for ICMP probes
      volumes:
        - name: config
          configMap:
            name: blackbox-exporter-config
