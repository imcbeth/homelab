# Grafana Alloy configuration for Raspberry Pi cluster
# Replaces Promtail (EOL March 2026) as log collector
# Deployed as DaemonSet - one pod per node (5 total)
# Collects logs from all Kubernetes pods and sends to Loki

# DaemonSet controller (one pod per node)
controller:
  type: daemonset
  # Run on all nodes including control-plane
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

# Alloy container configuration
alloy:
  # Resource limits per pod (5 pods total)
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi

  # Expose OTLP ports so applications can send traces to Alloy
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

  # River configuration for Kubernetes log collection
  configMap:
    content: |
      // Discover all Kubernetes pods
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Relabel targets: filter to Running pods and add useful labels
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        // Only scrape running pods
        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Running"
          action        = "keep"
        }

        // Add namespace label
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        // Add pod name label
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        // Add container name label
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        // Add node name label (useful for Pi cluster debugging)
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }

        // Selective pod label mapping (stay under Loki's 15 label limit)
        // Kubernetes pods can have 17+ labels with Istio; only map useful ones
        rule {
          action = "labelmap"
          regex  = "__meta_kubernetes_pod_label_(app|app_kubernetes_io_name|app_kubernetes_io_instance|app_kubernetes_io_component|app_kubernetes_io_part_of|k8s_app|service_name)"
        }
      }

      // Tail container logs via Kubernetes API
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.pods.receiver]
      }

      // Parse CRI log format, then discard entries Loki would refuse anyway.
      //
      // WHY THE DROP STAGE EXISTS
      //
      // Loki's limits_config sets reject_old_samples_max_age: 720h to match
      // retention_period: 720h (PR #989). An entry older than that window is
      // rejected with HTTP 400 -- and Loki rejects the ENTIRE BATCH, not just the
      // offending entry, so fresh log lines batched alongside a stale one are lost
      // as collateral.
      //
      // Alloy re-reads container log files from the start when a tailer restarts.
      // Containers that log rarely (pvc-mount-monitor, eventbus reloader,
      // chaos-daemon) still hold lines from over 30 days ago, so those batches
      // kept failing: 4,591 dropped entries in 24h on 2026-10-07, all with
      // reason=ingester_error, all from a single node.
      //
      //   has timestamp too old: 2026-09-06T21:49:57Z
      //   oldest acceptable is:  2026-09-07T20:21:41Z
      //
      // Dropping them here costs nothing -- they are past retention_period, so Loki
      // would delete them on arrival even if it accepted them. What it buys is the
      // fresh entries that were being discarded alongside them.
      //
      // 696h = 29 days, a 24h margin under Loki's 720h so clock skew and batch
      // latency cannot push a legitimate entry over the line. If retention_period
      // changes, change this too -- they are a matched pair.
      loki.process "pods" {
        stage.cri {}

        stage.drop {
          older_than          = "696h"
          drop_counter_reason = "older_than_loki_reject_window"
        }

        forward_to = [loki.write.default.receiver]
      }

      // Send logs to Loki
      loki.write "default" {
        endpoint {
          url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      // OTLP trace receiver - applications send traces to Alloy as the collector
      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      // Forward traces to Grafana Tempo
      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.tempo.svc.cluster.local:4317"
          tls {
            insecure = true
          }
        }
      }

# Config reloader sidecar (must have resource limits for Gatekeeper)
configReloader:
  resources:
    requests:
      cpu: 10m
      memory: 50Mi
    limits:
      cpu: 50m
      memory: 64Mi

# ServiceMonitor for Prometheus metrics collection
serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack
