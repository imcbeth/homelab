apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: uptime-kuma
      interval: 60s
      rules:
        - alert: UptimeKumaMonitorDown
          expr: monitor_status == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Monitor {{ $labels.monitor_name }} is down"
            description: >-
              Uptime Kuma monitor '{{ $labels.monitor_name }}' ({{ $labels.monitor_type }}:
              {{ $labels.monitor_url }}) has been reporting DOWN for more than 2 minutes.

        # Monitor definitions are NOT in git — they live in Uptime Kuma's
        # SQLite DB, and 2.5.3 has no REST API to manage them declaratively.
        # The uptime-kuma-monitor-drift CronJob compares the live set against
        # a committed baseline daily and fails when they diverge, so this
        # alert is how that divergence reaches a human.
        #
        # severity=warning is deliverable as of 2026-09-10: before that,
        # warnings were routed to AlertManager's null receiver and dropped.
        - alert: UptimeKumaMonitorDrift
          expr: |
            kube_job_status_failed{job_name=~"uptime-kuma-monitor-drift.*"} > 0
          for: 15m
          labels:
            severity: warning
            component: monitoring
          annotations:
            summary: "Uptime Kuma monitors no longer match the declared baseline"
            description: |
              The monitor drift check failed. Either the live monitor set
              diverged from manifests/base/uptime-kuma/monitor-baseline-configmap.yaml,
              or the check itself could not run.

              The job log names the exact monitors, added and removed:
                kubectl -n uptime-kuma logs job/{{ $labels.job_name }}

              A monitor edited in the UI shows up in BOTH lists — old
              definition removed, new one added. That is one change, not two.

              If the change was intentional, refresh the baseline via PR. That
              diff is the audit trail these monitors otherwise do not have.
              If it was not, monitoring was changed without a record.

        # The drift check going quiet must not look like "no drift".
        #
        # UptimeKumaMonitorDrift above fires on job FAILURE. If the CronJob is
        # suspended, deleted, or never schedules, no Job exists to fail and
        # that alert stays silent forever — indistinguishable from a clean
        # run. Same gap already closed for velero-restore-validator and
        # pvc-writability-prober; missed here when the detector shipped.
        #
        # 30h allows one missed daily run plus slack, so a single late
        # schedule does not page while a genuinely stopped check does.
        - alert: UptimeKumaMonitorDriftStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{cronjob="uptime-kuma-monitor-drift"} > 108000
          for: 1h
          labels:
            severity: warning
            component: monitoring
          annotations:
            summary: "Uptime Kuma drift check has not passed in over 30 hours"
            description: |
              uptime-kuma-monitor-drift last SUCCEEDED more than 30 hours ago.
              It is scheduled daily, so a run has been missed or has been
              failing without completing.

              Monitor drift is therefore currently UNKNOWN — not known-absent.

                kubectl -n uptime-kuma get cronjob uptime-kuma-monitor-drift
                kubectl -n uptime-kuma get jobs -l app.kubernetes.io/name=uptime-kuma-monitor-drift

              If the CronJob is suspended or missing, that is the answer.

              NOTE: the schedule is 06:40 UTC with no spec.timeZone, i.e.
              00:40 America/Edmonton — not 06:40 local. Worth remembering
              when reasoning about when the last run should have happened.

        - alert: UptimeKumaMonitorCertExpirySoon
          expr: monitor_cert_days_remaining > 0 and monitor_cert_days_remaining < 14
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "TLS cert for {{ $labels.monitor_name }} expires in {{ $value }} days"
            description: >-
              The TLS certificate for '{{ $labels.monitor_name }}' ({{ $labels.monitor_url }})
              expires in less than 14 days ({{ $value }} days remaining).
