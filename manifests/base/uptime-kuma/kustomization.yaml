apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheusrule.yaml
  # uptime-kuma-metrics-token-sealed.yaml is intentionally excluded here because
  # the ServiceMonitor and token secret are managed from
  # manifests/base/kube-prometheus-stack/ in the default namespace, where
  # Prometheus Operator RBAC can read the token secret.
