apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheusrule.yaml
  # uptime-kuma-metrics-token-sealed.yaml is intentionally excluded here:
  # Prometheus can only reference auth secrets from its own namespace (default).
  # ServiceMonitor and token secret are managed in manifests/base/kube-prometheus-stack/.
