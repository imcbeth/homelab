# Uptime Kuma Helm values
# Chart: uptime-kuma/uptime-kuma v4.2.0 (app v2.5.0)
# Cluster: 5x Raspberry Pi 5 (ARM64)
# URL: https://status.k8s.n37.ca

# Migrated 1.23.17 -> 2.5.3 on 2026-09-07.
#
# NOTE ON THE TAG SHAPE: 1.x used a `-debian` suffix; 2.x DROPPED it. The
# unsuffixed tag is the Debian build, `-slim` is the smaller one. Writing
# "2.5.3-debian" here yields an ImagePullBackOff, not a helpful error.
#
# The unsuffixed image runs as root, matching 1.x. The `-rootless` variants
# run as uid 1000 and CANNOT write this PVC, whose files are root-owned
# (root:root 755) — switching to rootless needs a chown first.
#
# The 2.x upgrade rewrites the SQLite schema in place and is ONE-WAY: a
# migrated DB cannot be opened by 1.x. Rollback is restore-from-backup only.
# Pre-migration artifacts (2026-09-07, verified `pragma integrity_check` ok,
# 14 monitors / 1,950,531 heartbeats):
#   - /app/data/pre2x.db on this PVC (instant in-place rollback)
#   - ~/backups/uptime-kuma/kuma-pre2x-20260907.db.gz (off-cluster)
#   - Velero: uptime-kuma is now in velero-daily-critical-pvcs (PR #907)
image:
  repository: docker.io/louislam/uptime-kuma
  tag: "2.5.4"

# Deployment (not StatefulSet) with Recreate strategy — RWO iSCSI PVC
useDeploy: true

strategy:
  type: Recreate

podLabels:
  app.kubernetes.io/name: uptime-kuma

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# iSCSI-backed persistence on Synology NAS
volume:
  enabled: true
  storageClassName: synology-iscsi-delete
  accessMode: ReadWriteOnce
  size: 5Gi

# Liveness probe — exercises both Uptime Kuma's own healthcheck binary AND
# write capability on the PVC. Catches the iSCSI RO-remount failure mode
# (cluster restart on 2026-06-04 hit Loki + Falco-Redis; Uptime Kuma's PVC
# was unaffected this time but the same risk applies). When a write fails,
# kubelet kills the container and the deployment controller schedules a
# fresh pod → fresh iSCSI session → RW remount, no manual intervention.
# Mount path /app/data per chart default.
livenessProbe:
  enabled: true
  # Restored to 180 on 2026-09-08, the 2.x migration having completed
  # ("Aggregate Table Migration Completed", 2026-09-07T21:10:37Z, 0 restarts).
  #
  # It was temporarily raised to 900 for that migration: Uptime Kuma rewrites
  # its schema on first start, and here also re-aggregated 1.95M heartbeat
  # rows over ~58 minutes. At 180s + 3x30s the kubelet would have killed the
  # container ~270s in, mid-write, and gone on doing so every restart.
  #
  # Raise it again before any future major upgrade of this app. 900s is the
  # wrong steady-state value — a wedged pod would go uncaught for 15 minutes.
  initialDelaySeconds: 180
  periodSeconds: 30
  failureThreshold: 3
  timeoutSeconds: 5
  successThreshold: 1
  exec:
    command:
      - /bin/sh
      - -c
      - extra/healthcheck && touch /app/data/.healthz && rm -f /app/data/.healthz

service:
  type: ClusterIP
  port: 3001

ingress:
  enabled: true
  # className key not supported in this chart version — use annotation
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: lets-encrypt-k8s-n37-ca-prod
    external-dns.alpha.kubernetes.io/hostname: status.k8s.n37.ca
    external-dns.alpha.kubernetes.io/ttl: "300"
    # WebSocket support required for Uptime Kuma real-time updates.
    # ingress-nginx handles WebSocket upgrades natively — proxy-read-timeout
    # and proxy-send-timeout keep the connection alive for long-lived sockets.
    # Avoid snippet annotations: allow-snippet-annotations is disabled by
    # default since ingress-nginx v1.9 (CVE-2021-25742).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # oauth2-proxy authentication — GitHub login required
    # auth-url uses internal ClusterIP to avoid hairpin NAT issues
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/oauth2/auth"
    # rd must include scheme+host so oauth2-proxy redirects back to the originating app
    nginx.ingress.kubernetes.io/auth-signin: "https://oauth.k8s.n37.ca/oauth2/start?rd=$scheme://$host$uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email"
  hosts:
    - host: status.k8s.n37.ca
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: uptime-kuma-tls
      hosts:
        - status.k8s.n37.ca
