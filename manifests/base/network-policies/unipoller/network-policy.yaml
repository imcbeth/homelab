apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unipoller-network-policy
  namespace: unipoller
  labels:
    app.kubernetes.io/name: unipoller
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}  # Apply to all pods in namespace
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Istio ambient mesh HBONE tunnel traffic (port 15008)
    # Restricted 2026-11-15 (O8). Between two ambient-meshed pods this is the
    # ONLY rule NetworkPolicy evaluates -- ztunnel delivers the connection
    # inside the pod, so the application-port rules below never see it. It
    # used to admit 15008 from anywhere, which let any meshed pod reach any
    # port here. Sources: every meshed namespace the rules below name, plus
    # those seen in 14 days of ztunnel connection metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: unipoller
      ports:
        - protocol: TCP
          port: 15008  # HBONE mTLS tunnel
    # Allow ztunnel health probes via link-local address
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
    # Allow Prometheus to scrape metrics
    # Prometheus runs in `default`. Until 2026-11-15 this said `monitoring`,
    # a namespace that does not exist, so the rule admitted nothing; the
    # scrape worked only because every ambient namespace admitted HBONE
    # (15008) from anywhere (O8 in TODO.md).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 9130   # unipoller metrics port
  egress:
    # Allow HBONE tunnel traffic to any ambient mesh pod (port 15008)
    - ports:
        - protocol: TCP
          port: 15008  # HBONE mTLS tunnel
    # Allow DNS resolution via kube-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow connection to UniFi controller (10.0.1.1)
    - to:
        - ipBlock:
            cidr: 10.0.1.1/32
      ports:
        - protocol: TCP
          port: 443   # UniFi API HTTPS
        - protocol: TCP
          port: 8443  # UniFi controller port
    # Allow Istio ambient mesh communication (ztunnel, istiod)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15008  # ztunnel HBONE
        - protocol: TCP
          port: 15012  # istiod gRPC
        - protocol: TCP
          port: 15017  # istiod webhook
