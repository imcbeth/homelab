apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unipoller-network-policy
  namespace: unipoller
  labels:
    app.kubernetes.io/name: unipoller
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}  # Apply to all pods in namespace
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Prometheus to scrape metrics from default namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 9130  # unipoller metrics port
  egress:
    # Allow DNS resolution via kube-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow connection to UniFi controller (10.0.1.1)
    - to:
        - ipBlock:
            cidr: 10.0.1.1/32
      ports:
        - protocol: TCP
          port: 443   # UniFi API HTTPS
        - protocol: TCP
          port: 8443  # UniFi controller port
    # Allow Istio ambient mesh communication (ztunnel, istiod)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15008  # ztunnel HBONE
        - protocol: TCP
          port: 15012  # istiod gRPC
        - protocol: TCP
          port: 15017  # istiod webhook
