apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: localstack-network-policy
  namespace: localstack
  labels:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}  # Apply to all pods in namespace
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Istio ambient mesh HBONE traffic from all meshed namespaces
    - from:
        - namespaceSelector:
            matchLabels:
              istio.io/dataplane-mode: ambient
      ports:
        - protocol: TCP
          port: 15008  # HBONE mTLS
    # Allow Velero to access S3 API
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: velero
      ports:
        - protocol: TCP
          port: 4566
    # Allow ingress-nginx for UI access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 4566
    # Allow Prometheus to scrape metrics from default namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 4566
  egress:
    # Allow DNS resolution via kube-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow Istio ambient mesh communication (ztunnel, istiod)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15008  # ztunnel HBONE
        - protocol: TCP
          port: 15012  # istiod gRPC
        - protocol: TCP
          port: 15017  # istiod webhook
