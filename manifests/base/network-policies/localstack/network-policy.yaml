apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: localstack-network-policy
  namespace: localstack
  labels:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}  # Apply to all pods in namespace
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Istio ambient mesh HBONE tunnel traffic (port 15008)
    # Restricted 2026-11-15 (O8). Between two ambient-meshed pods this is the
    # ONLY rule NetworkPolicy evaluates -- ztunnel delivers the connection
    # inside the pod, so the application-port rules below never see it. It
    # used to admit 15008 from anywhere, which let any meshed pod reach any
    # port here. Sources: every meshed namespace the rules below name, plus
    # those seen in 14 days of ztunnel connection metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argo-workflows
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flink-demo
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: localstack
        # lan-gateway (istio-system) reaching localstack over HBONE, if the
        # gateway tunnels to ambient backends (O4 Phase 1).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15008  # HBONE mTLS tunnel
    # Allow ztunnel health probes via link-local address
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
    # Allow Velero to access S3 API
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: velero
      ports:
        - protocol: TCP
          port: 4566
    # Allow argo-workflows to access S3 API
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argo-workflows
      ports:
        - protocol: TCP
          port: 4566   # LocalStack API
    # Allow ingress-nginx for UI access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 4566
    # Allow flink-demo (PreSync setup job + kafka-to-s3 streaming job)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flink-demo
      ports:
        - protocol: TCP
          port: 4566
    # Uptime Kuma health monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
      ports:
        - protocol: TCP
          port: 4566   # LocalStack health endpoint
    # lan-gateway (istio-system) for localstack.k8s.n37.ca (O4 Phase 1),
    # replacing the ingress-nginx rule. Plain TCP case; whichever of this and
    # the 15008 entry goes unused is removed after the cutover is observed.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 4566
  egress:
    # Allow HBONE tunnel traffic to any ambient mesh pod (port 15008)
    - ports:
        - protocol: TCP
          port: 15008  # HBONE mTLS tunnel
    # Allow DNS resolution via kube-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow Istio ambient mesh communication (ztunnel, istiod)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15008  # ztunnel HBONE
        - protocol: TCP
          port: 15012  # istiod gRPC
        - protocol: TCP
          port: 15017  # istiod webhook
