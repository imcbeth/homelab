apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flink-operator-network-policy
  namespace: flink-operator
  labels:
    app.kubernetes.io/name: flink-kubernetes-operator
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Istio ambient mesh HBONE tunnel (ztunnel rewrites dest port to 15008)
    - ports:
        - protocol: TCP
          port: 15008

    # ztunnel link-local health probes
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32

    # Flink operator webhook — Kubernetes API server calls from control-plane (hostNetwork).
    # Calico IPIP rewrites source IP for cross-node traffic so ipBlock rules fail.
    # Bare port rule (no from selector) allows webhook calls from any source.
    - ports:
        - protocol: TCP
          port: 9443  # Flink operator admission webhook

  egress:
    # DNS resolution via kube-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Kubernetes API server (ClusterIP)
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443

    # Kubernetes API server (control plane nodes)
    - to:
        - ipBlock:
            cidr: 10.0.10.0/24
      ports:
        - protocol: TCP
          port: 6443

    # ztunnel HBONE — bare rule required: ztunnel runs hostNetwork and binds to
    # node IPs, not istio-system pod IPs, so namespace-scoped selectors don't match.
    - ports:
        - protocol: TCP
          port: 15008

    # istiod control plane (xDS gRPC, webhook)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15012  # istiod gRPC
        - protocol: TCP
          port: 15017  # istiod webhook

    # Flink operator polls JobManager REST API on managed FlinkDeployment pods.
    # Required for reconciliation of all watched namespaces.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flink-demo
      ports:
        - protocol: TCP
          port: 8081  # Flink JobManager REST API
