apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: strimzi-system-network-policy
  namespace: strimzi-system
  labels:
    app.kubernetes.io/name: strimzi-kafka-operator
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Istio ambient mesh HBONE tunnel (ztunnel rewrites dest port to 15008)
    # Restricted 2026-11-15 (O8). Between two ambient-meshed pods this is the
    # ONLY rule NetworkPolicy evaluates -- ztunnel delivers the connection
    # inside the pod, so the application-port rules below never see it. It
    # used to admit 15008 from anywhere, which let any meshed pod reach any
    # port here. Sources: every meshed namespace the rules below name, plus
    # those seen in 14 days of ztunnel connection metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: strimzi-system
      ports:
        - protocol: TCP
          port: 15008  # HBONE mTLS tunnel

    # ztunnel link-local health probes
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32

  egress:
    # DNS resolution via kube-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Kubernetes API server (ClusterIP)
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443

    # Kubernetes API server (control plane nodes)
    - to:
        - ipBlock:
            cidr: 10.0.10.0/24
      ports:
        - protocol: TCP
          port: 6443

    # ztunnel HBONE — bare rule required: ztunnel runs hostNetwork and binds to
    # node IPs, not istio-system pod IPs, so namespace-scoped selectors don't match.
    - ports:
        - protocol: TCP
          port: 15008

    # istiod control plane (xDS gRPC, webhook)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15012  # istiod gRPC
        - protocol: TCP
          port: 15017  # istiod webhook

    # Strimzi operator reconciles Kafka pods and calls describeMetadataQuorum.
    # AdminClient connects to bootstrap (9092), then follows the controller
    # endpoint advertised in metadata to the CONTROLPLANE listener (9090).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka
      ports:
        - protocol: TCP
          port: 9090  # KRaft CONTROLPLANE (quorum controller)
        - protocol: TCP
          port: 9091  # KRaft REPLICATION
        - protocol: TCP
          port: 9092  # Kafka bootstrap / AdminClient
