apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: strimzi-system-network-policy
  namespace: strimzi-system
  labels:
    app.kubernetes.io/name: strimzi-kafka-operator
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Istio ambient mesh HBONE tunnel (ztunnel rewrites dest port to 15008)
    - ports:
        - protocol: TCP
          port: 15008

    # ztunnel link-local health probes
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32

    # Strimzi webhook — Kubernetes API server calls from control-plane (hostNetwork).
    # Calico IPIP rewrites source IP for cross-node traffic so ipBlock rules fail.
    # Bare port rule (no from selector) allows webhook calls from any source.
    - ports:
        - protocol: TCP
          port: 9443  # Strimzi admission webhook

  egress:
    # DNS resolution via kube-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Kubernetes API server (ClusterIP)
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443

    # Kubernetes API server (control plane nodes)
    - to:
        - ipBlock:
            cidr: 10.0.10.0/24
      ports:
        - protocol: TCP
          port: 6443

    # Istio ambient mesh communication (ztunnel, istiod)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15008  # ztunnel HBONE
        - protocol: TCP
          port: 15012  # istiod gRPC
        - protocol: TCP
          port: 15017  # istiod webhook
