apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # UI traffic from ingress-nginx
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3001
    # Prometheus pod metrics (kube-state-metrics covers pod health)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 3001
    # Self-monitoring (Uptime Kuma checks its own service endpoint)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
      ports:
        - protocol: TCP
          port: 3001
  egress:
    # DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # External HTTP/HTTPS for monitoring targets (public internet + internal services)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    # Internal cluster services monitoring (various ports)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 3100   # loki
        - protocol: TCP
          port: 3200   # tempo
        - protocol: TCP
          port: 2746   # argo-workflows
        - protocol: TCP
          port: 2802   # falco-falcosidekick-ui
        - protocol: TCP
          port: 4566   # localstack
        - protocol: TCP
          port: 5000   # zot
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081   # flink
        - protocol: TCP
          port: 9090
