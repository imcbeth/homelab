apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Phase 1: Low-risk namespaces
  - localstack/network-policy.yaml
  - localstack/authorization-policy.yaml
  - unipoller/network-policy.yaml
  - unipoller/authorization-policy.yaml
  # Phase 2: Monitoring namespaces
  - loki/network-policy.yaml
  - loki/authorization-policy.yaml
  - trivy-system/network-policy.yaml
  - trivy-system/authorization-policy.yaml
  # Runtime security & policy enforcement
  - falco/network-policy.yaml
  - gatekeeper-system/network-policy.yaml
  # Phase 3: Security-sensitive namespaces
  - velero/network-policy.yaml
  # CI/CD namespaces
  - argo-workflows/network-policy.yaml
  - argo-workflows/authorization-policy.yaml
  - argo-events/network-policy.yaml
  - argo-events/authorization-policy.yaml
  # Phase 4: Core infrastructure namespaces
  - cert-manager/network-policy.yaml
  - external-dns/network-policy.yaml
  - metallb-system/network-policy.yaml
  # Phase 5: Service mesh namespaces
  - istio-system/network-policy.yaml
  # Chaos engineering
  - chaos-mesh/network-policy.yaml
  # Container registry
  - zot/network-policy.yaml
  # Kafka operator
  - strimzi-system/namespace.yaml
  - strimzi-system/network-policy.yaml
  - strimzi-system/authorization-policy.yaml
  # Flink operator
  - flink-operator/namespace.yaml
  - flink-operator/network-policy.yaml
  # Kafka message broker
  - kafka/namespace.yaml
  - kafka/network-policy.yaml
  - kafka/authorization-policy.yaml
  # Flink streaming jobs
  - flink-demo/namespace.yaml
  - flink-demo/network-policy.yaml
  - flink-demo/authorization-policy.yaml
  # Authentication proxy
  - oauth2-proxy/namespace.yaml
  - oauth2-proxy/network-policy.yaml
  # Status monitoring
  - uptime-kuma/network-policy.yaml
  - uptime-kuma/drift-detector-netpol.yaml
  # Distributed tracing
  - tempo/namespace.yaml
  - tempo/network-policy.yaml
  # Phase 6: Remaining namespaces
  - default/network-policy.yaml
  - default/authorization-policy.yaml
  - default/calico-network-policy-allow-egress-icmp.yaml
  - argocd/network-policy.yaml
  - argocd/authorization-policy.yaml
  - synology-csi/network-policy.yaml
  - kube-system/network-policy.yaml
  - tigera-operator/network-policy.yaml
  # Public blog (Cloudflare tunnel + nginx)
  - lifeonabike/network-policy.yaml
