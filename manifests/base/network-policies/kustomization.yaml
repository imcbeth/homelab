apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Phase 1: Low-risk namespaces
  - localstack/network-policy.yaml
  - unipoller/network-policy.yaml
  # Phase 2: Monitoring namespaces
  - loki/network-policy.yaml
  - trivy-system/network-policy.yaml
  # Runtime security & policy enforcement
  - falco/network-policy.yaml
  - gatekeeper-system/network-policy.yaml
  # Phase 3: Security-sensitive namespaces
  - velero/network-policy.yaml
  # CI/CD namespaces
  - argo-workflows/network-policy.yaml
  # Phase 4: Core infrastructure namespaces
  - cert-manager/network-policy.yaml
  - external-dns/network-policy.yaml
  - metallb-system/network-policy.yaml
  - ingress-nginx/network-policy.yaml
  # Phase 5: Service mesh namespaces
  - istio-system/network-policy.yaml
  # Chaos engineering
  - chaos-mesh/network-policy.yaml
  # Container registry
  - zot/network-policy.yaml
  # Authentication proxy
  - oauth2-proxy/network-policy.yaml
  # Status monitoring
  - uptime-kuma/network-policy.yaml
  # Distributed tracing
  - tempo/namespace.yaml
  - tempo/network-policy.yaml
  # Phase 6: Remaining namespaces
  - default/network-policy.yaml
  - default/calico-network-policy-allow-egress-icmp.yaml
  - argocd/network-policy.yaml
  - synology-csi/network-policy.yaml
  - kube-system/network-policy.yaml
  - tigera-operator/network-policy.yaml
