apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: istio-system-network-policy
  namespace: istio-system
  labels:
    app.kubernetes.io/name: istio
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # HBONE tunnel port (mandatory bare rule for ambient mesh)
    # ztunnel tunnels ALL inter-pod traffic through port 15008
    # Must be bare (no from selector) per Istio ambient requirements
    - ports:
        - protocol: TCP
          port: 15008

    # Intra-namespace communication (istiod, ztunnel, istio-cni)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15010  # istiod gRPC plaintext xDS
        - protocol: TCP
          port: 15012  # istiod gRPC TLS xDS
        - protocol: TCP
          port: 15014  # istiod monitoring / istio-cni metrics
        - protocol: TCP
          port: 15017  # istiod webhooks
        - protocol: TCP
          port: 15020  # ztunnel stats

    # xDS from ztunnel/waypoints in any namespace to istiod
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 15012

    # Webhook calls from Kubernetes API server (hostNetwork)
    # Must be bare rule (no from selector) because hostNetwork pods
    # don't match namespaceSelector, and IPIP rewrites source IP
    - ports:
        - protocol: TCP
          port: 15017

    # Prometheus scraping from default namespace (ServiceMonitor + PodMonitor)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 15014  # istiod metrics
        - protocol: TCP
          port: 15020  # ztunnel metrics

  egress:
    # HBONE tunnel port (mandatory bare rule for ambient mesh)
    - ports:
        - protocol: TCP
          port: 15008

    # DNS resolution via kube-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Kubernetes API server (ClusterIP)
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443

    # Kubernetes API server (control plane nodes)
    - to:
        - ipBlock:
            cidr: 10.0.10.0/24
      ports:
        - protocol: TCP
          port: 6443

    # Intra-namespace communication
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15010
        - protocol: TCP
          port: 15012
        - protocol: TCP
          port: 15014
        - protocol: TCP
          port: 15017
        - protocol: TCP
          port: 15020

    # Ztunnel data plane: deliver decrypted traffic to backend pods
    # ztunnel proxies all meshed traffic and must reach any pod on any port
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
