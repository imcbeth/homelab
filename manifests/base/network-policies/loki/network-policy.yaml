apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-network-policy
  namespace: loki
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}  # Apply to all pods in namespace
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Istio ambient mesh HBONE tunnel traffic (port 15008)
    # In ambient mode, ztunnel tunnels ALL inter-pod traffic through port 15008.
    - ports:
        - protocol: TCP
          port: 15008  # HBONE mTLS tunnel
    # Allow ztunnel health probes via link-local address
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
    # Allow intra-namespace communication (Loki components)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3100   # Loki HTTP API
        - protocol: TCP
          port: 9095   # Loki gRPC
        - protocol: TCP
          port: 7946   # Loki memberlist
    # Allow Prometheus and Grafana from default namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 3100   # Loki metrics and query endpoint
        - protocol: TCP
          port: 12345  # Alloy metrics port
    # Allow Falcosidekick to push security events
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: falco
      ports:
        - protocol: TCP
          port: 3100   # Loki push API
  egress:
    # Allow HBONE tunnel traffic to any ambient mesh pod (port 15008)
    # In ambient mode, ztunnel rewrites the destination port to 15008.
    - ports:
        - protocol: TCP
          port: 15008  # HBONE mTLS tunnel
    # Allow DNS resolution via kube-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow Kubernetes API access (for Alloy pod discovery)
    # Service ClusterIP (10.96.0.1:443) and actual API server endpoint (10.0.10.0/24:6443)
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32  # Kubernetes API service ClusterIP
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 10.0.10.0/24  # Control plane node network
      ports:
        - protocol: TCP
          port: 6443  # API server port
    # Allow Loki to send alerts to AlertManager in default namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 9093  # AlertManager API
    # Allow internal communication within loki namespace (Loki components)
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3100
        - protocol: TCP
          port: 9095  # Loki gRPC
        - protocol: TCP
          port: 7946  # Loki memberlist
    # Allow Istio ambient mesh communication (ztunnel, istiod)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15008  # ztunnel HBONE
        - protocol: TCP
          port: 15012  # istiod gRPC
        - protocol: TCP
          port: 15017  # istiod webhook
