apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-network-policy
  namespace: loki
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}  # Apply to all pods in namespace
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Istio ambient mesh HBONE traffic from all meshed namespaces
    - from:
        - namespaceSelector:
            matchLabels:
              istio.io/dataplane-mode: ambient
      ports:
        - protocol: TCP
          port: 15008  # HBONE mTLS
    # Allow Promtail to push logs (within same namespace)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: loki
      ports:
        - protocol: TCP
          port: 3100  # Loki HTTP API
    # Allow Prometheus to scrape metrics from default namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 3100  # Loki metrics endpoint
    # Allow Grafana to query logs from default namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 3100  # Loki query API
  egress:
    # Allow DNS resolution via kube-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow Kubernetes API access (for Promtail pod discovery)
    # Service ClusterIP (10.96.0.1:443) and actual API server endpoint (10.0.10.0/24:6443)
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32  # Kubernetes API service ClusterIP
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 10.0.10.0/24  # Control plane node network
      ports:
        - protocol: TCP
          port: 6443  # API server port
    # Allow Loki to send alerts to AlertManager in default namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 9093  # AlertManager API
    # Allow internal communication within loki namespace (Loki components)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: loki
      ports:
        - protocol: TCP
          port: 3100
        - protocol: TCP
          port: 9095  # Loki gRPC
        - protocol: TCP
          port: 7946  # Loki memberlist
    # Allow Istio ambient mesh communication (ztunnel, istiod)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15008  # ztunnel HBONE
        - protocol: TCP
          port: 15012  # istiod gRPC
        - protocol: TCP
          port: 15017  # istiod webhook
