apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-network-policy
  namespace: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Istio ambient mesh HBONE tunnel (ztunnel rewrites dest port to 15008)
    - ports:
        - protocol: TCP
          port: 15008

    # ztunnel link-local health probes
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32

    # Strimzi operator — AdminClient reconciliation and rolling update checks.
    # describeMetadataQuorum first connects to bootstrap (9092), discovers the
    # controller endpoint (CONTROLPLANE-9090), then connects to port 9090.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: strimzi-system
      ports:
        - protocol: TCP
          port: 9090  # KRaft CONTROLPLANE (quorum controller)
        - protocol: TCP
          port: 9091  # Kafka REPLICATION (broker-to-broker)
        - protocol: TCP
          port: 9092  # Kafka PLAIN (bootstrap/AdminClient)

    # Kafka clients from Flink demo jobs (producer and consumer)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flink-demo
      ports:
        - protocol: TCP
          port: 9092  # Kafka plain listener

    # Inter-broker and KRaft controller communication within kafka namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka
      ports:
        - protocol: TCP
          port: 9090  # KRaft CONTROLPLANE
        - protocol: TCP
          port: 9091  # KRaft REPLICATION
        - protocol: TCP
          port: 9092  # Kafka plain listener
        - protocol: TCP
          port: 9404  # Prometheus JMX metrics

  egress:
    # DNS resolution via kube-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Kubernetes API server (ClusterIP)
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443

    # Kubernetes API server (control plane nodes)
    - to:
        - ipBlock:
            cidr: 10.0.10.0/24
      ports:
        - protocol: TCP
          port: 6443

    # ztunnel HBONE — bare rule required: ztunnel runs hostNetwork and binds to
    # node IPs, not istio-system pod IPs, so namespace-scoped selectors don't match.
    - ports:
        - protocol: TCP
          port: 15008

    # istiod control plane (xDS gRPC, webhook)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15012  # istiod gRPC
        - protocol: TCP
          port: 15017  # istiod webhook

    # Inter-broker and KRaft controller communication within kafka namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka
      ports:
        - protocol: TCP
          port: 9090  # KRaft CONTROLPLANE
        - protocol: TCP
          port: 9091  # KRaft REPLICATION
        - protocol: TCP
          port: 9092  # Kafka plain listener
