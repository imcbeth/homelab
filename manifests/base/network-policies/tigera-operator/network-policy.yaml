apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tigera-operator-network-policy
  namespace: tigera-operator
  labels:
    app.kubernetes.io/name: tigera-operator
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The operator pod doesn't serve any traffic - it only watches/manages

  egress:
    # DNS resolution via kube-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Kubernetes API server (ClusterIP + control plane)
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 10.0.10.0/24
      ports:
        - protocol: TCP
          port: 6443

    # Calico APIServer in calico-system namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: calico-system
      ports:
        - protocol: TCP
          port: 5443   # calico-apiserver
