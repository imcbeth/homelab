apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flink-demo-network-policy
  namespace: flink-demo
  labels:
    app.kubernetes.io/name: flink-demo
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Istio ambient mesh HBONE tunnel (ztunnel rewrites dest port to 15008)
    - ports:
        - protocol: TCP
          port: 15008

    # ztunnel link-local health probes
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32

    # Flink UI from ingress-nginx (browsing flink.k8s.n37.ca)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8081  # Flink REST API / UI

    # Uptime Kuma health monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
      ports:
        - protocol: TCP
          port: 8081  # Flink REST API (health check)

    # Flink internal: JobManager ↔ TaskManager communication
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flink-demo
      ports:
        - protocol: TCP
          port: 6123  # Flink RPC (JM ↔ TM)
        - protocol: TCP
          port: 6124  # Flink blob server
        - protocol: TCP
          port: 8081  # Flink REST API

    # Flink operator (flink-operator ns) manages FlinkDeployment pods
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flink-operator
      ports:
        - protocol: TCP
          port: 8081

  egress:
    # DNS resolution via kube-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Kubernetes API server (ClusterIP)
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443

    # Kubernetes API server (control plane nodes)
    - to:
        - ipBlock:
            cidr: 10.0.10.0/24
      ports:
        - protocol: TCP
          port: 6443

    # ztunnel HBONE — bare rule required: ztunnel runs hostNetwork and binds to
    # node IPs, not istio-system pod IPs, so namespace-scoped selectors don't match.
    - ports:
        - protocol: TCP
          port: 15008

    # istiod control plane (xDS gRPC, webhook)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15012  # istiod gRPC
        - protocol: TCP
          port: 15017  # istiod webhook

    # Kafka broker (for pipeline reading/writing to flink-events topic)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka
      ports:
        - protocol: TCP
          port: 9092  # Kafka plain listener

    # LocalStack S3 (kafka-to-s3 pipeline writes output here)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: localstack
      ports:
        - protocol: TCP
          port: 4566  # LocalStack S3 endpoint

    # Flink internal: JobManager ↔ TaskManager communication
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flink-demo
      ports:
        - protocol: TCP
          port: 6123
        - protocol: TCP
          port: 6124
        - protocol: TCP
          port: 8081
