# Metrics Server configuration for Raspberry Pi 5 Kubernetes Homelab
# Chart: metrics-server v3.13.0
# App: v0.8.0

# Image configuration
image:
  repository: registry.k8s.io/metrics-server/metrics-server
  pullPolicy: IfNotPresent

# Resource limits for Pi cluster
resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Metrics Server arguments
args:
  - --kubelet-insecure-tls
  # ⚠️  SECURITY TRADE-OFF: Disables TLS certificate validation for kubelet connections
  # This is necessary for homelab environments where kubelets use self-signed certificates
  # that are not signed by a trusted CA. This introduces a security risk by allowing
  # potential man-in-the-middle attacks on kubelet → metrics-server communication.
  #
  # Production alternative: Use proper kubelet certificates signed by a trusted CA
  # (e.g., via kubeadm --certificate-key or external PKI). For homelab use, the risk
  # is acceptable given the isolated network environment and lack of sensitive workloads.

  - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
  # Prefer internal IP for kubelet communication
  # Ensures metrics-server can reach kubelets on the Pi cluster network (10.0.50.x)

# API Service configuration
apiService:
  create: true
  # ⚠️  SECURITY TRADE-OFF: Bypasses TLS verification for the metrics API endpoint
  # This disables TLS certificate validation when the kube-aggregator (API aggregation
  # layer within the kube-apiserver) proxies requests to the metrics-server API. This
  # introduces a security risk by allowing potential man-in-the-middle attacks on
  # API server → metrics-server communication.
  #
  # Production alternative: Generate proper TLS certificates using cert-manager
  # (already deployed at wave -10) and configure metrics-server to use them:
  #   1. Create Certificate resource for metrics-server.kube-system.svc
  #   2. Mount certificate secret in metrics-server pod
  #   3. Configure --tls-cert-file and --tls-private-key-file args
  #   4. Set insecureSkipTLSVerify: false
  #
  # For homelab use with self-signed certificates where distributing a CA bundle is
  # not feasible, this setting is acceptable given the isolated network environment.
  insecureSkipTLSVerify: true
  annotations: {}

# RBAC configuration
rbac:
  create: true
  pspEnabled: false  # PodSecurityPolicy removed in Kubernetes 1.25 (replaced by Pod Security Standards)

# Service Account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Replicas
replicas: 1
# Single replica sufficient for homelab
# HA not required for metrics collection

# Security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

# Pod priority
priorityClassName: system-cluster-critical
# Ensures metrics-server pods are not evicted under resource pressure

# Host networking
hostNetwork:
  enabled: false
# Not required for this cluster
# Calico CNI provides pod-to-kubelet connectivity

# Service configuration
service:
  type: ClusterIP
  port: 443
  annotations: {}
  labels: {}

# Prometheus ServiceMonitor
serviceMonitor:
  enabled: true
  # Enable Prometheus scraping of metrics-server metrics
  additionalLabels:
    release: kube-prometheus-stack
  interval: 1m
  scrapeTimeout: 10s

# Liveness probe
livenessProbe:
  httpGet:
    path: /livez
    port: https
    scheme: HTTPS
  initialDelaySeconds: 0
  periodSeconds: 10
  failureThreshold: 3

# Readiness probe
readinessProbe:
  httpGet:
    path: /readyz
    port: https
    scheme: HTTPS
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 3

# Node selector
nodeSelector: {}
# Deploy on any node

# Tolerations
tolerations: []
# No special tolerations needed

# Affinity
affinity: {}
# No affinity constraints

# Common labels
commonLabels:
  app.kubernetes.io/component: metrics
  app.kubernetes.io/part-of: kubernetes

# Pod labels
podLabels: {}

# Pod annotations
podAnnotations: {}

# Update strategy
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Revision history
revisionHistoryLimit: 10

# Notes:
# - Metrics Server collects resource metrics from Kubelets
# - Provides metrics for kubectl top nodes/pods commands
# - Required for Horizontal Pod Autoscaler (HPA)
# - Metrics available via metrics.k8s.io API
# - Resource overhead: ~50m CPU, ~100Mi RAM (minimal impact on Pi cluster)
#
# Optional configuration:
# - Metric resolution can be reduced from default 60s to 15s for faster updates:
#   args:
#     - --metric-resolution=15s
#   (Note: This increases CPU usage and is generally unnecessary for homelab use)
