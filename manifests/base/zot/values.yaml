# Zot OCI Registry Helm values
# Cluster: 5x Raspberry Pi 5 (16GB, ARM64)
# Registry URL: https://registry.k8s.n37.ca
# Image: ghcr.io/project-zot/zot (linux/arm64/v8 confirmed)

image:
  repository: ghcr.io/project-zot/zot
  tag: "v2.1.22"

replicaCount: 1

# Persistence via Synology iSCSI (creates StatefulSet instead of Deployment)
persistence: true
pvc:
  create: true
  storageClassName: synology-iscsi-delete
  storage: 50Gi
  accessModes: ["ReadWriteOnce"]

# Resource limits — must satisfy Gatekeeper container-limits (max 2Gi memory)
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 2Gi  # Trivy CVE DB needs ~1.5Gi on first load

# SYNC PREFIXES — do not change these back to "**".
#
# This registry serves two purposes at once: a pull-through cache for upstream
# images, AND the push target for images we build in-cluster (lifeonabike/,
# flink-demo/).
#
# With content prefix "**", every upstream is asked about EVERY repo, including
# our own local ones. On a push the client HEADs the manifest first; zot does not
# find it locally, tries on-demand sync against all four upstreams, they all fail
# (unauthorized / repository does not exist), and zot answers 503 rather than
# 404. Kaniko treats that as fatal:
#
#   error pushing image: ... HEAD .../manifests/<sha>:
#   unexpected status code 503 Service Unavailable
#
# That silently broke the lifeonabike publish pipeline from 2026-10-11 (the zot
# v2.1.22 / chart 0.1.128 bump) until 2026-10-27, because nothing merged to that
# repo in between.
#
# So list only the namespaces actually mirrored from each upstream. A namespace
# NOT listed is treated as local-only, and a missing tag returns a clean 404 —
# which is exactly what a push needs.
#
# Adding a new pull-through image means adding its prefix below. A missing prefix
# shows up as a 404 on pull, which is obvious; blanket "**" failed in the far
# more confusing direction.

# ACCESS CONTROL — why there are two users
#
# There used to be exactly one: `admin`, with read/create/update/delete on
# every repository. And `lifeonabike-registry-creds`, mounted into the
# PUBLIC-FACING web pod, was that admin credential. A compromise of the blog
# frontend therefore handed over the ability to replace or delete any image
# in this registry, including ones other workloads pull — a supply-chain
# foothold reachable from the most exposed pod in the cluster.
#
# `defaultPolicy: ["read"]` grants read to any AUTHENTICATED user, which is
# the whole of what a pull-only consumer needs. The `puller` user added to
# the htpasswd uses it; `lifeonabike` now mounts those credentials instead
# of admin, and admin is left to the build pipeline in argo-workflows, which
# genuinely needs create/update to push.
#
# `anonymousPolicy: ["read"]` is DELIBERATELY unchanged. Every pod in the
# cluster pulls through registry.k8s.n37.ca without credentials — external-dns,
# trivy-system, argo-workflows and the kubectl CronJobs among them — so
# closing it is not a config edit, it is an imagePullSecret rollout across
# every consumer. Leaving it in place also means this change cannot break a
# pull: if the puller policy were wrong, anonymous read still serves it.
#
# NEXT STEP, deliberately not taken here: set "anonymousPolicy": [] to close
# the registry. Blocked on two things — wiring a pull secret into the
# flink-demo FlinkDeployments (their podTemplates have none today, so they
# would ImagePullBackOff on next restart), and doing the same for every
# namespace that pulls an upstream mirror through this cache.
#
# Mount the Zot config from ConfigMap
mountConfig: true
configFiles:
  config.json: |-
    {
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "gc": true,
        "gcDelay": "1h",
        "gcInterval": "24h"
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "auth": {
          "htpasswd": {
            "path": "/secret/htpasswd"
          }
        },
        "accessControl": {
          "repositories": {
            "**": {
              "defaultPolicy": ["read"],
              "anonymousPolicy": ["read"]
            }
          },
          "adminPolicy": {
            "users": ["admin"],
            "actions": ["read", "create", "update", "delete"]
          }
        }
      },
      "log": {
        "level": "info"
      },
      "extensions": {
        "sync": {
          "enable": true,
          "registries": [
            {
              "urls": ["https://registry-1.docker.io"],
              "onDemand": true,
              "tlsVerify": true,
              "content": [
                {"prefix": "library/**"},
                {"prefix": "alpine/**"},
                {"prefix": "bitnami/**"}
              ]
            },
            {
              "urls": ["https://ghcr.io"],
              "onDemand": true,
              "tlsVerify": true,
              "content": [
                {"prefix": "kashalls/**"}
              ]
            },
            {
              "urls": ["https://quay.io"],
              "onDemand": true,
              "tlsVerify": true,
              "content": [
                {"prefix": "prometheus/**"},
                {"prefix": "prometheus-operator/**"},
                {"prefix": "argoproj/**"}
              ]
            },
            {
              "urls": ["https://registry.k8s.io"],
              "onDemand": true,
              "tlsVerify": true,
              "content": [
                {"prefix": "external-dns/**"},
                {"prefix": "sig-storage/**"},
                {"prefix": "ingress-nginx/**"}
              ]
            }
          ]
        },
        "search": {
          "enable": true,
          "cve": {
            "updateInterval": "2h"
          }
        },
        "ui": {
          "enable": true
        },
        "metrics": {
          "enable": true,
          "prometheus": {
            "path": "/metrics"
          }
        },
        "scrub": {
          "enable": true,
          "interval": "24h"
        }
      }
    }

# Mount the SealedSecret (zot-htpasswd) for htpasswd auth
# Uses externalSecrets so we manage the secret via SealedSecrets, not the chart
externalSecrets:
  - secretName: zot-htpasswd
    mountPath: /secret

# Service — ClusterIP, ingress-nginx handles external access
service:
  type: ClusterIP
  port: 5000

# Ingress via ingress-nginx + cert-manager + external-dns
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: lets-encrypt-k8s-n37-ca-prod
    external-dns.alpha.kubernetes.io/hostname: registry.k8s.n37.ca
    external-dns.alpha.kubernetes.io/ttl: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - host: registry.k8s.n37.ca
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: zot-tls
      hosts:
        - registry.k8s.n37.ca

# Prometheus ServiceMonitor
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: "60s"
    path: "/metrics"

# headless service for StatefulSet (not needed for single replica)
serviceHeadless:
  enabled: false

# Recreate strategy required for RWO iSCSI volumes (only one node can attach)
strategy:
  type: Recreate

# Probe config
httpGet:
  scheme: HTTP
  port: 5000
  path: /v2/
