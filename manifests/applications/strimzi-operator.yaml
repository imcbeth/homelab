apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Deploy after Flink operator (-3), before Kafka cluster (+1)
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: infrastructure
  sources:
    # Strimzi Kafka Operator Helm chart
    - repoURL: https://strimzi.io/charts/
      chart: strimzi-kafka-operator
      targetRevision: 1.2.0
      helm:
        valueFiles:
          - $values/manifests/base/strimzi-operator/values.yaml
    # Values reference from homelab repo
    - repoURL: git@github.com:imcbeth/homelab.git
      targetRevision: HEAD
      ref: values
  # Chart 1.2.0 renders `properties: {}` at
  # .spec.versions[0].schema.openAPIV3Schema.properties.status
  #   .properties.clusterSecurity.properties
  # The apiserver strips empty `properties` maps when persisting a CRD schema,
  # so the rendered manifest and the live object can NEVER converge — the app
  # sits OutOfSync forever and selfHeal retries indefinitely. Same family as
  # the documented "apiextensions/v1 CRD field defaulting" gotcha
  # (priority=0, conversion.strategy=None).
  #
  # Scoped as tightly as possible: only this CRD, only that one schema node.
  # A real schema change anywhere else still shows as drift.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: kafkas.kafka.strimzi.io
      jqPathExpressions:
        - '.spec.versions[].schema.openAPIV3Schema.properties.status.properties.clusterSecurity.properties'
  destination:
    server: https://kubernetes.default.svc
    namespace: strimzi-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
