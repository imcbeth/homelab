apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-44"
spec:
  project: infrastructure
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
        - .webhooks[].failurePolicy
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
        - .webhooks[].failurePolicy
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .metadata.labels
        - .metadata.annotations
        - .spec.template.metadata.labels
        - .spec.template.metadata.annotations
  sources:
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: istiod
      targetRevision: 1.29.3
      helm:
        releaseName: istiod
        valueFiles:
          - $values/manifests/base/istio/istiod-values.yaml
    - repoURL: git@github.com:imcbeth/homelab.git
      path: manifests/base/istio
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ztunnel
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-42"
spec:
  project: infrastructure
  ignoreDifferences:
    - group: apps
      kind: DaemonSet
      jqPathExpressions:
        - .metadata.labels
        - .metadata.annotations
        - .spec.revisionHistoryLimit
        - .spec.template.metadata.labels
        - .spec.template.metadata.annotations
        - .spec.template.spec.containers[].imagePullPolicy
        - .spec.template.spec.containers[].terminationMessagePath
        - .spec.template.spec.containers[].terminationMessagePolicy
        - .spec.template.spec.containers[].env[].valueFrom.fieldRef.apiVersion
        - .spec.template.spec.containers[].env[].valueFrom.resourceFieldRef.divisor
        - .spec.template.spec.containers[].readinessProbe.failureThreshold
        - .spec.template.spec.containers[].readinessProbe.periodSeconds
        - .spec.template.spec.containers[].readinessProbe.successThreshold
        - .spec.template.spec.containers[].readinessProbe.timeoutSeconds
        - .spec.template.spec.containers[].readinessProbe.httpGet.scheme
        - .spec.template.spec.dnsPolicy
        - .spec.template.spec.restartPolicy
        - .spec.template.spec.schedulerName
        - .spec.template.spec.securityContext
        - .spec.template.spec.serviceAccount
        - .spec.template.spec.volumes[].projected.defaultMode
        - .spec.template.spec.volumes[].configMap.defaultMode
  sources:
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: ztunnel
      targetRevision: 1.29.3
      helm:
        releaseName: ztunnel
        valueFiles:
          - $values/manifests/base/istio/ztunnel-values.yaml
    - repoURL: git@github.com:imcbeth/homelab.git
      path: manifests/base/istio
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
