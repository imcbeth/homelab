apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vpa
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: infrastructure
  sources:
    # Fairwinds VPA Helm chart (installs CRDs + Recommender)
    - repoURL: https://charts.fairwinds.com/stable
      chart: vpa
      targetRevision: 4.11.0
      helm:
        releaseName: vpa
        valueFiles:
          - $values/manifests/base/vpa/values.yaml
    # Values file reference
    - repoURL: git@github.com:imcbeth/homelab.git
      targetRevision: HEAD
      ref: values
    # VPA objects for key workloads (deployed after CRDs via sync wave)
    - repoURL: git@github.com:imcbeth/homelab.git
      path: manifests/base/vpa
      targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
