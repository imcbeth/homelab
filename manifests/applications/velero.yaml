apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: infrastructure
  sources:
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: 12.1.0
      helm:
        releaseName: velero
        valueFiles:
          - $values/manifests/base/velero/values.yaml
    - repoURL: git@github.com:imcbeth/homelab.git
      path: manifests/base/velero
      targetRevision: HEAD
      ref: values
    # Additional resources (SealedSecrets for B2 credentials)
    - repoURL: git@github.com:imcbeth/homelab.git
      path: manifests/base/velero
      targetRevision: HEAD
    # Monthly restore validation. Kept in a SEPARATE path because the
    # kustomization above sets `namespace: velero`, which would rewrite the
    # validator's velero-restore-test RoleBinding into velero and silently
    # break its permissions. That directory has no namespace transformer.
    - repoURL: git@github.com:imcbeth/homelab.git
      path: manifests/base/velero-restore-validator
      targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
