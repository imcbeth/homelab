apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tigera-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Deploy early - CNI is foundational infrastructure
    argocd.argoproj.io/sync-wave: "-100"
spec:
  project: infrastructure
  source:
    # Kustomize overlay: fetches upstream tigera-operator.yaml, adds resource limits patch,
    # and includes Installation + APIServer CRs
    repoURL: git@github.com:imcbeth/homelab.git
    path: manifests/base/tigera-operator
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    # Operator creates its own namespace from manifest
    namespace: tigera-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    # Calico operator modifies these resources at runtime
    - group: crd.projectcalico.org
      kind: IPPool
      jsonPointers:
        - /metadata/annotations
    - group: operator.tigera.io
      kind: Installation
      jsonPointers:
        - /status
        - /metadata/finalizers
        - /spec/cni
        - /spec/flexVolumePath
        - /spec/kubeletVolumePluginPath
        - /spec/logging
        - /spec/nodeUpdateStrategy
        - /spec/nonPrivileged
        - /spec/registry
        - /spec/calicoNetwork/hostPorts
        - /spec/calicoNetwork/linuxDataplane
        - /spec/calicoNetwork/linuxPolicySetupTimeoutSeconds
        - /spec/calicoNetwork/multiInterfaceMode
        - /spec/calicoNetwork/windowsDataplane
      jqPathExpressions:
        - .spec.calicoNetwork.ipPools[].allowedUses
        - .spec.calicoNetwork.ipPools[].assignmentMode
        - .spec.calicoNetwork.ipPools[].disableBGPExport
        - .spec.calicoNetwork.ipPools[].disableNewAllocations
    # Calico APIServer CR - operator populates status/finalizers
    - group: operator.tigera.io
      kind: APIServer
      jsonPointers:
        - /status
        - /metadata/finalizers
    # CRDs have runtime fields that differ from upstream
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .metadata.annotations
        - .spec.preserveUnknownFields
