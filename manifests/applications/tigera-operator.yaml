apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tigera-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Deploy early - CNI is foundational infrastructure
    argocd.argoproj.io/sync-wave: "-100"
spec:
  project: infrastructure
  sources:
    # Tigera operator from official GitHub release
    - repoURL: https://github.com/projectcalico/calico.git
      targetRevision: v3.31.3
      path: manifests
      directory:
        include: 'tigera-operator.yaml'
    # Installation CR from homelab repository
    - repoURL: git@github.com:imcbeth/homelab.git
      path: manifests/base/tigera-operator
      targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    # Operator creates its own namespace from manifest
    namespace: tigera-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    # Calico operator modifies these resources at runtime
    - group: crd.projectcalico.org
      kind: IPPool
      jsonPointers:
        - /metadata/annotations
    - group: operator.tigera.io
      kind: Installation
      jsonPointers:
        - /status
        - /spec/cni
        - /spec/flexVolumePath
        - /spec/kubeletVolumePluginPath
        - /spec/logging
        - /spec/nodeUpdateStrategy
        - /spec/nonPrivileged
        - /spec/registry
        - /spec/calicoNetwork/hostPorts
        - /spec/calicoNetwork/linuxDataplane
        - /spec/calicoNetwork/linuxPolicySetupTimeoutSeconds
        - /spec/calicoNetwork/multiInterfaceMode
        - /spec/calicoNetwork/windowsDataplane
    # CRDs have runtime fields that differ from upstream
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .metadata.annotations
        - .spec.preserveUnknownFields
