apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
    # Helm chart from Aqua Security repository
    - repoURL: https://aquasecurity.github.io/helm-charts/
      chart: trivy-operator
      # Chart version. Deliberately NOT annotated with the app version:
      # the comment here read "app version 0.29.0" while the running image
      # was 0.36.1, having rotted silently across several chart bumps because
      # Renovate updates the version it manages and leaves prose alone.
      # Read it from the cluster instead:
      #   kubectl get deploy -n trivy-system trivy-operator \
      #     -o jsonpath='{.spec.template.spec.containers[0].image}'
      targetRevision: 0.38.1
      helm:
        valueFiles:
          - $values/manifests/base/trivy-operator/values.yaml
    # Values file from homelab git repository
    - repoURL: git@github.com:imcbeth/homelab.git
      path: manifests/base/trivy-operator
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    # Prevent StatefulSet VolumeClaimTemplate spec changes from triggering
    # delete+recreate of the trivy-server StatefulSet (which orphans the iSCSI LUN)
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates
