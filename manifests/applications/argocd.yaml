apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
spec:
  project: infrastructure
  sources:
    - chart: argo-cd
      repoURL: https://argoproj.github.io/argo-helm
      targetRevision: 10.18.0 # specify the argocd version to install
      helm:
        releaseName: argocd
        valueFiles:
          - $argocd/manifests/base/argocd/argocd-config.yaml
    - path: manifests/base/argocd
      repoURL: git@github.com:imcbeth/homelab.git
      targetRevision: HEAD
      ref: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Enrols argocd in the Istio ambient mesh (O17, 2026-11-17), so the hop
    # from lan-gateway to argocd-server (plain HTTP since server.insecure) and
    # argocd's internal traffic run inside HBONE mTLS. Set here rather than in
    # a Namespace manifest, which some other app would own and could prune.
    # The NetworkPolicy and AuthorizationPolicy that admit HBONE are in
    # manifests/base/network-policies/argocd/ and must be live first.
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
