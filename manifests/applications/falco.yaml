apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Deploy after monitoring stack for Prometheus/Loki integration
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: infrastructure
  sources:
    # Helm chart from Falco repository
    - repoURL: https://falcosecurity.github.io/charts
      chart: falco
      targetRevision: 8.0.5
      helm:
        valueFiles:
          - $values/manifests/base/falco/values.yaml
    # Values file from homelab git repository
    - repoURL: git@github.com:imcbeth/homelab.git
      path: manifests/base/falco
      targetRevision: HEAD
      ref: values
    # Additional manifests (ingress, alerts)
    - repoURL: git@github.com:imcbeth/homelab.git
      path: manifests/base/falco
      targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
