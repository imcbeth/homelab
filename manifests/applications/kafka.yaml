apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Deploy after Strimzi operator is ready (-2)
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: infrastructure
  source:
    repoURL: git@github.com:imcbeth/homelab.git
    targetRevision: HEAD
    path: manifests/base/kafka
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      # Strimzi operator may take time to become ready; allow retries
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
