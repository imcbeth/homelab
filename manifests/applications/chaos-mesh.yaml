apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-mesh
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Deploy after Gatekeeper policies (-5) and monitoring (-4)
    # Chaos tooling is non-critical infrastructure
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: infrastructure
  sources:
    # Chaos Mesh Helm chart
    - repoURL: https://charts.chaos-mesh.org
      chart: chaos-mesh
      targetRevision: 2.8.3
      helm:
        valueFiles:
          - $values/manifests/base/chaos-mesh/values.yaml
    # Values reference from homelab repo
    - repoURL: git@github.com:imcbeth/homelab.git
      path: manifests/base/chaos-mesh
      targetRevision: HEAD
      ref: values
    # Additional manifests (ServiceMonitor, experiments)
    - repoURL: git@github.com:imcbeth/homelab.git
      path: manifests/base/chaos-mesh
      targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: chaos-mesh
  # Ignore cert/webhook fields auto-populated by chaos-mesh controller
  ignoreDifferences:
    # TLS certificates generated and populated by the chaos-mesh controller
    - kind: Secret
      name: chaos-mesh-chaosd-client-certs
      jsonPointers:
        - /data
    - kind: Secret
      name: chaos-mesh-daemon-certs
      jsonPointers:
        - /data
    - kind: Secret
      name: chaos-mesh-daemon-client-certs
      jsonPointers:
        - /data
    - kind: Secret
      name: chaos-mesh-webhook-certs
      jsonPointers:
        - /data
    # caBundle auto-populated by chaos-mesh controller from webhook certs
    # Note: group field required for cluster-scoped resources (webhook configs) to match
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: chaos-mesh-mutation
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: chaos-mesh-validation
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: chaos-mesh-validation-auth
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    # Kubernetes-defaulted fields on DaemonSet and Deployment (imagePullPolicy, etc.)
    - kind: DaemonSet
      name: chaos-daemon
      jqPathExpressions:
        - .spec.template.spec.containers[].imagePullPolicy
        - .spec.template.spec.initContainers[].imagePullPolicy
        - .spec.revisionHistoryLimit
        - .spec.template.metadata.annotations.rollme
    - kind: Deployment
      name: chaos-controller-manager
      jqPathExpressions:
        - .spec.template.spec.containers[].imagePullPolicy
        - .spec.revisionHistoryLimit
        - .spec.template.metadata.annotations.rollme
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
