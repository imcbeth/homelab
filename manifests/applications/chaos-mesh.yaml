apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-mesh
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Deploy after Gatekeeper policies (-5) and monitoring (-4)
    # Chaos tooling is non-critical infrastructure
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: infrastructure
  sources:
    # Chaos Mesh Helm chart
    - repoURL: https://charts.chaos-mesh.org
      chart: chaos-mesh
      targetRevision: 2.8.9
      helm:
        valueFiles:
          - $values/manifests/base/chaos-mesh/values.yaml
    # Values reference from homelab repo
    - repoURL: git@github.com:imcbeth/homelab.git
      path: manifests/base/chaos-mesh
      targetRevision: HEAD
      ref: values
    # Additional manifests (ServiceMonitor, experiments)
    - repoURL: git@github.com:imcbeth/homelab.git
      path: manifests/base/chaos-mesh
      targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: chaos-mesh
  # Ignore cert/webhook fields the chart regenerates on every render (Helm
  # genCA). RespectIgnoreDifferences below keeps the live values on sync.
  ignoreDifferences:
    # TLS certificates (Helm-generated; must stay one CA across all pods)
    - kind: Secret
      name: chaos-mesh-chaosd-client-certs
      jsonPointers:
        - /data
    - kind: Secret
      name: chaos-mesh-daemon-certs
      jsonPointers:
        - /data
    - kind: Secret
      name: chaos-mesh-daemon-client-certs
      jsonPointers:
        - /data
    - kind: Secret
      name: chaos-mesh-webhook-certs
      jsonPointers:
        - /data
    # caBundle auto-populated by chaos-mesh controller from webhook certs
    # Note: group field required for cluster-scoped resources (webhook configs) to match
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: chaos-mesh-mutation
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: chaos-mesh-validation
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: chaos-mesh-validation-auth
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    # Kubernetes-defaulted fields on DaemonSet and Deployment (imagePullPolicy, etc.)
    - kind: DaemonSet
      name: chaos-daemon
      jqPathExpressions:
        - .spec.template.spec.containers[].imagePullPolicy
        - .spec.template.spec.initContainers[].imagePullPolicy
        - .spec.revisionHistoryLimit
        - .spec.template.metadata.annotations.rollme
    - kind: Deployment
      name: chaos-controller-manager
      jqPathExpressions:
        - .spec.template.spec.containers[].imagePullPolicy
        - .spec.revisionHistoryLimit
        - .spec.template.metadata.annotations.rollme
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Keep the live values of every ignoreDifferences field on sync. The
      # chart generates a new CA and certs on every render, and without this
      # each sync (e.g. the 2.8.8 upgrade, 2026-11-11) rewrote the cert
      # secrets after the pods had started. The daemons kept serving certs
      # from the old CA; when the controller next restarted (2026-11-17) it
      # loaded the new one and rejected them all ("x509: certificate signed
      # by unknown authority"), so the 2026-11-18 network-delay-loki run
      # injected nothing. ignoreDifferences alone only hides the drift.
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
