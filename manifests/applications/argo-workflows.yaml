apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
    # Without this, Argo CD reports this app Synced while WorkflowTemplate /
    # CronWorkflow specs are stale, and selfHeal never fires.
    #
    # Upstream argo-cd#27625 (open as of 2026-11-15). The chart's minified CRDs
    # declare `spec` as `x-kubernetes-map-type: atomic` +
    # `preserve-unknown-fields`, so the apiserver records argocd-controller as
    # owning `f:spec: {}` -- one leaf, no subfields. Server-side diff's
    # removeWebhookMutation then treats every field under spec as "not ours",
    # reverts it to the live value, and the diff comes out empty.
    #
    # Seen 2026-11-15: after #1153 both lifeonabike build templates kept
    # alpine/git:v2.54.0 under a Synced app, through a hard refresh, until a
    # manual sync. IncludeMutationWebhook=true skips that step; writes still use
    # ServerSideApply. Verified live: a hand-edit to hello-world's spec went
    # OutOfSync in 5 s and was self-healed in 16 s, and the annotation alone
    # produced no false drift. argo-events is not affected (its CRDs are
    # preserve-unknown-fields without atomic, so fields are tracked granularly).
    #
    # Remove once #27625 is fixed, or if the chart moves to full CRDs
    # (crds.full: true), which give spec a real schema.
    argocd.argoproj.io/compare-options: IncludeMutationWebhook=true
spec:
  project: infrastructure
  sources:
    # Helm chart from Argo project
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-workflows
      targetRevision: 2.0.19
      helm:
        releaseName: argo-workflows
        valueFiles:
          - $values/manifests/base/argo-workflows/values.yaml
    # Values file reference (ref only — no path, to avoid duplicate manifest rendering)
    - repoURL: git@github.com:imcbeth/homelab.git
      targetRevision: HEAD
      ref: values
    # Additional resources (SealedSecret, WorkflowTemplates)
    - repoURL: git@github.com:imcbeth/homelab.git
      path: manifests/base/argo-workflows
      targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-workflows
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
